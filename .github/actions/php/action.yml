# Środowisko PHP dla joba CI — dwa kroki, które muszą iść RAZEM.
#
# PO CO TO ISTNIEJE
# `shivammathur/setup-php` nadpisuje binarki narzędzi w miejscu, z którego się
# je potem wykonuje, a domyślnie jest to ścieżka wspólna dla całej maszyny
# (`/usr/local/bin`). Trzy runnery tego repozytorium to trzy rejestracje na
# JEDNEJ maszynie, więc dzielą ten katalog. 10 września 2026 o 11:53:47 UTC
# job „Testy (PostgreSQL 18)" padł przez to z kodem 126 na `composer install`,
# nie uruchomiwszy ani jednego testu: „composer: bad interpreter: Text file
# busy". Piszącym był sąsiedni job z tego samego przebiegu (issue #262).
#
# Lekarstwo to własny katalog narzędzi per job — ale działa TYLKO wtedy, gdy
# zmienne są wyeksportowane PRZED `setup-php`: akcja czyta je w chwili
# uruchomienia. Dopóki oba kroki stały osobno w dziewięciu jobach, kolejność
# dało się odwrócić przy nieuwadze, a lista rozszerzeń PHP była przepisana
# dziewięć razy.
#
# Tutaj są nierozłączne i stoją raz. Job nie może już wziąć jednego bez
# drugiego ani w złej kolejności.
#
# DLACZEGO `GITHUB_JOB` DZIAŁA W COMPOSITE
# Kroki composite action wykonują się w kontekście joba, który ich używa —
# `RUNNER_TEMP`, `GITHUB_RUN_ID` i `GITHUB_JOB` mają więc wartości TEGO joba,
# czyli ścieżka zostaje prywatna dla każdego joba osobno. Pilnuje tego
# `CiDajeKazdemuJobowiWlasneNarzedziaTest`, który czyta ten plik razem
# z `ci.yml`.
#
# DLACZEGO WERSJA JEST WEJŚCIEM, A NIE `env.PHP_VERSION`
# Wewnątrz composite action kontekst `env` to środowisko akcji, nie workflow.
# Poleganie na `${{ env.PHP_VERSION }}` tutaj byłoby zgadywaniem — wersja
# wchodzi więc jawnie, a job podaje ją ze swojego `env`.

# ---------------------------------------------------------------------------
# PEŁNE UZASADNIENIE, przeniesione tu z joba `lint` w `ci.yml`.
# Dopóki oba kroki stały w dziewięciu jobach, ta argumentacja mieszkała
# w jednym z nich, a pozostałe odsyłały do niego komentarzem. Teraz kod
# stoi w jednym miejscu, więc i uzasadnienie stoi przy nim.
# ---------------------------------------------------------------------------
# =====================================================================
#  WŁASNY KOMPLET NARZĘDZI NA KAŻDY JOB — inaczej CI oblewa losowo
#  na „composer: bad interpreter: Text file busy" (issue #262)
# =====================================================================
#  CO SIĘ STAŁO 10 WRZEŚNIA 2026 o 11:53:47 UTC (przebieg 34473498102,
#  gałąź `claude/kolejne-zdjecie-autora`). Job „Testy (PostgreSQL 18)"
#  padł z kodem 126 na kroku `composer install`, NIE URUCHAMIAJĄC ANI
#  JEDNEGO TESTU:
#
#      …/_work/_temp/b904f771….sh: …/_work/_tool/setup-php/tools/composer:
#        /usr/bin/env: bad interpreter: Text file busy
#
#  SKĄD TO SIĘ BIERZE. „Text file busy" (ETXTBSY) dostaje ten, kto robi
#  `execve()` na pliku, który W TEJ SAMEJ CHWILI ktoś inny trzyma
#  otwarty do zapisu. A `shivammathur/setup-php` zapisuje binarkę
#  narzędzia PROSTO W MIEJSCE, z którego się ją potem wykonuje, i to
#  miejsce jest domyślnie WSPÓLNE DLA CAŁEJ MASZYNY:
#
#    * `tool_path_dir` to domyślnie `/usr/local/bin`
#      (`src/scripts/unix.sh` w akcji, funkcja `read_env`);
#    * `add_tool()` nadpisuje ten plik w miejscu — `sudo cp -a` z cache
#      albo `sudo curl -o` wprost na niego
#      (`src/scripts/tools/add_tools.sh`);
#    * ścieżka z komunikatu, `…/_tool/setup-php/tools/composer`, jest
#      tylko DOWIĄZANIEM do tamtego pliku (`ln -sfn` w tej samej
#      funkcji). Dlatego komunikat wskazuje katalog runnera, a zajęty
#      jest plik wspólny.
#
#  Blokada, którą akcja ma u siebie (`/tmp/sp-lck-…` w `get()`),
#  serializuje tylko PISZĄCYCH. Nie wie nic o jobie, który w tej samej
#  sekundzie ten plik WYKONUJE — a to jest właśnie nasz przypadek.
#
#  DLACZEGO TO NAS DOTYCZY: `kuking-wsl-DOM-NEW-01`…`-03` to trzy
#  REJESTRACJE NA JEDNEJ MASZYNIE (jedno `/home/mateusz`, jedno
#  `/usr/local/bin`), a siedem jobów tego workflow startuje równolegle.
#  W tym przebiegu pisał job „Dostępność" na runnerze `-02` (jego krok
#  „Konfiguracja PHP" trwał 11:53:46→11:53:47), a wykonywał job „Testy"
#  na `-03` o 11:53:47,54. Oba były z TEGO SAMEGO przebiegu i tej samej
#  gałęzi.
#
#  DLACZEGO NIE WSPÓLNA GRUPA `concurrency` (propozycja 1 z #262):
#  skoro biją się joby jednego przebiegu, grupa po `github.ref` nie
#  rozdziela ich w ogóle. Grupa wspólna dla wszystkich przebiegów też
#  tego nie robi — a przy tym trzyma jeden bieg działający i JEDEN
#  oczekujący, więc trzeci ANULUJE oczekującego (to samo uzasadnienie
#  stoi przy kroku „Przeglądarka" niżej). Zamieniłoby to losową
#  czerwień na anulowane joby i dłuższą kolejkę.
#
#  DLACZEGO NIE PONOWIENIE KROKU: retry ukrywa wyścig, nie usuwa go —
#  i uczy, że czerwone CI się powtarza, a nie czyta.
#
#  CO ROBI TEN KROK: daje jobowi WŁASNY katalog na binarki narzędzi
#  (`$RUNNER_TEMP` + numer przebiegu + nazwa joba), więc nie ma już
#  pliku, do którego jeden job pisze, a drugi go wykonuje. Wyścig
#  znika konstrukcyjnie, nie statystycznie.
#
#  DLACZEGO KATALOG ZAKŁADAMY SAMI, a nie zostawiamy tego akcji:
#  akcja robi `sudo mkdir -p`, czyli katalog byłby rootowy. Rootowy
#  katalog w `_temp` blokuje potem sprzątanie katalogu roboczego przez
#  runnera (runner chodzi jako zwykły użytkownik). Zakładamy więc
#  katalog jako on, a plik w środku może być rootowy — usunąć go wolno
#  temu, kto ma prawo zapisu do KATALOGU.
#
#  KOSZT: Composer (~3 MB) pobiera się raz na job, zamiast być brany
#  z maszyny. Sekundy na job — i po nich CI przestaje zależeć od tego,
#  czy sąsiedni job właśnie nie podmienia binarki.
#
#  NODE TEGO NIE POTRZEBUJE i to jest ZMIERZONE, nie założone:
#  `actions/setup-node` trzyma Node w `_work/_tool` KAŻDEGO runnera
#  osobno („Found in cache @ …/actions-runner-kuking-03/_work/_tool/
#  node/22.23.2/x64" w logu joba dostępności z 10.09), a jeden runner
#  wykonuje jeden job naraz. Wspólnej ścieżki dla Node'a tu nie ma.
#  Szczegóły i sposób rozpoznania nawrotu: docs/infra/SELF_HOSTED_RUNNER.md.
# =====================================================================
#
# LISTA ROZSZERZEŃ — jedna dla wszystkich jobów.
# TA SAMA LISTA WE WSZYSTKICH PIĘCIU JOBACH — higiena, nie łatka.
#
# Trzy runnery stoją na JEDNEJ maszynie i dzielą jedną instalację PHP.
# Pięć jobów prosiło o pięć różnych zestawów rozszerzeń; przy wspólnym
# PHP to jest proszenie się o kłopot, nawet jeśli dziś nikt na tym nie
# padł. Jedna lista znaczy: obojętne, który job konfigurował ostatni.
#
# UWAGA, ŻEBY NIE WPROWADZAĆ NIKOGO W BŁĄD: ta zmiana NIE naprawiła
# awarii `pcntl` z 9 września. Sprawdzone — po ujednoliceniu list job
# dostępności padł tak samo. `setup-php` raportuje wtedy
# `✓ pcntl Enabled`, a `php artisan serve` i tak kończy się kodem 1
# na „Signals are not supported (…) or that pcntl_* functions are not
# disabled by your php.ini's disable_functions directive". Czyli
# rozszerzenie jest włączone, a FUNKCJE zablokowane w `php.ini`
# maszyny — to jest do naprawienia na runnerze, nie tutaj.
#
# Koszt: lekkie joby (Pint, Audyt zależności) włączają kilka
# rozszerzeń więcej. Na współdzielonej maszynie są już zainstalowane,
# więc to sekundy.

name: Środowisko PHP
description: Prywatny katalog narzędzi joba i konfiguracja PHP — w tej kolejności.

inputs:
  wersja:
    # W opisie wejścia NIE WOLNO użyć wyrażenia `${{ … }}` — GitHub
    # odrzuca akcję z „expressions are not allowed here". Zmierzone
    # przez `act`: akcja padała po 2,7 ms, zanim wykonała pierwszy krok.
    description: Wersja PHP; job podaje ją ze swojego env.PHP_VERSION.
    required: true

runs:
  using: composite
  steps:
    - name: Własny katalog narzędzi PHP (issue #262)
      shell: bash
      run: |
        set -euo pipefail
        KATALOG="${RUNNER_TEMP}/kuking-narzedzia/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
        mkdir -p "$KATALOG/bin" "$KATALOG/cache"
        echo "SETUP_PHP_TOOLS_DIR=$KATALOG/bin" >> "$GITHUB_ENV"
        echo "SETUP_PHP_TOOL_CACHE_DIR=$KATALOG/cache" >> "$GITHUB_ENV"

    - name: Konfiguracja PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ inputs.wersja }}
        extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
        coverage: none
        tools: composer:v2
