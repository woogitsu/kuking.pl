# -----------------------------------------------------------------------------
#  Dependabot — automatyczne PR-y z aktualizacjami zależności (issue #12).
#
#  `composer audit` / `npm audit` w CI (job "Audyt zależności" w ci.yml) mówią
#  tylko o TYM, co już jest znaną podatnością w zainstalowanej wersji. Bez tego
#  pliku nikt nie dostaje sygnału, że w ogóle WARTO podnieść wersję — podatność
#  wykrywa się dopiero, gdy ktoś ją zgłosi, czyli zwykle za późno.
#
#  Częstotliwość "weekly" (nie "daily") i grupowanie (`groups`) są celowe:
#  dziesięć osobnych PR-ów tygodniowo dla drobnych aktualizacji deweloperskich
#  to szybka droga do tego, że ktoś zacznie je ignorować hurtowo — razem
#  z tym jednym ważnym, bezpieczeństwowym. Aktualizacje bezpieczeństwa
#  (`open-pull-requests-limit` osobno nie trzeba, Dependabot i tak wysyła je
#  od razu, poza harmonogramem) zostają nieugrupowane, żeby żadna nie czekała
#  w kolejce za grupowym PR-em.
# -----------------------------------------------------------------------------

version: 2

updates:
  # ---------------------------------------------------------------------
  # Backend — composer.json / composer.lock
  # ---------------------------------------------------------------------
  #
  # Do 30.09.2026 Dependabot nie otworzył tu ANI JEDNEGO PR-a (#2301, IN-09).
  # `composer.json` wymagał `"php": "^8.4"` bez `config.platform.php`, więc
  # wersję PHP do rozwiązywania trzeba było zgadnąć, a przy 8.4.0 zamek się
  # nie rozwiązuje (symfony/filesystem 8.x wymaga >=8.4.1). Od #2301
  # `composer.json` ma jawne `config.platform.php`; pilnuje tego
  # tests/Feature/ComposerRozwiazujeSieDlaDependabotaTest.php.
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "zależności"
    groups:
      # Poprawki i drobne aktualizacje lecą JEDNYM PR-em tygodniowo.
      # `laravel/framework` i pakiety z jego ekosystemu osobno — zmiana wersji
      # frameworka zasługuje na własny, uważnie przeczytany PR, nie na wrzutkę
      # do wspólnej paczki dziesięciu bibliotek.
      #
      # Duże (major) aktualizacje wymagają ręcznej migracji i przeczytania
      # changeloga — Dependabot ma o nie PYTAĆ osobnym, nieugrupowanym PR-em,
      # a nie próbować ich grupować z resztą (#2009). Dlatego:
      #   * grupa ma w `update-types` TYLKO minor i patch — aktualizacja,
      #     która nie pasuje do żadnej grupy, idzie osobnym PR-em
      #     (dokumentacja GitHuba, opcja `groups`),
      #   * NIE ma tu `ignore` z `version-update:semver-major` — taki wpis
      #     nie „wydziela” majorów, tylko je wyłącza, więc PR nigdy by nie
      #     powstał. Pilnuje tego tests/Feature/DependabotProponujeMajorOsobnoTest.php.
      composer-minor-i-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "laravel/*"

  # ---------------------------------------------------------------------
  # Frontend — package.json / package-lock.json
  # ---------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "zależności"
    groups:
      # Jak w Composerze: minor i patch razem, major osobnym PR-em (#2009),
      # więc bez `ignore` dla semver-major.
      npm-minor-i-patch:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------
  # Same workflowy CI (actions/checkout, setup-php, ...) też się starzeją
  # i też bywają źródłem CVE (np. podatne wersje `actions/*`).
  #
  # `directory: "/"` skanuje TYLKO `.github/workflows`. Akcje composite
  # w `.github/actions/<nazwa>/action.yml` (np. `php` z `setup-php`) Dependabot
  # widzi dopiero, gdy wskaże się ich katalog — stąd glob w `directories`.
  # ---------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "zależności"
    groups:
      actions-wszystkie:
        patterns:
          - "*"

  # ---------------------------------------------------------------------
  # Obrazy bazowe (#952) — linie `FROM` w Dockerfile'ach są przypięte do
  # digestów (`tag@sha256:...`). Bez tego wpisu przypięcie oznaczałoby
  # zamrożenie: poprawki bezpieczeństwa w node / frankenphp / postgres
  # nigdy by do nas nie dotarły. Dependabot podbija digest w obrębie tego
  # samego tagu i proponuje nowsze tagi.
  #
  # Tu — inaczej niż w Composerze i npm — duże wersje IGNORUJEMY: `postgres:18`
  # w obrazie kopii MUSI zgadzać się z wersją serwera na Railwayu
  # (docker/kopia/Dockerfile, „KIEDY TEN TAG TRZEBA ZMIENIĆ”), a node 22 → 24
  # czy PHP 8.4 → 8.5 to migracja, nie wrzutka.
  # ---------------------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/docker/kopia"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "zależności"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
