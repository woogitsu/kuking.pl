name: Audyt A6 - sondy i mutacje
on:
  push:
    branches: ['audit/a6-20260909-1185719']
    paths: ['.github/workflows/audit-a6-probes.yml', 'audit-a6/**']
permissions:
  contents: read
concurrency:
  group: audit-a6-probes
  cancel-in-progress: false
jobs:
  sondy:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: audit-only
        ports: ['5432']
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: kuking_test
      DB_USERNAME: kuking
      DB_PASSWORD: audit-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      SENTRY_LARAVEL_DSN: ''
      POSTHOG_KEY: ''
      LOG_BLAD_WEBHOOK_URL: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1185719ddeda88e6cee0202b141b4078f17ffdd2
          path: subject
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalacja
        working-directory: subject
        run: |
          set -euo pipefail
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          echo "A6_OUT=$RUNNER_TEMP/a6-probes" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/a6-probes"
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
          npm run build
          cp .env.example .env
          cp ../tools/audit-a6/A6ProbeTest.php tests/Feature/A6ProbeTest.php
          cp ../tools/audit-a6/A6ProbeTest.php "$RUNNER_TEMP/a6-probes/A6ProbeTest.php"
      - name: Kontrole i sondy
        working-directory: subject
        run: |
          set +e
          set -uo pipefail
          run() {
            local label="$1"; shift
            "$@" > "$A6_OUT/$label.log" 2>&1
            local rc=$?
            printf '%s\n' "$rc" > "$A6_OUT/$label.exit"
            echo "$label: exit $rc"
            tail -n 12 "$A6_OUT/$label.log"
            return 0
          }
          git rev-parse HEAD > "$A6_OUT/commit.txt"
          php -r 'echo json_encode(["php"=>PHP_VERSION,"gd"=>gd_info()],JSON_PRETTY_PRINT);' > "$A6_OUT/runtime.json"
          run migrate php artisan migrate --force --no-interaction
          run probes php artisan test tests/Feature/A6ProbeTest.php --log-junit="$A6_OUT/probes-junit.xml"
          rm tests/Feature/A6ProbeTest.php
          run pint vendor/bin/pint --test
          run phpstan vendor/bin/phpstan analyse --no-progress --memory-limit=1G
          run composer-audit composer audit --locked --format=json --no-interaction
          run npm-audit npm audit --json
          run repaired-G php artisan test --filter='KarencjaUsunieciaChowaWykonanieTest|AwariaPowiadomieniaNieRozdzielaWykonaniaTest|WymazanieKontaUsuwaRelacjeI2FATest|UgotowalemPrzezAkcjeTezPrzezPolicyTest|ObietnicaTygodniowegoMailaTest'
          # Mutacja z kontrola przed, po i po przywroceniu bajtow.
          run media-before php artisan test --filter='DostepDoZdjeciaBezPolicyRodzicaTest|ZdjeciaChronioneNieWyciekajaTest'
          cp app/Domain/Media/DostepDoZdjecia.php "$A6_OUT/DostepDoZdjecia.original.php"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/Domain/Media/DostepDoZdjecia.php')
          s=p.read_text()
          needle='public function moze(?User $widz, Media $zdjecie): bool\n    {'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,needle+'\n        return true; // MUTACJA A6, tylko checkout audytu'))
          PY
          run media-mutant-syntax php -l app/Domain/Media/DostepDoZdjecia.php
          run media-mutant-narrow php artisan test tests/Feature/DostepDoZdjeciaBezPolicyRodzicaTest.php
          run media-mutant-wide php artisan test tests/Feature/ZdjeciaChronioneNieWyciekajaTest.php
          cp "$A6_OUT/DostepDoZdjecia.original.php" app/Domain/Media/DostepDoZdjecia.php
          run media-restored php artisan test --filter='DostepDoZdjeciaBezPolicyRodzicaTest|ZdjeciaChronioneNieWyciekajaTest'
          git diff --exit-code > "$A6_OUT/production-diff.txt"
          echo $? > "$A6_OUT/production-diff.exit"
          sha256sum composer.lock package-lock.json app/Domain/Media/DostepDoZdjecia.php > "$A6_OUT/hashes.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a6-probes-1185719
          path: ${{ runner.temp }}/a6-probes/
          retention-days: 7
          if-no-files-found: error
