name: Audyt A7 - final check

on:
  push:
    branches: [audit/a7-20260909]
    paths: [.github/workflows/audyt-a7-final-check.yml]

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test_a7_final
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports: [5432]
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test_a7_final"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_test_a7_final
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      KUKING_MEDIA_DISK: public
      KUKING_ZAUFANE_PRZESKOKI: '1'
      BCRYPT_ROUNDS: '4'
      SENTRY_DSN: ''
      SENTRY_LARAVEL_DSN: ''
      POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PostgreSQL dynamiczny port
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: vendor
          key: a7-final-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - name: Zależności
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
      - name: Składnia dowodów
        run: |
          set -euo pipefail
          for f in docs/zlecenia/dowody-a7/*.php; do php -l "$f"; done
      - name: Pint dowodów
        run: vendor/bin/pint --test docs/zlecenia/dowody-a7/*.php
      - name: Pełne testy PostgreSQL 18
        run: php artisan test --compact
