name: Audyt A7 - final check

on:
  push:
    branches: [audit/a7-20260909]
    paths: [.github/workflows/audyt-a7-final-check.yml]

# Uprawnienie domyślne dla całego workflow jest tylko do odczytu (#1742).
# Zapis dostaje WYŁĄCZNIE job `zapisz-formatowanie`, i tylko na czas
# jednego kroku, który naprawdę pushuje — checkout, Composer, Pint
# i pełne testy chodzą w osobnym jobie bez tokena zapisu.
permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  # ---------------------------------------------------------------------
  #  Sprawdzenie: checkout, zależności, Pint (bez zapisu) i pełne testy.
  #  BEZ tokena zapisu przez cały czas trwania joba (#1742) — kod z gałęzi
  #  (Composer, zależności, Pint, testy) nigdy nie dostaje poświadczenia,
  #  którym dałoby się cokolwiek wypchnąć do repozytorium.
  # ---------------------------------------------------------------------
  sprawdz:
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    outputs:
      pint_zmienil_pliki: ${{ steps.diff.outputs.zmieniono }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test_a7_final
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports: [5432]
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test_a7_final"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_test_a7_final
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      KUKING_MEDIA_DISK: public
      KUKING_ZAUFANE_PRZESKOKI: '1'
      BCRYPT_ROUNDS: '4'
      SENTRY_DSN: ''
      SENTRY_LARAVEL_DSN: ''
      POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PostgreSQL dynamiczny port
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
      - name: Własny katalog narzędzi PHP (issue #262)
        run: |
          set -euo pipefail
          KATALOG="${RUNNER_TEMP}/kuking-narzedzia/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "$KATALOG/bin" "$KATALOG/cache"
          echo "SETUP_PHP_TOOLS_DIR=$KATALOG/bin" >> "$GITHUB_ENV"
          echo "SETUP_PHP_TOOL_CACHE_DIR=$KATALOG/cache" >> "$GITHUB_ENV"
      - name: Konfiguracja PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - name: Zależności
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
      - name: Składnia dowodów
        run: |
          set -euo pipefail
          for f in docs/zlecenia/dowody-a7/*.php; do php -l "$f"; done
      - name: Sformatuj dowody Pintem
        run: vendor/bin/pint docs/zlecenia/dowody-a7/*.php
      - name: Sprawdź, czy Pint coś zmienił
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/zlecenia/dowody-a7; then
            echo "Pint nie zmienił plików."
            echo "zmieniono=false" >> "$GITHUB_OUTPUT"
          else
            echo "zmieniono=true" >> "$GITHUB_OUTPUT"
            git diff -- docs/zlecenia/dowody-a7 > pint-a7.patch
          fi
      # Poprawki Pinta idą do artefaktu, NIE do commitu w tym jobie — ten
      # job nie ma tokena zapisu. Zapisuje je dopiero `zapisz-formatowanie`.
      - name: Zapisz łatkę formatowania jako artefakt
        if: steps.diff.outputs.zmieniono == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pint-a7-patch
          path: pint-a7.patch
          retention-days: 1
      - name: Pełne testy PostgreSQL 18
        run: php artisan test --compact

  # ---------------------------------------------------------------------
  #  Zapis formatowania na gałęzi audytu. JEDYNY job z tokenem zapisu,
  #  i tylko wtedy, gdy `sprawdz` naprawdę znalazł zmianę Pinta. Nie
  #  uruchamia Composera, Pinta ani testów — tylko `git apply` łatki
  #  policzonej w poprzednim jobie i push.
  # ---------------------------------------------------------------------
  zapisz-formatowanie:
    needs: sprawdz
    if: needs.sprawdz.outputs.pint_zmienil_pliki == 'true'
    permissions:
      contents: write
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/a7-20260909
          persist-credentials: true
      - name: Pobierz łatkę formatowania
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: pint-a7-patch
      - name: Zastosuj i wypchnij łatkę
        run: |
          set -euo pipefail
          git apply pint-a7.patch
          git add docs/zlecenia/dowody-a7/*.php
          if git diff --cached --quiet; then
            echo "Nic do zapisania (łatka nie zmieniła plików w tej gałęzi)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audyt A7: sformatuj skrypty dowodowe Pintem"
          git push origin HEAD:audit/a7-20260909
