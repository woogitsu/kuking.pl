name: Audyt A7 - Infection hosted

on:
  push:
    branches: [audit/a7-20260909]
    paths: [.github/workflows/audyt-a7-infection-hosted.yml]

permissions:
  contents: read

jobs:
  infection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test_a7
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports: [5432]
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test_a7"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_test_a7
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      KUKING_MEDIA_DISK: public
      KUKING_ZAUFANE_PRZESKOKI: '1'
      BCRYPT_ROUNDS: '4'
      SENTRY_DSN: ''
      SENTRY_LARAVEL_DSN: ''
      POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PostgreSQL dynamiczny port
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: pcov
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: vendor
          key: a7-infection-hosted-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - name: Przygotowanie
        run: |
          set -euo pipefail
          mkdir -p a7-output
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php -m | grep -i pcov | tee a7-output/coverage-generator.txt
          php artisan migrate:refresh --force --no-interaction
          curl --fail --location --silent --show-error https://github.com/infection/infection/releases/latest/download/infection.phar -o "$RUNNER_TEMP/infection.phar"
          php "$RUNNER_TEMP/infection.phar" --version | tee a7-output/infection-version.txt
          php -v | tee a7-output/php-version.txt
          php -r '$p=new PDO("pgsql:host=".getenv("DB_HOST").";port=".getenv("DB_PORT").";dbname=".getenv("DB_DATABASE"),getenv("DB_USERNAME"),getenv("DB_PASSWORD"));echo $p->query("select version()")->fetchColumn(),PHP_EOL;' | tee a7-output/postgres-version.txt
          git rev-parse HEAD | tee a7-output/commit.txt
          git hash-object app/Domain/Media/UsunGps.php | tee a7-output/usungps-blob.txt
      - name: Mutation testing UsunGps
        run: |
          set -euo pipefail
          cat > infection-a7.json <<'JSON'
          {
            "source": {"directories": ["app/Domain/Media"]},
            "timeout": 20,
            "threads": 4,
            "phpUnit": {"configDir": ".", "customPath": "vendor/bin/phpunit"},
            "mutators": {"@default": true},
            "logs": {
              "text": "a7-output/infection.log",
              "json": "a7-output/infection.json",
              "summary": "a7-output/infection-summary.log",
              "summaryJson": "a7-output/infection-summary.json"
            }
          }
          JSON
          cp infection-a7.json a7-output/infection-config.json
          set +e
          php "$RUNNER_TEMP/infection.phar" --configuration=infection-a7.json app/Domain/Media/UsunGps.php --no-progress --no-interaction 2>&1 | tee a7-output/infection-console.log
          code=${PIPESTATUS[0]}
          echo "$code" > a7-output/infection-exit-code.txt
          exit 0
      - name: Dowody
        if: always()
        run: |
          set -euo pipefail
          git diff -- app tests composer.json composer.lock > a7-output/git-diff-aplikacji.txt
          git status --short > a7-output/git-status.txt
          (cd a7-output && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audyt-a7-infection-hosted
          path: a7-output/
          retention-days: 7
