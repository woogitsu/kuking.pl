name: Audyt A7 - sondy A7-2 poprawione

on:
  push:
    branches: [audit/a7-20260909]
    paths: [.github/workflows/audyt-a7-sondy2.yml]

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  sondy:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test_a7_probe
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports: [5432]
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test_a7_probe"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_test_a7_probe
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: public
      KUKING_MEDIA_DISK: public
      KUKING_ZAUFANE_PRZESKOKI: '1'
      BCRYPT_ROUNDS: '4'
      SENTRY_DSN: ''
      SENTRY_LARAVEL_DSN: ''
      POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PostgreSQL dynamiczny port
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: vendor
          key: a7-sondy-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - name: Zależności i kontrola składni
        run: |
          set -euo pipefail
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php -l docs/zlecenia/dowody-a7/pomiar-seed-retencja.php
          php -l docs/zlecenia/dowody-a7/pomiar-2fa.php
          php artisan migrate:fresh --force --no-interaction
          mkdir -p a7-sondy
      - name: Seeder i retencja
        run: |
          set -euo pipefail
          php docs/zlecenia/dowody-a7/pomiar-seed-retencja.php 2>&1 | tee a7-sondy/seed-retencja-console.log
          cp docs/zlecenia/dowody-a7/seed-retencja-wynik.json a7-sondy/
      - name: Świeża baza przed 2FA
        run: php artisan migrate:fresh --force --no-interaction
      - name: Dwa procesy i dwa połączenia 2FA
        run: |
          set -euo pipefail
          php docs/zlecenia/dowody-a7/pomiar-2fa.php 2>&1 | tee a7-sondy/2fa-console.log
          cp docs/zlecenia/dowody-a7/2fa-wynik.json a7-sondy/
          cp docs/zlecenia/dowody-a7/pomiar-2fa.php a7-sondy/
          cp docs/zlecenia/dowody-a7/pomiar-seed-retencja.php a7-sondy/
          sha256sum a7-sondy/* > a7-sondy/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audyt-a7-sondy-a7-2-poprawione
          path: a7-sondy/
          retention-days: 7
