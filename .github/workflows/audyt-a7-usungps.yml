name: Audyt A7 - UsunGps

on:
  push:
    branches: [audit/a7-20260909]
    paths: [.github/workflows/audyt-a7-usungps.yml]

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'

jobs:
  krawedzie:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: gd, exif, mbstring
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: vendor
          key: a7-usungps-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - name: Sonda
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          mkdir -p a7-usungps
          php -l docs/zlecenia/dowody-a7/pomiar-usungps-krawedzie.php
          php docs/zlecenia/dowody-a7/pomiar-usungps-krawedzie.php 2>&1 | tee a7-usungps/krawedzie-console.log
          cp docs/zlecenia/dowody-a7/usungps-krawedzie-wynik.json a7-usungps/
          cp docs/zlecenia/dowody-a7/pomiar-usungps-krawedzie.php a7-usungps/
          sha256sum a7-usungps/* > a7-usungps/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audyt-a7-usungps-krawedzie
          path: a7-usungps/
          retention-days: 7

  mutacje:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test_a7_mutacje
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports: [5432]
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test_a7_mutacje"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_test_a7_mutacje
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      DB_URL: ''
      DATABASE_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      KUKING_MEDIA_DISK: public
      KUKING_ZAUFANE_PRZESKOKI: '1'
      BCRYPT_ROUNDS: '4'
      SENTRY_DSN: ''
      SENTRY_LARAVEL_DSN: ''
      POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PostgreSQL dynamiczny port
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/cache@v6
        with:
          path: vendor
          key: a7-usungps-composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
      - name: Zależności i baza
        run: |
          set -euo pipefail
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan migrate:fresh --force --no-interaction
          php -l docs/zlecenia/dowody-a7/mutacje-usungps.php
          mkdir -p a7-usungps
      - name: Mutation testing
        run: |
          set -euo pipefail
          php docs/zlecenia/dowody-a7/mutacje-usungps.php 2>&1 | tee a7-usungps/mutacje-console.log
          cp docs/zlecenia/dowody-a7/mutacje-usungps-wynik.json a7-usungps/
          cp docs/zlecenia/dowody-a7/mutacje-usungps.php a7-usungps/
          git diff --exit-code -- app/Domain/Media/UsunGps.php
          sha256sum a7-usungps/* > a7-usungps/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audyt-a7-usungps-mutacje
          path: a7-usungps/
          retention-days: 7
