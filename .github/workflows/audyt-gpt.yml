name: Audyt GPT - sondy i mutacje
on:
  push:
    branches: ['audit/gpt-2026-09']
    paths: ['.github/workflows/audyt-gpt.yml']
permissions:
  contents: read
concurrency:
  group: audyt-gpt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports: ['5432']
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: kuking_test
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      KUKING_MEDIA_DISK: public
      SENTRY_LARAVEL_DSN: ''
      POSTHOG_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Dynamiczny port bazy
        run: echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Instalacja i build
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/commit.txt
          composer install --no-interaction --prefer-dist --no-progress > audit-evidence/composer.log 2>&1
          cp .env.example .env
          npm ci > audit-evidence/npm.log 2>&1
          npm run build > audit-evidence/build.log 2>&1
          php artisan migrate --force --no-interaction > audit-evidence/migrate.log 2>&1
      - name: Sondy inwariantow - spodziewane czerwone wyniki sa dowodem
        run: |
          set +e
          php artisan test audit-probes/AuditProbeTest.php --log-junit=audit-evidence/probes.junit.xml > audit-evidence/probes.log 2>&1
          echo "$?" > audit-evidence/probes.exit
          cat audit-evidence/probes.log
          exit 0
      - name: Rzeczywiste mutacje i przywrocenie
        run: python audit-probes/mutations.py
      - name: Przegladarka
        if: ${{ !cancelled() }}
        env:
          APP_ENV: local
          SESSION_DRIVER: database
          CACHE_STORE: database
          QUEUE_CONNECTION: sync
        run: |
          npx playwright install --with-deps chromium > audit-evidence/browser-install.log 2>&1
          set +e
          node scripts/dostepnosc.mjs > audit-evidence/accessibility.log 2>&1
          echo "$?" > audit-evidence/accessibility.exit
          cp storage/dostepnosc.json audit-evidence/ 2>/dev/null || true
          php -r '$im=imagecreatetruecolor(640,480); imagepng($im,"audit-evidence/probe.png");'
          node audit-probes/browser.mjs > audit-evidence/browser.log 2>&1
          echo "$?" > audit-evidence/browser.exit
          exit 0
      - name: Brak zmian w aplikacji i komplet zrodel
        if: ${{ !cancelled() }}
        run: |
          git diff --exit-code -- app config routes database resources > audit-evidence/production-diff.txt
          git status --short > audit-evidence/git-status.txt
          tar -czf audit-evidence/workflows.tar.gz .github
          tar -czf audit-evidence/probe-sources.tar.gz audit-probes .github/workflows/audyt-gpt.yml
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: audyt-gpt-probes
          path: audit-evidence/
          retention-days: 3
