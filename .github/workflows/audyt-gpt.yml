name: Audyt GPT - eksport raportu
on:
  push:
    branches: ['audit/gpt-2026-09']
    paths: ['.github/workflows/audyt-gpt.yml']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v7
        with:
          name: audyt-gpt-report
          path: docs/AUDYT_GPT_2026-09.md
          retention-days: 3
