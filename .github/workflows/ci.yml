# ---------------------------------------------------------------------------
#  CI JEST WŁĄCZONE (D-010, issue #4).
#
#  Repozytorium jest prywatne, ale żyje w organizacji `woogitsu` na planie Free,
#  która ma własną, nieużywaną pulę 2 000 minut Actions miesięcznie.
#  `./scripts/check.sh` trwa 4-8 minut → 250-500 przebiegów miesięcznie.
#
#  Kontrola lokalna ZOSTAJE mimo działającego CI — jest szybsza i łapie błąd,
#  zanim ten trafi na GitHuba (i zanim zje minuty):
#    ./scripts/check.sh           # to samo, co robi ten workflow
#    ./scripts/install-hooks.sh   # hook pre-push, jednorazowo
#
#  GDZIE TO CHODZI: rozstrzyga ZMIENNA REPOZYTORIUM `CI_RUNS_ON` (D-121).
#  WYJĄTEK od 21.09.2026: JEDEN job, `port_funkcje`, czyta osobną zmienną,
#  `CI_RUNS_ON_BROWSER` — patrz blok „JOB PRZEGLĄDARKOWY" niżej. Wszystkie
#  POZOSTAŁE joby mają dokładnie to samo:
#
#      runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
#
#  Bez tej zmiennej joby idą na `ubuntu-latest` — zapas w runnerach GitHuba
#  JEST i jest wartością domyślną. Żeby wysłać joby na własną pulę
#  `woogitsu-linux-01`–`woogitsu-linux-10`, właściciel ustawia w Settings →
#  Secrets and variables → Actions → Variables:
#
#      CI_RUNS_ON = ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#
#  Dlaczego KOMPLET ETYKIET, a nie nazwa runnera: nazwa przypina job do JEDNEJ
#  maszyny, więc jej awaria zatrzymuje całe CI. Dlaczego te dwie dodatkowe:
#  `i5-10400f` i `nvidia-gtx1070` ma wyłącznie nowa pula. Stare runnery WSL-owe
#  (`kuking-wsl-DOM-NEW-01`–`-03` — trzy rejestracje JEDNEJ maszyny, nazwa
#  potwierdzona przez właściciela 12.09.2026) noszą tylko `self-hosted`, `Linux`, `X64`,
#  `wsl2`, `woogitsu` — samo `self-hosted` wpuściłoby joby także na nie.
#
#  KOSZT, ŻEBY BYŁ ZAPISANY: kiedy zmienna wskazuje własną pulę, a cała pula
#  jest offline, przebiegi stoją w kolejce bez końca — a CI jest bramką deployu
#  (Railway ma „Wait for CI"), więc stoi wtedy także wdrożenie. Ratunkiem jest
#  wtedy SKASOWANIE zmiennej (powrót na `ubuntu-latest`), nie PR.
#
#  STAN ZMIERZONY 11.09.2026 (D-121, przebieg CI nr 661): `labels: ["self-hosted"]`,
#  `runner_name: kuking-wsl-DOM-NEW-02`. Zmienna jest dziś ustawiona na SAMO
#  `self-hosted`, więc joby lądują na starej puli WSL-owej — tej, którą komplet
#  sześciu etykiet miał wykluczać. Zmiana tej wartości należy do właściciela
#  repozytorium, nie do kodu. Instrukcja runnera: docs/infra/SELF_HOSTED_RUNNER.md
#
#  TO JEST WYBÓR, NIE PRZEOCZENIE — decyzja właściciela z 12.09.2026.
#  Z trzech dróg (komplet sześciu etykiet / skasowanie zmiennej / zostawienie
#  jak jest) właściciel wybrał TRZECIĄ, znając koszt: przebiegi chodzą na starej
#  puli WSL, czyli na TRZECH REJESTRACJACH JEDNEJ MASZYNY — tej samej, która
#  dała wyścig o binarkę Composera z #262. Kto tu trafia po czerwonym CI: stan
#  „stara pula" nie jest tu usterką do naprawienia i nie szukaj przyczyny
#  w `runs-on:`. Przyjęty koszt w całości, dokładna wartość do przełączenia
#  na nową pulę, skutek skasowania zmiennej i SYGNAŁ, po którym tę decyzję
#  odwracamy, stoją w docs/infra/SELF_HOSTED_RUNNER.md → „Krok 1" → „Decyzja
#  właściciela z 12 września 2026: zmienna ZOSTAJE na samym `self-hosted`".
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
#  JOB PRZEGLĄDARKOWY `port_funkcje`: OSOBNA ZMIENNA `CI_RUNS_ON_BROWSER`
#  (decyzja właściciela z 21.09.2026, ZAWĘŻONA tego samego dnia).
#
#  CO SIĘ ZMIENIŁO. 21.09 CI przeszło na własne runnery (`CI_RUNS_ON`) we
#  WSZYSTKICH jobach — koszt minut spadł do zera, ale runnery stoją na TEJ
#  SAMEJ maszynie co flota agentów, która na niej równolegle pracuje. Przy
#  pięciu pełnych zestawach testów naraz `load average` dobijał do 12,
#  a joby przeglądarkowe (Playwright/Chromium pod obciążoną maszyną) odpadały
#  z `TimeoutError` — `main` poczerwieniał z tego powodu raz tego dnia.
#
#  PIERWSZA WERSJA tej decyzji (ten sam dzień) przełączyła PIĘĆ jobów —
#  `assets`, `port_panelu`, `port_marki`, `port_funkcje`, `dostepnosc` —
#  na `CI_RUNS_ON_BROWSER`. Właściciel to COFNĄŁ po zobaczeniu kosztu:
#  pięć jobów to 66 min na pełny przebieg (Panel marki 18 + Port marki 8 +
#  Port marki — rodziny ekranów 27 + Dostępność 13 = 66; `assets` liczy się
#  w minutach budowy assetów, nie osobno) — z puli ~500 minut to tylko
#  SIEDEM pełnych przebiegów miesięcznie. (Pierwotny meldunek zsumował te
#  cztery liczby jako „ok. 39 min" — błąd w arytmetyce, nie w pomiarze:
#  18+8+27+13 = 66, nie 39.)
#
#  DECYZJA (zawężona): na `ubuntu-latest` wraca WYŁĄCZNIE `port_funkcje`
#  („Port marki — rodziny ekranów, zoom i kreator") — sam jest NAJDŁUŻSZYM
#  jobem w całym CI (mediana 51 s, ale MAKSIMUM 1638 s na 25 przebiegach;
#  limit joba podniesiono do 35 min po przebiegu, w którym sam pomiar
#  układu trwał 23 min) i to WŁAŚNIE ON padł na `main` z `TimeoutError`
#  pod obciążeniem floty — najmocniej cierpi, więc jako jedyny się przenosi.
#  Sam `port_funkcje` to ok. 27 min na przebieg — z puli ~500 minut to
#  około OSIEMNASTU przebiegów, znacznie mniej ciasno niż przy pięciu jobach.
#
#      runs-on: ${{ fromJSON(vars.CI_RUNS_ON_BROWSER || '"ubuntu-latest"') }}
#
#  Pozostałe cztery joby (`assets`, `port_panelu`, `port_marki`, `dostepnosc`)
#  WRÓCIŁY na `CI_RUNS_ON` (własne runnery) — cofnięte do stanu sprzed
#  pierwszej wersji tej decyzji. Czy pod obciążeniem floty też zaczną padać,
#  NIE WIADOMO — to pytanie otwarte, nie rozstrzygnięte tym cofnięciem.
#
#  DLACZEGO OSOBNA ZMIENNA, A NIE ETYKIETA NA SZTYWNO W `runs-on:`. Sztywna
#  etykieta wymagałaby PR-a i przeglądu za każdym razem, gdy flota przestaje
#  pracować i `port_funkcje` mógłby wrócić na własne runnery. Zmienna zmienia
#  się w Settings → Secrets and variables → Actions → Variables, bez PR-a —
#  ten sam powód, dla którego istnieje `CI_RUNS_ON` (patrz blok wyżej).
#
#  ŚRODOWISKO: `ubuntu-latest` to ten sam obraz, który już był zapasem
#  domyślnym tego joba, zanim własne runnery przejęły wszystko — nie nowa,
#  nieprzetestowana droga. Krok „Przeglądarka" (`npx playwright install
#  chromium`, BEZ `--with-deps`) zakłada, że biblioteki systemowe Chromium
#  (libnss, libatk, libgbm i inne) już są na maszynie: na własnym runnerze,
#  bo ktoś je tam doinstalował ręcznie (docs/infra/SELF_HOSTED_RUNNER.md,
#  „CI nie instaluje pakietów systemowych"); na `ubuntu-latest` — bo obraz
#  GitHuba ma preinstalowane przeglądarki (Chrome, Edge), które ciągną te
#  same biblioteki jako zależności pakietu. NIE JEST TO ZMIERZONE na tym CI —
#  żaden przebieg tej zmiany jeszcze nie poszedł — tylko WYWNIOSKOWANE
#  z dokumentacji obrazów runnerów GitHuba. Jeśli któryś pakiet jednak
#  brakuje, Playwright powie to po nazwie przy starcie przeglądarki (ten sam
#  komunikat co na self-hosted), nie padnie cicho. Najtańszy sposób
#  rozstrzygnięcia na pewno: puścić SAM `port_funkcje` (workflow_dispatch albo
#  push na gałęzi), nie cały przebieg CI.
#
#  KLIENT POSTGRESA, PHP, NODE: bez zmian. `shivammathur/setup-php`
#  i `actions/setup-node` instalują wersję z `env.PHP_VERSION`/`NODE_VERSION`
#  od zera na KAŻDYM runnerze, więc `ubuntu-latest` nie różni się tu niczym —
#  to jest już standardowa droga tych akcji na obrazach GitHuba. Klient
#  `pg_restore` 18 dotyczy wyłącznie joba `lint` (skrypty kopii bazy), który
#  ZOSTAJE na `CI_RUNS_ON` — `port_funkcje` go nie woła.
#
#  PO CZYM POZNAĆ, ŻE TRZEBA WRÓCIĆ NA WŁASNE RUNNERY: flota agentów
#  przestaje obciążać maszynę (load average trwale poniżej ~4) — wtedy
#  `CI_RUNS_ON_BROWSER` można skasować albo ustawić na tę samą wartość co
#  `CI_RUNS_ON`, i `port_funkcje` wraca na własną pulę bez PR-a.
#
#  Zgodności tego bloku z tym, co naprawdę stoi w `runs-on:` `port_funkcje`,
#  pilnuje ten sam strażnik co dla `CI_RUNS_ON`:
#  `tests/Feature/DokumentyCiMowiaPrawdeORunnerzeTest.php`.
# ---------------------------------------------------------------------------

# =============================================================================
#  Kuking.pl — Continuous Integration
#  Docelowa lokalizacja: .github/workflows/ci.yml
# =============================================================================
#  Ten workflow jest BRAMKĄ DEPLOYU. W serwisach Railway włączone jest
#  "Wait for CI" (source.checkSuites w railway.ts), więc Railway nie zbuduje
#  deployu, dopóki te joby nie są zielone.
#  Wniosek praktyczny: jeśli coś jest tu "tymczasowo wyłączone", to znaczy,
#  że produkcja jest niezabezpieczona.
#
#  Podział na równoległe joby (nie jeden wielki) jest celowy:
#    * szybsza informacja zwrotna — lint pada w ~40 s, nie po 6 minutach testów;
#    * czytelny raport w PR: widać, CO dokładnie się zepsuło;
#    * `audit` może być nieblokujący, a `test` nie.
# =============================================================================

# ---------------------------------------------------------------------------
#  RUNNERY: WYBIERA JE ZMIENNA REPOZYTORIUM `CI_RUNS_ON`, A BEZ NIEJ STOI
#  `ubuntu-latest` — decyzja właściciela z 8 września 2026, wieczorem (D-121).
#
#  D-028 mówi: „CI wraca na własne runnery, wybierane etykietami, nie nazwą"
#  — i ta decyzja NIE JEST odwołana. Powodem zmiany jest sytuacja, nie zwrot
#  w strategii: trzy z sześciu runnerów są wyłączone, a w kolejce stało
#  dziesięć przebiegów po siedem jobów. Job „Testy (PostgreSQL 18)" czekał
#  na wolną maszynę PONAD GODZINĘ, przez co Railway — który ma włączone
#  „Wait for CI" — nie wdrażał niczego na produkcję.
#
#  Właściciel ma ~2000 niewykorzystanych minut Actions i kazał ich użyć.
#  Repozytorium jest PRYWATNE, więc minuty są płatne — ale płacą się tylko
#  wtedy, gdy przebieg idzie na runnery GitHuba. Pełny przebieg ma dziesięć
#  jobów po wydzieleniu portu marki. Czas zależy od zakresu i kolejki runnerów.
#
#  JAK WRÓCIĆ NA WŁASNĄ PULĘ — BEZ ZMIANY W KODZIE (od 8 września, wieczór).
#  `runs-on` czyta zmienną repozytorium `CI_RUNS_ON`. Bez niej stoi
#  `ubuntu-latest`. Powrót: Settings → Secrets and variables → Actions →
#  Variables → `CI_RUNS_ON` =
#      ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#  Skasowanie zmiennej wraca na runnery GitHuba — w obie strony bez PR-a.
#
#  DLACZEGO ZNOWU ZMIENNA, SKORO D-028 JEDNĄ TAKĄ USUNĘŁA. Usunęła
#  `CI_RUNNER`, bo NIC JEJ NIE CZYTAŁO — była atrapą. Tę czyta `runs-on`
#  w czterech workflow-ach, a powód jej istnienia jest zmierzony: 8 września
#  przełączenie puli wymagało PR-a i przeglądu, podczas gdy produkcja stała
#  z powodu niedostępnych maszyn. Przełącznik, który wymaga cyklu przeglądu,
#  nie jest przełącznikiem awaryjnym.
#
#  Etykiety, nie nazwa runnera: nazwa przypina job do jednej maszyny, więc
#  jej awaria zatrzymuje CI. Etykiety `i5-10400f` i `nvidia-gtx1070` mają
#  WYŁĄCZNIE nowe runnery — samo `self-hosted` wpuściłoby joby także na stare
#  maszyny WSL-owe.
#
#  Nic poza `runs-on` nie wymagało zmiany: usługa `postgres` i odczyt
#  zmapowanego portu przez `job.services.postgres.ports[5432]` działają tak
#  samo na obu rodzajach runnerów.
#
#  CZEGO TEN KOMENTARZ NIE MÓWI, BO NIE MOŻE: jaka jest DZIŚ wartość zmiennej.
#  Zmienna żyje w ustawieniach repozytorium i z kodu jej nie widać — ostatni
#  pomiar stoi wyżej (D-121). Zgodność tego opisu z tym, co naprawdę stoi
#  w `runs-on:`, pilnuje `tests/Feature/DokumentyCiMowiaPrawdeORunnerzeTest.php`.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Zostaje obok wyzwalaczy automatycznych: pozwala puścić przebieg ręcznie
  # (Actions → CI → Run workflow) bez pustego commita — przydaje się przy
  # pierwszym uruchomieniu i przy sprawdzaniu, czy problem nie był chwilowy.
  workflow_dispatch:

# Uprawnienia minimalne — do uruchomienia testów nie potrzebujemy write.
permissions:
  contents: read

# Nowy push do tej samej gałęzi/PR anuluje poprzedni przebieg.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"
  NODE_VERSION: "22"

jobs:
  # ===========================================================================
  #  0. Czy ta zmiana w ogóle dotyka kodu
  # ===========================================================================
  #  PO CO TO JEST: żeby zmiana wyłącznie w dokumentacji nie uruchamiała
  #  pełnego zestawu. 8 września wieczorem sześć PR-ów dotykało tylko `docs/`
  #  i każdy z nich przepuścił testy na PostgreSQL, axe-core, build obrazu
  #  i build assetów. Zmiana w pliku Markdown nie ma jak żadnego z nich
  #  zepsuć — a minuty Actions są skończone.
  #
  #  DLACZEGO WŁASNY KROK, A NIE `paths-ignore` NA WYZWALACZU. `paths-ignore`
  #  nie uruchomiłby workflow WCALE, czyli commit nie miałby ŻADNEGO zestawu
  #  kontrolnego. Railway ma włączone „Wait for CI" i czeka na przebieg
  #  wierzchołka — brak przebiegu to stan, którego nikt tu nie zmierzył.
  #  Pominięty job kończy się jako `skipped`, czyli zestaw istnieje i jest
  #  rozstrzygnięty. To jest wariant ostrożniejszy.
  #
  #  DLACZEGO BEZ ZEWNĘTRZNEJ AKCJI DO FILTROWANIA ŚCIEŻEK: jedno `git diff`
  #  robi to samo, a nie dokłada zależności, której trzeba pilnować.
  #
  #  UWAGA PRZY SCALANIU: od tej zmiany „Testy (PostgreSQL 18)" mogą stać
  #  jako `skipped`, i to jest poprawny stan dla zmiany w samej dokumentacji.
  #  Kryterium scalenia brzmi więc „zielone ALBO pominięte", nie „zielone".
  # ===========================================================================
  zakres:
    name: Zakres zmiany
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      kod: ${{ steps.sprawdz.outputs.kod }}
      widok: ${{ steps.sprawdz.outputs.widok }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Pełna historia, bo porównujemy z bazą, a nie z ostatnim commitem.
          fetch-depth: 0

      - name: Czy zmiana dotyka czegoś poza dokumentacją
        id: sprawdz
        env:
          BAZA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Stan bez punktu odniesienia (pierwszy push gałęzi, wymuszony
          # przebieg) — wtedy NIE ZGADUJEMY i puszczamy pełny zestaw.
          if [ -z "${BAZA}" ] || [ "${BAZA}" = "0000000000000000000000000000000000000000" ]; then
            echo "Brak punktu odniesienia — pełny zestaw."
            echo "kod=true" >> "$GITHUB_OUTPUT"
            echo "widok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${BAZA}^{commit}" 2>/dev/null; then
            echo "Baza ${BAZA} nieosiągalna — pełny zestaw."
            echo "kod=true" >> "$GITHUB_OUTPUT"
            echo "widok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZMIENIONE="$(git diff --name-only "${BAZA}" HEAD)"
          echo "Zmienione pliki:"
          echo "${ZMIENIONE}"

          # Wyłącznie te dwa katalogi są uznane za „nie kod". Wszystko inne —
          # łącznie z `.github/`, `pint.json` czy `composer.json` — uruchamia
          # pełny zestaw. Lista jest krótka CELOWO: pomyłka w stronę
          # nadmiarowego przebiegu kosztuje minuty, a w drugą stronę
          # przepuszcza niesprawdzoną zmianę.
          POZA="$(echo "${ZMIENIONE}" | grep -vE '^(docs/|README\.md$)' || true)"

          if [ -z "${POZA}" ]; then
            echo "Zmiana wyłącznie w dokumentacji — ciężkie zadania pominięte."
            echo "kod=false" >> "$GITHUB_OUTPUT"
          else
            echo "kod=true" >> "$GITHUB_OUTPUT"
          fi

          # -------------------------------------------------------------
          # WARSTWA WIDOKU — jedno miejsce dla trzech jobów przeglądarkowych.
          #
          # Do 19 września 2026 ten sam filtr stał TRZY RAZY, osobno w
          # `port_marki`, `port_funkcje` i `dostepnosc`, i pilnował KROKÓW,
          # a nie jobów. Skutek był taki, że przy zmianie kodu poza warstwą
          # widoku job się URUCHAMIAŁ, wszystkie jego kroki pomiarowe były
          # pomijane, a job kończył się na ZIELONO — nie do odróżnienia na
          # liście kontrolnej od joba, który naprawdę wszystko zmierzył.
          # Zmierzone na 25 przebiegach: „Port marki (kompozycje…)" miał
          # 15 sukcesów, z czego 4 trwały 19–22 s wobec 462–506 s przy
          # rzeczywistym pomiarze. Tak samo „Port marki — rodziny ekranów"
          # (4 × 19–21 s wobec 1456–1638 s) i „Dostępność" (4 × 18–22 s
          # wobec 745–955 s). Razem dwanaście zielonych bez ani jednego
          # pomiaru.
          #
          # Teraz warunek stoi na JOBIE. Gdy warstwa widoku jest nietknięta,
          # cały job jest `skipped` — czyli widać, że nic nie zmierzono.
          # Zielony wynik znowu znaczy „zmierzone".
          #
          # Wzorzec obejmuje TAKŻE SAME SKRYPTY POMIAROWE i `ci.yml`: zmiana
          # przyrządu musi uruchomić pomiar, inaczej dałoby się zepsuć
          # miernik bez jednego czerwonego przebiegu. Pilnuje tego
          # `PortMarkiMaWlasnaBramkeCiTest`.
          # Lista pomiarów niesie też `referrer-sekret-browser` (z `main`).
          # Sterujące nim `ApplySecurityHeaders.php` i `AnalitykaCloudflare.php`
          # łapie już szersze `app/`, więc nie stoją na liście osobno.
          # PHP także steruje ekranem: komponenty, trasy, kontrolery, polityki
          # i modele. Konserwatywnie obejmujemy całe app/, konfigurację,
          # start aplikacji, tłumaczenia, bazę oraz zależności PHP (#1039).
          # Here-string nie gubi trafienia przez SIGPIPE przy dużym diffie.
          if grep -qE '^(app/|routes/|config/|bootstrap/|lang/|database/|composer\.(json|lock)$|resources/|public/|scripts/(referrer-sekret-browser|hero-nad-zgieciem|dostepnosc|kafel-dodawania|kafel-dodawania-bramka\.test|port-projektu|pwa-install-browser|port-grupy|port-grupy\.test|szybki-wyglad|pasek-przewijany|zwarte-kolumny|kompozycje-marki|zeszyty-marki|zainteresowania-powiadomienia-marki|tagi-marki|katalog-tagow|kontrast-notice|nawigacja-niski-widok|nawigacja-(etykiety|zoom|negatywy)|zoom-marki|regresja-liczb-profilu|fokus-karty-dania|fokus-zdjec|kroki-kreatora|service-worker-aktualizacja|minutnik-regresja|minutnik-fokus|kaskada-martwe-reguly)\.mjs|scripts/kaskada-kontrola-(polecenie|ujemna)\.sh|scripts/fixtures/|docker/Caddyfile|package(-lock)?\.json|\.github/workflows/ci\.yml)' <<< "${ZMIENIONE}"; then
            echo "widok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Warstwa widoku nietknięta — joby przeglądarkowe pominięte."
            echo "widok=false" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  #  1. Styl kodu — Laravel Pint
  # ===========================================================================
  lint:
    name: Pint (styl kodu)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Prywatny katalog narzędzi joba i konfiguracja PHP — pełne
      # uzasadnienie stoi teraz przy kodzie, w `.github/actions/php`.
      - name: Środowisko PHP
        uses: ./.github/actions/php
        with:
          wersja: ${{ env.PHP_VERSION }}

      - name: Cache Composera
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Instalacja zależności
        run: composer install --no-interaction --prefer-dist --no-progress

      # --test = tylko raportuj, nie modyfikuj plików.
      # Naprawa lokalnie: `vendor/bin/pint`
      - name: Pint
        run: vendor/bin/pint --test -v

      # =====================================================================
      #  TESTY SKRYPTU KOPII BAZY (issue #193, D-043/D-049)
      #
      #  DLACZEGO TO STOI W CI, A NIE TYLKO W `scripts/check.sh`
      #  Bo do tej pory NIE STAŁO NIGDZIE poza kontrolą lokalną — zmierzone
      #  10.09.2026: `.github/workflows/ci.yml` nie uruchamiał ani jednego
      #  pliku z `tests/skrypty/`. Kopia bazy jest w całości skryptem powłoki
      #  (w obrazie bez PHP — o tym jest D-043), więc żaden test PHPUnit jej
      #  nie dotyka. Zielone CI nie mówiło zatem NIC o jedynej kopii bazy
      #  tego projektu, a wystarczyło zapomnieć uruchomić `check.sh`.
      #
      #  To jest dokładnie pułapka 5 z `docs/PULAPKI_TESTOW.md`: narzędzie
      #  melduje sukces, nie sprawdzając tego, o czym mowa.
      #
      #  Krok jest tani (kilka sekund, bez bazy i bez sieci) i sam pilnuje
      #  swojej wiarygodności: skrypt testowy wychodzi kodem 1, gdy nie
      #  znajdzie plików do testowania, więc przeniesienie `docker/kopia/`
      #  zapali CI, a nie wyłączy testu po cichu.
      # =====================================================================
      # =====================================================================
      #  KLIENT POSTGRESA MUSI MIEĆ WERSJĘ 18 — inaczej `pg_restore` ODMAWIA
      #
      #  Skrypty kopii i próby odtworzenia wołają PRAWDZIWY `pg_restore` na
      #  runnerze, a serwer w usłudze to `postgres:18-alpine`. Klient starszy
      #  niż serwer nie ostrzega — odmawia odczytu archiwum, i to ZDROWEGO
      #  archiwum tak samo jak uszkodzonego. Zmierzone 20.09.2026 po
      #  przełączeniu `CI_RUNS_ON` na `ubuntu-latest`: każdy przypadek dostawał
      #  kod 51 („pg_restore nie czyta") zamiast 0 dla zdrowego i 53 dla
      #  obciętego, więc test obcięcia przestawał cokolwiek mierzyć, meldując
      #  przy tym czerwień wyglądającą na winę gałęzi. Na `self-hosted`, gdzie
      #  klient 18 stoi od dawna, ten sam job był zielony.
      #
      #  ŚWIADOMY KOSZT: to jest `apt-get`, czyli przebieg CI zależy od
      #  dostępności repozytorium PGDG. W tym repozytorium taka zależność raz
      #  już zabiła joba na czterech PR-ach naraz i dlatego istnieje strażnik
      #  `JobDostepnosciNieWolaAptaTest` — ale pilnuje on WYŁĄCZNIE joba
      #  dostępności i nie dotyczy tego kroku. Decyzja właściciela z 20.09.2026:
      #  zostajemy na `ubuntu-latest` i doinstalowujemy klienta.
      #
      #  Krok NIE JEST cichy: gdy klient 18 jest już obecny, nie rusza apta
      #  w ogóle; gdy instalacja się nie uda, job pada TUTAJ z nazwaną
      #  przyczyną, zamiast później udawać awarię kopii bazy.
      # =====================================================================
      - name: Klient PostgreSQL 18 (wymagany przez skrypty kopii)
        run: |
          set -euo pipefail
          # `case`, nie `grep -qE` — straznik PortMarkiMaWlasnaBramkeCiTest
          # wymaga, by `grep -qE` z apostrofem bylo w tym pliku DOKLADNIE RAZ.
          case "$(pg_restore --version 2>/dev/null)" in
            *" 18."*|*" 18") echo "Klient 18 juz jest - apt nietkniety."; exit 0 ;;
          esac
          echo "Obecny klient: $(pg_restore --version 2>/dev/null || echo brak)"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 3 --retry-delay 5 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # Bez tego `pg_restore` dalej wskazywalby starszego klienta z PATH.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          wersja=$(pg_restore --version)
          echo "Po instalacji: ${wersja}"
          # Kontrola dodatnia: krok ma pasc TU, a nie dopiero na kopii bazy.
          case "${wersja}" in
            *" 18."*|*" 18") ;;
            *) echo "::error::Klient PostgreSQL 18 NIE zostal zainstalowany (${wersja}). Skrypty kopii bazy odmowilyby odczytu ZDROWEGO archiwum, meldujac to jako uszkodzenie."; exit 1 ;;
          esac
      - name: Testy skryptu kopii bazy
        run: bash tests/skrypty/kopia-bazy.sh

  # ===========================================================================
  #  1b. Przyrząd do testu obciążeniowego (#605)
  # ===========================================================================
  #  Osobny job, bo to jedyny zestaw w tym repozytorium, który sprawdza
  #  NARZĘDZIE POMIAROWE, a nie produkt. Nie potrzebuje bazy, PHP, przeglądarki
  #  ani sieci: stanowiskiem jest `scripts/serwer-scenariuszy-605.mjs` na
  #  porcie przydzielanym dynamicznie. Całość trwa ok. 20 s.
  #
  #  Bez tego kroku regresja z 18 września 2026 wraca po cichu: `zadanie()`
  #  nie kończyło obietnicy przy odpowiedzi urwanej po nagłówkach, a limit
  #  mierzył bezczynność gniazda zamiast czasu żądania — i pomiar wisiał.
  #  Odtworzenie: docs/infra/evidence/obciazenie605/ODTWORZENIE_ZAWIESZENIA.md
  # ===========================================================================
  przyrzad_605:
    name: Przyrząd testu obciążeniowego (#605)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Bez `npm ci` — przyrząd i jego testy nie mają ani jednej zależności.
      - name: Regresje i kontrole ujemne przyrządu
        run: node scripts/przyrzad-605.test.mjs

  # ===========================================================================
  #  2. Analiza statyczna — Larastan / PHPStan
  # ===========================================================================
  static-analysis:
    name: Larastan (analiza statyczna)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    # UWAGA: w repozytorium nie ma jeszcze `phpstan.neon` (issue #32), więc
    # `phpstan analyse` kończyłby się „At least one path must be specified".
    #
    # Krok PHPStana jest dlatego warunkowy: bez konfiguracji job kończy się
    # ZIELONY z adnotacją w podsumowaniu, zamiast zapalać czerwoną lampkę,
    # której nie da się naprawić kodem. Od stałej czerwonej lampki ludzie
    # uczą się, że czerwone CI się ignoruje — i wtedy przestaje działać
    # także to CI, które coś naprawdę sprawdza.
    #
    # Świadomie NIE używamy `continue-on-error`: ono i tak raportuje check
    # jako `failure`, tylko nie psuje przebiegu. Chcemy odwrotnie —
    # uczciwie „pominięte", nie „padło, ale nieważne".
    #
    # To rozwiązanie samo się naprawia: w chwili, gdy #32 doda plik
    # konfiguracyjny, analiza zaczyna działać i BLOKOWAĆ. Nie ma tu nic,
    # o czym trzeba pamiętać, żeby usunąć. Ta sama logika jest
    # w scripts/check.sh.
    #
    # Warunek MUSI używać `test -f ... || test -f ...`, nie `ls a b c` —
    # patrz komentarz przy samym kroku niżej.

    steps:
      - uses: actions/checkout@v7

      # Własny katalog narzędzi tego joba — pełne uzasadnienie i pomiary
      # przy tym samym kroku w jobie `lint` wyżej (issue #262).
      # Prywatny katalog narzędzi joba i konfiguracja PHP — pełne
      # uzasadnienie stoi teraz przy kodzie, w `.github/actions/php`.
      - name: Środowisko PHP
        uses: ./.github/actions/php
        with:
          wersja: ${{ env.PHP_VERSION }}

      - name: Cache Composera
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Instalacja zależności
        run: composer install --no-interaction --prefer-dist --no-progress

      # PHPStan cache'uje wyniki — bez tego każdy przebieg analizuje wszystko
      # od zera (kilka minut zamiast kilkudziesięciu sekund).
      - name: Cache PHPStana
        uses: actions/cache@v6
        with:
          path: .phpstan-cache
          key: phpstan-${{ runner.os }}-${{ github.sha }}
          restore-keys: phpstan-${{ runner.os }}-

      # Larastan potrzebuje .env, żeby zbootować aplikację.
      - name: Przygotowanie .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Bez tego kroku job nie wiedziałby, czy „brak wyniku" to brak
      # konfiguracji, czy realny błąd analizy.
      - name: Czy jest konfiguracja PHPStana?
        id: phpstan_config
        run: |
          # UWAGA: `ls a b c` kończy się NIEZEROWO, jeśli brakuje
          # KTÓREGOKOLWIEK z plików — a nie dopiero wtedy, gdy brakuje
          # wszystkich. Poprzednia wersja tego kroku pomijała więc analizę
          # także po dodaniu poprawnej konfiguracji, czyli obietnica „włączy
          # się samo, gdy #32 doda plik" była nieprawdziwa.
          if test -f phpstan.neon || test -f phpstan.neon.dist || test -f phpstan.dist.neon; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Analiza statyczna pominięta"
              echo ""
              echo "W repozytorium nie ma \`phpstan.neon\`, więc nie ma czego analizować."
              echo "Konfigurację dokłada **issue #32** — po jej dodaniu ten job"
              echo "zacznie działać i blokować sam z siebie, bez zmian w workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: PHPStan
        if: steps.phpstan_config.outputs.exists == 'true'
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # ===========================================================================
  #  3. Testy — Pest/PHPUnit na prawdziwym PostgreSQL 18
  # ===========================================================================
  #  Testujemy na TEJ SAMEJ wersji majora co produkcja. SQLite in-memory byłby
  #  szybszy, ale nie złapałby niczego, co dotyczy Postgresa: JSONB, FTS,
  #  pg_trgm, indeksów GIN, ILIKE, ograniczeń unikalności z NULL-ami.
  #  Wyszukiwanie w Kuking stoi na Postgres FTS (docs/ARCHITECTURE.md),
  #  więc testowanie na innym silniku byłoby testowaniem czegoś innego.
  # ===========================================================================
  test:
    name: Testy (PostgreSQL 18)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        # PORT HOSTA JEST DYNAMICZNY, NIE 5432.
        #
        # Runnery Kuking wykonują joby PROSTO NA HOŚCIE (nie w kontenerze
        # joba) i dzielą jeden demon Dockera. Sztywne `5432:5432` znaczyło
        # więc, że drugi job z kontenerem Postgresa padał na
        # `Bind for 0.0.0.0:5432 failed: port is already allocated` —
        # a joby `test` i `dostepnosc` startują w tej samej sekundzie
        # (zmierzone: przebieg 34158198715, oba wystartowały 20:07:39).
        #
        # Sam `- 5432` każe Dockerowi wybrać wolny port hosta. Numer, który
        # wybrał, czyta się z `job.services.postgres.ports[5432]` i to robi
        # pierwszy krok tego joba. Port WEWNĄTRZ kontenera zostaje 5432.
        ports:
          - 5432
        # Bez healthchecku joby startują, zanim Postgres przyjmie połączenia,
        # co daje losowo padające testy ("connection refused").
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      # Statyczny klucz testowy. To NIE jest sekret — służy tylko do tego,
      # żeby szyfrowanie miało poprawnie sformatowany klucz w testach.
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      # DB_HOST i DB_PORT NIE stoją tutaj celowo — ustawia je pierwszy krok
      # tego joba, bo port hosta jest dynamiczny (patrz komentarz przy
      # `ports:` wyżej). Wpisane tu na sztywno przesłaniałyby tamtą wartość.
      DB_DATABASE: kuking_test
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      # Sterowniki, które nie dotykają sieci ani dysku — testy muszą być
      # deterministyczne i nie wysyłać maili ani nie strzelać do R2.
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      # Wyłącz telemetrię w testach.
      SENTRY_LARAVEL_DSN: ""

    steps:
      - uses: actions/checkout@v7

      # ---------------------------------------------------------------------
      #  DYNAMICZNY PORT POSTGRESA → do wszystkich dalszych kroków
      # ---------------------------------------------------------------------
      #  Krok stoi PRZED pierwszym dotknięciem bazy i to jest jego jedyny
      #  wymóg co do kolejności. `$GITHUB_ENV` ustawia zmienną dla KOLEJNYCH
      #  kroków, więc gdyby stał niżej, migracje poszłyby na port, którego
      #  nikt nie mapował.
      #
      #  ZMIERZONE, dlaczego to wystarcza dla Laravela i dla PHPUnita:
      #  zmienna z otoczenia bije oba pliki konfiguracyjne, więc nie trzeba
      #  (i nie należy) przepisywać ani `.env`, ani `phpunit.xml`:
      #    DB_PORT=6543 php artisan tinker  → config('...pgsql.port') = 6543
      #    DB_PORT=6543 php artisan test    → „connection ... port 6543 failed"
      #  Pierwsze, bo `LoadEnvironmentVariables` używa niemutowalnego Dotenv-a
      #  (`.env` nie nadpisuje istniejącej zmiennej). Drugie, bo `<env>`
      #  w `phpunit.xml` bez `force="true"` też nie nadpisuje.
      #
      #  Zostawiony w obu plikach port 5432 jest więc DOMYŚLNYM dla pracy
      #  lokalnej, a nie ścieżką, którą CI może przypadkiem pójść.
      - name: Konfiguracja dynamicznego połączenia z PostgreSQL
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          echo "PostgreSQL mapped to host port ${{ job.services.postgres.ports[5432] }}"

      # Prywatny katalog narzędzi joba i konfiguracja PHP — pełne
      # uzasadnienie stoi przy kodzie, w `.github/actions/php`.
      - name: Środowisko PHP
        uses: ./.github/actions/php
        with:
          wersja: ${{ env.PHP_VERSION }}

      - name: Cache Composera
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Instalacja zależności
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Przygotowanie .env
        run: cp .env.example .env

      # =====================================================================
      #  KLIENT POSTGRESA MUSI MIEĆ WERSJĘ 18 — inaczej `pg_restore` ODMAWIA
      #
      #  Skrypty kopii i próby odtworzenia wołają PRAWDZIWY `pg_restore` na
      #  runnerze, a serwer w usłudze to `postgres:18-alpine`. Klient starszy
      #  niż serwer nie ostrzega — odmawia odczytu archiwum, i to ZDROWEGO
      #  archiwum tak samo jak uszkodzonego. Zmierzone 20.09.2026 po
      #  przełączeniu `CI_RUNS_ON` na `ubuntu-latest`: każdy przypadek dostawał
      #  kod 51 („pg_restore nie czyta") zamiast 0 dla zdrowego i 53 dla
      #  obciętego, więc test obcięcia przestawał cokolwiek mierzyć, meldując
      #  przy tym czerwień wyglądającą na winę gałęzi. Na `self-hosted`, gdzie
      #  klient 18 stoi od dawna, ten sam job był zielony.
      #
      #  ŚWIADOMY KOSZT: to jest `apt-get`, czyli przebieg CI zależy od
      #  dostępności repozytorium PGDG. W tym repozytorium taka zależność raz
      #  już zabiła joba na czterech PR-ach naraz i dlatego istnieje strażnik
      #  `JobDostepnosciNieWolaAptaTest` — ale pilnuje on WYŁĄCZNIE joba
      #  dostępności i nie dotyczy tego kroku. Decyzja właściciela z 20.09.2026:
      #  zostajemy na `ubuntu-latest` i doinstalowujemy klienta.
      #
      #  Krok NIE JEST cichy: gdy klient 18 jest już obecny, nie rusza apta
      #  w ogóle; gdy instalacja się nie uda, job pada TUTAJ z nazwaną
      #  przyczyną, zamiast później udawać awarię kopii bazy.
      # =====================================================================
      - name: Klient PostgreSQL 18 (wymagany przez skrypty kopii)
        run: |
          set -euo pipefail
          # `case`, nie `grep -qE` — straznik PortMarkiMaWlasnaBramkeCiTest
          # wymaga, by `grep -qE` z apostrofem bylo w tym pliku DOKLADNIE RAZ.
          case "$(pg_restore --version 2>/dev/null)" in
            *" 18."*|*" 18") echo "Klient 18 juz jest - apt nietkniety."; exit 0 ;;
          esac
          echo "Obecny klient: $(pg_restore --version 2>/dev/null || echo brak)"
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 3 --retry-delay 5 \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # Bez tego `pg_restore` dalej wskazywalby starszego klienta z PATH.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          wersja=$(pg_restore --version)
          echo "Po instalacji: ${wersja}"
          # Kontrola dodatnia: krok ma pasc TU, a nie dopiero na kopii bazy.
          case "${wersja}" in
            *" 18."*|*" 18") ;;
            *) echo "::error::Klient PostgreSQL 18 NIE zostal zainstalowany (${wersja}). Skrypty kopii bazy odmowilyby odczytu ZDROWEGO archiwum, meldujac to jako uszkodzenie."; exit 1 ;;
          esac

      # Migracje osobnym krokiem, nie w ramach testów: jeśli padnie migracja,
      # chcemy zobaczyć w raporcie "migracje", a nie 300 padniętych testów.
      - name: Migracje
        run: php artisan migrate --force --no-interaction

      # Sanity check, że migracje da się WYCOFAĆ i puścić ponownie.
      # `migrate:refresh` woła down() każdej migracji, więc łapie te bez
      # działającego down() — czyli takie, których nie da się cofnąć podczas
      # incydentu. `migrate:fresh` by tego nie wykrył, bo po prostu kasuje
      # wszystkie tabele, nie uruchamiając down().
      - name: Kontrola odwracalności migracji
        run: php artisan migrate:refresh --force --no-interaction

      # Skrypt najpierw sprawdza niezmienione źródła, po każdej mutacji
      # przywraca kopię i ponawia test. Pełny zestaw idzie na końcu.
      - name: Kontrole negatywne regresji Alfa 0.8 i portu marki
        run: python3 scripts/kontrole-negatywne-alfa08.py

      - name: Testy
        run: php artisan test

  # ===========================================================================
  #  3b. Grupa `dwa-polaczenia` — testy na DWÓCH połączeniach (D-105, #314)
  # ===========================================================================
  #  Osobny job, nie krok w jobie `test`, i to jest cała treść decyzji D-105:
  #  ta grupa nie używa `RefreshDatabase`, ZATWIERDZA dane naprawdę i zakłada
  #  blokady na wierszach. Na tej samej bazie co zwykły przebieg zrzucałaby mu
  #  schemat w trakcie działania (issue #66 z drugiej strony), więc ma własną
  #  bazę `kuking_race` — zakłada ją `tests/Dwa/bin/przygotuj-baze.php`.
  #
  #  `continue-on-error: true` JEST TYMCZASOWE I MA WARUNEK ZDJĘCIA.
  #  Lokalnie grupa przeszła 20 przebiegów z 20, ale na współdzielonym runnerze
  #  i na PostgreSQL 18 (lokalnie: 16) nie ma jeszcze ani jednego pomiaru
  #  stabilności. Migający test blokujący uczy ludzi ignorować czerwone, więc
  #  do czasu zebrania tych danych job RAPORTUJE, ale nie blokuje scalenia.
  #  Warunek zdjęcia flagi: dwadzieścia kolejnych przebiegów CI bez ani jednej
  #  czerwieni tego joba. Co robić, gdy grupa zacznie migać: D-105, sekcja
  #  „Gdy grupa zacznie migać".
  # ===========================================================================
  dwa-polaczenia:
    name: Wyścigi na dwóch połączeniach (nie blokuje)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    continue-on-error: true

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        # Port hosta dynamiczny z tego samego powodu co w jobie `test` —
        # runnery dzielą jeden demon Dockera (komentarz przy tamtym jobie).
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      # DB_DATABASE świadomie NIE stoi tutaj: nazwę bazy wyścigów liczy
      # `kuking_nazwa_bazy_wyscigow()` z `tests/bootstrap.php`, a wpisana tu
      # wartość przesłoniłaby ją i grupa odmówiłaby startu (albo, gorzej,
      # wystartowała na `kuking_test`).
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local

    steps:
      - uses: actions/checkout@v7

      - name: Konfiguracja dynamicznego połączenia z PostgreSQL
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"

      # Drugi job na wspólnej akcji. `dwa-polaczenia` jest oznaczony
      # `continue-on-error: true` i w nazwie ma „nie blokuje", więc jego
      # ewentualna porażka kosztuje najmniej po `audit`.
      - name: Środowisko PHP
        uses: ./.github/actions/php
        with:
          wersja: ${{ env.PHP_VERSION }}

      - name: Cache Composera
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Instalacja zależności
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Przygotowanie .env
        run: cp .env.example .env

      # Jedno polecenie robi wszystko: zakłada bazę `kuking_race`, migruje ją
      # i uruchamia grupę. To samo polecenie, którego używa się lokalnie —
      # żeby nie było w repozytorium dwóch różnych sposobów uruchomienia tej
      # grupy, z których jeden nigdy nie jest sprawdzany.
      - name: Wyścigi na dwóch połączeniach
        run: ./scripts/testy-dwa-polaczenia.sh

  # ===========================================================================
  #  4. Build assetów — Vite 7 + Tailwind 4
  # ===========================================================================
  #  Osobny job, bo build front-endu nie zależy od bazy ani od PHP.
  #  Łapie błędy, które inaczej wyszłyby dopiero w buildzie obrazu na Railway
  #  (a wtedy płacisz za nieudany build i czekasz kilka minut).
  # ===========================================================================
  assets:
    name: Build assetów (Vite)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Konfiguracja Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` (nie `npm install`) — instaluje dokładnie to, co w lockfile,
      # i pada, jeśli package.json rozjechał się z package-lock.json.
      - name: Instalacja zależności
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Proporcje małej skali — rzeczywisty CSS w Chromium
        run: |
          flock -w 600 /tmp/kuking-apt.lock npx playwright install chromium
          node scripts/skala-proporcje.mjs

      # Test DOM: potwierdzenie wyboru tagu w opisie (#754). Stoi TU, a nie na
      # liście `node --test` w skrypcie `build`, bo potrzebuje Chromium —
      # a `npm run build` jedzie także w `Dockerfile` (obraz produkcyjny bez
      # przeglądarki) i w tym zadaniu JESZCZE PRZED krokiem wyżej, który
      # Chromium instaluje. Pełne uzasadnienie w nagłówku samego pliku.
      - name: Regresja potwierdzenia wyboru tagu (DOM w Chromium)
        run: node --test scripts/przegladarka/tagi-potwierdzenie.test.mjs

      # Weryfikacja, że build faktycznie coś wyprodukował. Vite potrafi
      # zakończyć się sukcesem z pustym manifestem przy błędnej konfiguracji,
      # a wtedy produkcja dostaje stronę bez CSS.
      - name: Weryfikacja manifestu Vite
        run: |
          test -f public/build/manifest.json \
            || { echo "BŁĄD: brak public/build/manifest.json"; exit 1; }
          echo "Manifest OK, wpisów: $(grep -o '"file"' public/build/manifest.json | wc -l)"

      # DLACZEGO TO STOI TUTAJ, A NIE W `php artisan test`
      # Ta usterka jest niewidoczna w źródle i widoczna WYŁĄCZNIE po zbudowaniu.
      # Tailwind 4 robi utility z każdego tokenu `--text-*`, więc token
      # `--text-title-lg` generuje klasę `.text-title-lg` o sztywnym stopniu.
      # Nasza reguła z `clamp` nosi tę samą nazwę; jeśli wyląduje w warstwie
      # `base` (tam stała do 8 września 2026), wygrywa wersja wygenerowana,
      # a hasło strony ma 36 px także przy oknie 320 px. Nic nie pęka —
      # tekst się zawija — więc ani PHPUnit, ani Larastan, ani axe tego nie
      # zgłoszą. Widać to tylko w arkuszu wyjściowym, czyli tu.
      #
      # Testy PHPUnit chodzą z `withoutVite()` i celowo NIE mają zbudowanych
      # assetów (patrz `tests/TestCase.php`), więc tam takiego sprawdzenia
      # nie da się postawić uczciwie.
      - name: Największe tytuły przetrwały build z clamp
        run: |
          ARKUSZ=$(ls public/build/assets/app-*.css | head -1)
          for KLASA in text-title-lg text-title-xl; do
            grep -qE "\.${KLASA}\{font-size:clamp" "$ARKUSZ" \
              || { echo "BŁĄD: .${KLASA} nie ma w zbudowanym arkuszu wersji z clamp."; exit 1; }
            grep -qE "\.${KLASA}\{font-size:var\(--${KLASA}\)\}" "$ARKUSZ" \
              && { echo "BŁĄD: .${KLASA} ma w zbudowanym arkuszu także wersję ze sztywnym stopniem — ta z clamp nie zadziała."; exit 1; }
            echo "OK: .${KLASA} skaluje się z szerokością okna."
          done

      # Artefakt przydaje się do debugowania "u mnie działa" oraz do
      # ręcznego porównania rozmiarów bundle'a między PR-ami.
      - name: Zapis artefaktu
        uses: actions/upload-artifact@v7
        with:
          name: vite-build-${{ github.sha }}
          path: public/build
          retention-days: 5

  # ===========================================================================
  #  4b. Dostępność (axe-core) + wydajność i SEO (Lighthouse) — issue #26
  # ===========================================================================
  #  URUCHAMIA SIĘ TYLKO PRZY ZMIANACH W WARSTWIE WIDOKU. Repozytorium jest
  #  prywatne, więc każda minuta Actions kosztuje; ten job podnosi przeglądarkę
  #  i bazę, czyli jest najdroższy z całego CI. Filtr obejmuje także PHP,
  #  które steruje ekranem; sama dokumentacja nie uruchamia pomiaru.
  #
  #  Bez tego joba automat chodziłby tylko wtedy, gdy ktoś PAMIĘTA o fladze
  #  `./scripts/check.sh --dostepnosc` — a o rzeczach, o których trzeba
  #  pamiętać, się zapomina. Trzy usterki, które ten automat złapał przy
  #  pierwszym uruchomieniu, siedziały w kodzie miesiącami.
  #
  #  DLACZEGO LIGHTHOUSE JEST TU DOŁOŻONY, A NIE W OSOBNYM JOBIE
  #  Ten job w chwili, gdy dochodzi do kroku „Lighthouse" niżej, ma JUŻ
  #  postawioną bazę PostgreSQL, PHP, Node, `composer install` + `npm ci`
  #  i ŚCIĄGNIĘTE Chromium (krok „Przeglądarka"). Osobny job „Lighthouse"
  #  powtarzałby WSZYSTKO powyższe od zera, żeby na końcu zrobić to samo,
  #  co ten już zrobił — koszt to samo `flock` na `apt` (patrz krok
  #  „Przeglądarka" niżej) i te same 1,5–2 minuty konfiguracji NA KAŻDYM
  #  PR-ze, tylko po to, żeby postawić drugi raz dokładnie ten sam serwer.
  #  Lighthouse jedzie więc na TEJ SAMEJ przeglądarce Playwrighta i na TEJ
  #  SAMEJ, już wysianej bazie — bez ponownego `migrate:fresh --seed`
  #  (`POMIN_MIGRACJE=1` w kroku „Lighthouse" niżej; pełne uzasadnienie
  #  w nagłówku `scripts/wydajnosc.mjs`).
  #
  #  DLACZEGO LIGHTHOUSE NIE MIERZY TU DOSTĘPNOŚCI
  #  Kategoria „Accessibility" Lighthouse'a liczy się tym samym silnikiem
  #  co krok axe-core wyżej (axe-core pod spodem) — drugi przebieg
  #  dokładałby te same naruszenia WCAG, tylko wolniej. Ten krok liczy
  #  WYŁĄCZNIE `performance` i `seo` — to, czego nie mierzy nic innego
  #  w tym repozytorium. Progi (70 / 85) są z pomiaru lokalnego, nie
  #  z głowy — uzasadnienie liczb w nagłówku `scripts/wydajnosc.mjs`.
  # ===========================================================================
  # Pełny port ma osobny budżet czasu i własną bazę. Nie pomija żadnego
  # dotychczasowego pomiaru; nowe konfiguracje #513 nie konkurują o limit
  # czasu z axe i Lighthouse (PR #517: wspólny job trwał 18 min 34 s).
  # #581: 600 konfiguracji panelu ma własny budżet czasu i PostgreSQL.
  # Każda zmiana kodu (również samego skryptu/fixture/workflow) uruchamia job.
  port_panelu:
    name: Panel marki — puste i pełne widoki
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_port_panel
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_port_panel"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_port_panel
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: public
      SENTRY_LARAVEL_DSN: ""
    steps:
      - uses: actions/checkout@v7
      - name: Izolowane połączenie i narzędzia PHP
        run: |
          set -euo pipefail
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          KATALOG="${RUNNER_TEMP}/kuking-narzedzia/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "$KATALOG/bin" "$KATALOG/cache"
          echo "SETUP_PHP_TOOLS_DIR=$KATALOG/bin" >> "$GITHUB_ENV"
          echo "SETUP_PHP_TOOL_CACHE_DIR=$KATALOG/cache" >> "$GITHUB_ENV"
      - name: Konfiguracja PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - name: Konfiguracja Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Instalacja zależności
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund
      - name: Przeglądarka
        run: flock -w 600 /tmp/kuking-apt.lock npx playwright install chromium
      - name: Nowa baza bez danych demonstracyjnych i rzeczywiste assety
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
          php artisan storage:link
          php artisan migrate --force --no-interaction
          npm run build
      - name: Panel — logowanie z TOTP, faza pusta i pełna
        run: node scripts/panel-marki-run.mjs
      - name: Dowody panelu bez sesji i poświadczeń
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-marki-${{ github.sha }}
          path: |
            storage/port-panelu/*.json
            storage/port-panelu/*.png
            storage/port-panelu/details/*.json
            storage/port-panelu/details/*.png
            storage/port-panelu/details-zoom/*.json
            storage/port-panelu/details-zoom/*.png
          retention-days: 14

  port_marki:
    name: Port marki (kompozycje, zoom i kontrole ujemne)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true' && needs.zakres.outputs.widok == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PORT_GRUPA: baza
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_test
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: public
      SENTRY_LARAVEL_DSN: ""

      # HASŁO KONT DEMONSTRACYJNYCH — Z SEKRETU REPOZYTORIUM, NIE Z REPOZYTORIUM.
      # Ten job robi `migrate:fresh --seed` i loguje się w przeglądarce. Bez tej
      # zmiennej `DemoSeeder` losuje hasło na każdy zasiew (celowo — hasła nie ma
      # w repozytorium, patrz `PoswiadczeniaPozaRepozytoriumTest` / R47),
      # a skrypty logują się swoim stałym. Skutkiem jest `waitForURL: Timeout`
      # na kroku logowania kilkanaście minut później. Pilnuje tego krok
      # „Sekret hasła kont demonstracyjnych" zaraz po `checkout`.
      KUKING_DEMO_HASLO: ${{ secrets.KUKING_DEMO_HASLO }}

    steps:
      - uses: actions/checkout@v7

      # Zaraz po `checkout`, PRZED jakąkolwiek instalacją — brak sekretu ma paść
      # w kilkanaście sekund i powiedzieć, czego brakuje, zamiast wychodzić
      # kilkanaście minut później jako timeout logowania w przeglądarce.
      # Uzasadnienie i treść komunikatów: `.github/actions/haslo-demo/action.yml`.
      - name: Hasło kont demonstracyjnych jest dostępne
        uses: ./.github/actions/haslo-demo
        with:
          haslo: ${{ secrets.KUKING_DEMO_HASLO }}
          fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}

      - name: Konfiguracja dynamicznego połączenia z PostgreSQL
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          echo "PostgreSQL mapped to host port ${{ job.services.postgres.ports[5432] }}"


      # Prywatny katalog narzędzi joba i konfiguracja PHP — pełne
      # uzasadnienie stoi przy kodzie, w `.github/actions/php`.
      - name: Środowisko PHP
        uses: ./.github/actions/php
        with:
          wersja: ${{ env.PHP_VERSION }}

      - name: Konfiguracja Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalacja zależności
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Regresja wyboru grup portu
        run: node --test scripts/port-grupy.test.mjs

      - name: Przeglądarka
        run: flock -w 600 /tmp/kuking-apt.lock npx playwright install chromium

      - name: Przygotowanie
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
          php artisan storage:link
          npm run build

          php artisan migrate:fresh --seed --force --no-interaction

      - name: Port projektu — układ i kontrola ujemna
        env:
          DB_DATABASE: kuking_port_pomiar
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: node scripts/port-projektu.mjs

      - name: Zrzuty portu marki
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-marki-${{ github.sha }}
          path: |
            storage/port-projektu
          retention-days: 14

  # #577: osobny checkout i PostgreSQL; mutacje negatywów nie współdzielą plików.
  port_funkcje:
    name: Port marki — rodziny ekranów, zoom i kreator
    needs: zakres
    if: needs.zakres.outputs.kod == 'true' && needs.zakres.outputs.widok == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON_BROWSER || '"ubuntu-latest"') }}
    # CI 35241344523: pełne pomiary i upload trwały ponad 25 min; zachowujemy wszystkie kontrole.
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      PORT_GRUPA: rozszerzenia
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_DATABASE: kuking_test
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: public
      SENTRY_LARAVEL_DSN: ""

      # HASŁO KONT DEMONSTRACYJNYCH — Z SEKRETU REPOZYTORIUM, NIE Z REPOZYTORIUM.
      # Ten job robi `migrate:fresh --seed` i loguje się w przeglądarce. Bez tej
      # zmiennej `DemoSeeder` losuje hasło na każdy zasiew (celowo — hasła nie ma
      # w repozytorium, patrz `PoswiadczeniaPozaRepozytoriumTest` / R47),
      # a skrypty logują się swoim stałym. Skutkiem jest `waitForURL: Timeout`
      # na kroku logowania kilkanaście minut później. Pilnuje tego krok
      # „Sekret hasła kont demonstracyjnych" zaraz po `checkout`.
      KUKING_DEMO_HASLO: ${{ secrets.KUKING_DEMO_HASLO }}

    steps:
      - uses: actions/checkout@v7

      # Zaraz po `checkout`, PRZED jakąkolwiek instalacją — brak sekretu ma paść
      # w kilkanaście sekund i powiedzieć, czego brakuje, zamiast wychodzić
      # kilkanaście minut później jako timeout logowania w przeglądarce.
      # Uzasadnienie i treść komunikatów: `.github/actions/haslo-demo/action.yml`.
      - name: Hasło kont demonstracyjnych jest dostępne
        uses: ./.github/actions/haslo-demo
        with:
          haslo: ${{ secrets.KUKING_DEMO_HASLO }}
          fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}

      - name: Konfiguracja dynamicznego połączenia z PostgreSQL
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          echo "PostgreSQL mapped to host port ${{ job.services.postgres.ports[5432] }}"


      - name: Własny katalog narzędzi PHP (issue #262)
        run: |
          set -euo pipefail
          KATALOG="${RUNNER_TEMP}/kuking-narzedzia/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "$KATALOG/bin" "$KATALOG/cache"
          echo "SETUP_PHP_TOOLS_DIR=$KATALOG/bin" >> "$GITHUB_ENV"
          echo "SETUP_PHP_TOOL_CACHE_DIR=$KATALOG/cache" >> "$GITHUB_ENV"

      - name: Konfiguracja PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Konfiguracja Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalacja zależności
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Regresja wyboru grup portu
        run: node --test scripts/port-grupy.test.mjs

      - name: Przeglądarka
        run: flock -w 600 /tmp/kuking-apt.lock npx playwright install chromium

      - name: Przygotowanie
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
          php artisan storage:link
          npm run build

          php artisan migrate:fresh --seed --force --no-interaction

      - name: Port projektu — układ i kontrola ujemna
        env:
          DB_DATABASE: kuking_port_pomiar
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: node scripts/port-projektu.mjs

      - name: Trzy kroki kreatora przy dużym tekście
        env:
          DB_DATABASE: kuking_port_pomiar
        run: node scripts/kroki-kreatora.mjs

      - name: Minutnik — opóźnione wywołania i dostępny czas
        run: |
          node scripts/minutnik-regresja.mjs
          node scripts/minutnik-fokus.mjs

      - name: Zrzuty portu marki
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: port-funkcje-${{ github.sha }}
          path: |
            storage/port-projektu
            storage/kroki-kreatora
          retention-days: 14

  dostepnosc:
    name: Dostępność (axe-core) i wydajność (Lighthouse)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true' && needs.zakres.outputs.widok == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kuking_test
          POSTGRES_USER: kuking
          POSTGRES_PASSWORD: secret
        # PORT HOSTA JEST DYNAMICZNY, NIE 5432.
        #
        # Runnery Kuking wykonują joby PROSTO NA HOŚCIE (nie w kontenerze
        # joba) i dzielą jeden demon Dockera. Sztywne `5432:5432` znaczyło
        # więc, że drugi job z kontenerem Postgresa padał na
        # `Bind for 0.0.0.0:5432 failed: port is already allocated` —
        # a joby `test` i `dostepnosc` startują w tej samej sekundzie
        # (zmierzone: przebieg 34158198715, oba wystartowały 20:07:39).
        #
        # Sam `- 5432` każe Dockerowi wybrać wolny port hosta. Numer, który
        # wybrał, czyta się z `job.services.postgres.ports[5432]` i to robi
        # pierwszy krok tego joba. Port WEWNĄTRZ kontenera zostaje 5432.
        ports:
          - 5432
        options: >-
          --health-cmd="pg_isready -U kuking -d kuking_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      # DB_HOST i DB_PORT NIE stoją tutaj celowo — patrz ten sam komentarz
      # w jobie `test` wyżej.
      DB_DATABASE: kuking_test
      DB_USERNAME: kuking
      DB_PASSWORD: secret
      # Sesja w pliku, nie w tablicy: skrypt loguje się przez prawdziwy
      # formularz i musi utrzymać sesję między żądaniami.
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: public
      SENTRY_LARAVEL_DSN: ""

      # HASŁO KONT DEMONSTRACYJNYCH — Z SEKRETU REPOZYTORIUM, NIE Z REPOZYTORIUM.
      # Ten job robi `migrate:fresh --seed` i loguje się w przeglądarce. Bez tej
      # zmiennej `DemoSeeder` losuje hasło na każdy zasiew (celowo — hasła nie ma
      # w repozytorium, patrz `PoswiadczeniaPozaRepozytoriumTest` / R47),
      # a skrypty logują się swoim stałym. Skutkiem jest `waitForURL: Timeout`
      # na kroku logowania kilkanaście minut później. Pilnuje tego krok
      # „Sekret hasła kont demonstracyjnych" zaraz po `checkout`.
      KUKING_DEMO_HASLO: ${{ secrets.KUKING_DEMO_HASLO }}

    steps:
      # Bez `fetch-depth: 0`. Porównanie z bazą (`git diff --name-only`)
      # robi WYŁĄCZNIE job `zakres` — to on potrzebuje pełnej historii.
      # Ten job nie woła gita; czy rusza warstwę widoku, czyta gotowe
      # z `needs.zakres.outputs.widok` i `needs.zakres.outputs.kod`.
      # Pilnuje tego `PortMarkiMaWlasnaBramkeCiTest`.
      - uses: actions/checkout@v7

      # Zaraz po `checkout`, PRZED jakąkolwiek instalacją — brak sekretu ma paść
      # w kilkanaście sekund i powiedzieć, czego brakuje, zamiast wychodzić
      # kilkanaście minut później jako timeout logowania w przeglądarce.
      # Uzasadnienie i treść komunikatów: `.github/actions/haslo-demo/action.yml`.
      - name: Hasło kont demonstracyjnych jest dostępne
        uses: ./.github/actions/haslo-demo
        with:
          haslo: ${{ secrets.KUKING_DEMO_HASLO }}
          fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}

      # Dynamiczny port Postgresa — pełne uzasadnienie i pomiary przy tym
      # samym kroku w jobie `test` wyżej.
      - name: Konfiguracja dynamicznego połączenia z PostgreSQL
        run: |
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=${{ job.services.postgres.ports[5432] }}" >> "$GITHUB_ENV"
          echo "PostgreSQL mapped to host port ${{ job.services.postgres.ports[5432] }}"

      # GitHub Actions nie umie filtrować ścieżek per JOB (tylko per workflow),
      # więc decyduje wyjście joba `zakres`. Warunek stoi na całym jobie,
      # nie na krokach; PHP sterujące ekranem też uruchamia pomiar (#1039).
      - name: Własny katalog narzędzi PHP (issue #262)
        run: |
          set -euo pipefail
          KATALOG="${RUNNER_TEMP}/kuking-narzedzia/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          mkdir -p "$KATALOG/bin" "$KATALOG/cache"
          echo "SETUP_PHP_TOOLS_DIR=$KATALOG/bin" >> "$GITHUB_ENV"
          echo "SETUP_PHP_TOOL_CACHE_DIR=$KATALOG/cache" >> "$GITHUB_ENV"

      - name: Konfiguracja PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, exif, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Konfiguracja Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalacja zależności
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      # Pobieramy SAMO Chromium — bez Firefoksa i WebKita, których ten automat
      # nie używa, i bez `--with-deps`, czyli bez wołania `apt-get`.
      #
      #  DLACZEGO BEZ `--with-deps`. Ta flaga przełącza się na roota i robi
      #  `apt-get update`, a runnery `kuking-wsl-DOM-NEW-01`, `-02` i `-03`
      #  stoją na jednym systemie z listą źródeł, w której siedzi PPA
      #  `ppa.setup-php.com/ondrej/php`. 9 września to źródło zaczęło zwracać
      #  404 na plik Release dla Ubuntu „resolute":
      #
      #      Err:4 https://ppa.setup-php.com/ondrej/php/ubuntu resolute Release
      #        404  Not Found
      #      E: The repository ... does not have a Release file.
      #      Failed to install browsers → exit 100
      #
      #  `apt-get update` kończy się wtedy niezerowo, Playwright przerywa
      #  instalację i job pada, ZANIM zobaczy pierwszy ekran. Job dostępności
      #  nie ma nic wspólnego z PHP z PPA — a jednak umierał na tym, że komuś
      #  na świecie zniknął plik Release. Biblioteki systemowe Chromium są na
      #  tej maszynie zainstalowane raz, na stałe; jeśli kiedyś zabraknie
      #  którejś, Playwright powie to wprost i wymieni pakiety do doinstalowania
      #  (jednorazowo, na maszynie, nie z CI).
      #
      #  `flock` ZOSTAJE, BO TRZY RUNNERY DZIELĄ JEDNĄ MASZYNĘ — a więc i jeden
      #  katalog przeglądarek. Wcześniej blokada chroniła `/var/lib/dpkg`
      #  (job na #161 przeszedł o 09:00:02, ten sam job na #162 padł o 09:00:59
      #  na zajętym locku apta); teraz chroni rozpakowywanie Chromium do
      #  współdzielonej ścieżki.
      #
      #  DLACZEGO `flock`, A NIE `concurrency:` NA JOBIE. Klucz `concurrency`
      #  trzyma w grupie jeden bieg działający i JEDEN oczekujący; trzeci
      #  ANULUJE tego oczekującego. Przy trzech otwartych PR-ach zamieniłoby
      #  to kolizje na anulowane joby, czyli jeden problem na drugi. `flock`
      #  ustawia kolejkę na poziomie maszyny — dokładnie tam, gdzie jest
      #  współdzielony zasób — i nikogo nie wyrzuca.
      #
      #  `-w 600`: po dziesięciu minutach czekania wolimy wyraźny błąd niż
      #  job wiszący do limitu. Blokada leży w `/tmp`, więc znika z restartem
      #  maszyny i nie potrafi zostać zatrzaśnięta na stałe.
      - name: Przeglądarka
        run: flock -w 600 /tmp/kuking-apt.lock npx playwright install chromium

      - name: Przygotowanie
        run: |
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${APP_KEY}|" .env
          php artisan storage:link
          npm run build

          # MIGRACJA TUTAJ, NIE TYLKO W SKRYPCIE. `dostepnosc.mjs` robi
          # `migrate:fresh --seed` sam, ale `wydajnosc.mjs` na tym polegał —
          # dwa niezależne narzędzia dzieliły stan, którego jedno z nich nie
          # tworzy. Gdy pierwsze nie doszło do końca, drugie startowało na
          # pustej bazie i padało na healthchecku (issue #215).
          php artisan migrate:fresh --seed --force --no-interaction


      # ---------------------------------------------------------------------
      #  STRAŻNIK MARTWYCH REGUŁ CSS (D-223)
      # ---------------------------------------------------------------------
      #  DLACZEGO TUTAJ, A NIE W `npm run build` ANI W `scripts/check.sh`.
      #
      #  Ten strażnik NIE czyta arkusza jako tekstu — podnosi `php artisan
      #  serve`, otwiera strony w Chromium i pyta `getComputedStyle`, czy
      #  deklaracja cokolwiek zmienia. Potrzebuje więc CZTERECH rzeczy naraz:
      #  zbudowanego arkusza, przeglądarki, PHP i ZASIANEJ bazy (mierzy m.in.
      #  `/przepisy/rosol-babci-zofii`).
      #
      #  Lista `npm run build` odpada z dwóch powodów zmierzonych 21.09.2026:
      #  `build` biegnie także w `Dockerfile`, w obrazie BEZ przeglądarki
      #  (i bez bazy), a w tym workflow `npm run build` stoi w jobie `assets`
      #  PRZED `npx playwright install chromium`. W obu miejscach strażnik
      #  padłby na braku Chromium, czyli na przyrządzie, a nie na CSS-ie.
      #
      #  Job `dostepnosc` ma wszystkie cztery rzeczy już postawione krok wyżej,
      #  więc strażnik nie dokłada ani pobierania przeglądarki, ani migracji.
      #  Stoi PRZED pomiarami axe i Lighthouse celowo: gdy CSS jest martwy,
      #  werdykt pada po kilkudziesięciu sekundach zamiast po kilkunastu
      #  minutach, a w logu zostaje jedna prawdziwa przyczyna.
      #
      #  ZAWĘŻENIE `--tylko` NIE JEST TU WYCISZENIEM. Repozytorium ma dziś
      #  zmierzony zaległy zbiór deklaracji przykrytych (D-223), o którym
      #  właściciel jeszcze nie rozstrzygnął — na całym arkuszu bramka byłaby
      #  czerwona od pierwszego dnia i nikt by jej nie czytał. Zawężenie stoi
      #  w JEDNYM miejscu, w `scripts/kaskada-kontrola-polecenie.sh`, razem
      #  z zakazem cofania go dla uciszenia czerwieni; ten sam plik wywołuje
      #  kontrola ujemna, więc bramka i jej dowód mierzą DOKŁADNIE to samo.
      #  Sam skrypt kończy się kodem 2, gdy zawężenie nie objęło ani jednej
      #  reguły z nosicielem — literówka w nim nie może dać cichej zieleni.
      - name: Martwe reguły CSS przykryte przez późniejszą warstwę (D-223)
        run: bash scripts/kaskada-kontrola-polecenie.sh
      - name: Sekretny adres nie przechodzi do analityki (#1052)
        env:
          DB_DATABASE: kuking_port_referrer
        run: |
          export PGPASSWORD="$DB_PASSWORD"
          createdb -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USERNAME" -O "$DB_USERNAME" "$DB_DATABASE"
          php artisan migrate --force --no-interaction
          node scripts/referrer-sekret-browser.mjs

      # Skrypt sam wykrywa, skąd wziąć Chromium: na runnerze bierze to, co
      # przed chwilą pobrał Playwright, a w obrazie deweloperskim gotową
      # przeglądarkę spod stałej ścieżki. Nie trzeba nic podawać.
      - name: Kontrola ujemna wiadomości marki
        shell: bash
        run: |
          set -euo pipefail
          source_file=resources/views/mail/link-do-logowania.blade.php
          backup_dir=$(mktemp -d)
          cp "$source_file" "$backup_dir/wiadomosc.blade.php"
          before_hash=$(md5sum "$source_file" | cut -d' ' -f1)
          restore_mail() {
            cp "$backup_dir/wiadomosc.blade.php" "$source_file"
            php artisan view:clear >/dev/null
            after_hash=$(md5sum "$source_file" | cut -d' ' -f1)
            test "$before_hash" = "$after_hash"
            echo "MAIL_UJEMNA przywrocony=$after_hash"
            rm -rf "$backup_dir"
          }
          trap restore_mail EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resources/views/mail/link-do-logowania.blade.php')
          s = p.read_text()
          assert '#F3F4F1' in s
          p.write_text(s.replace('#F3F4F1', '#FAF6F0'))
          PY
          echo "MAIL_UJEMNA przed=$before_hash zmieniony=$(md5sum "$source_file" | cut -d' ' -f1)"
          php artisan view:clear
          if php artisan test --compact --filter=SpojnoscWiadomosciMarkiTest > "$backup_dir/wynik.txt" 2>&1; then
            echo "BŁĄD: stara paleta nie została wykryta"
            exit 1
          fi
          cat "$backup_dir/wynik.txt"
          grep -q "F3F4F1" "$backup_dir/wynik.txt"
          cp "$backup_dir/wiadomosc.blade.php" "$source_file"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resources/views/mail/link-do-logowania.blade.php')
          s = p.read_text()
          assert 'ten link niedługo przestanie działać.' in s
          p.write_text(s.replace('ten link niedługo przestanie działać.', 'ten link niedługo przestanie działać. Nikt bez dostępu do tej skrzynki nie wejdzie na Twoje konto.'))
          PY
          php artisan view:clear
          echo "MAIL_UJEMNA obietnica=$(md5sum "$source_file" | cut -d' ' -f1)"
          if php artisan test --compact --filter=test_listy_logowania_nie_obiecuja_wylacznego_dostepu_przez_skrzynke > "$backup_dir/wynik.txt" 2>&1; then
            echo "BŁĄD: fałszywa obietnica nie została wykryta"
            exit 1
          fi
          cat "$backup_dir/wynik.txt"
          grep -q "Nikt bez" "$backup_dir/wynik.txt"
          restore_mail
          trap - EXIT
          php artisan test --compact --filter=SpojnoscWiadomosciMarkiTest

      - name: Aktualizacja aplikacji ze starym workerem
        run: node scripts/service-worker-aktualizacja.mjs

      - name: Regresja bramki kafla dodawania (#484)
        run: node scripts/kafel-dodawania-bramka.test.mjs

      - name: Pomiar kafla dodawania (15 wariantów)
        run: node scripts/kafel-dodawania.mjs

      - name: Fokus i kliknięcia kart dania (#485)
        run: node scripts/fokus-karty-dania.mjs

      - name: Fokus, kliknięcia i dialog zdjęć (#561)
        run: node scripts/fokus-zdjec.mjs

      - name: axe-core (aktualna macierz ekranów i wariantów)
        run: node scripts/dostepnosc.mjs

      # Wynik zapisujemy ZAWSZE, także przy porażce — po to jest, żeby dało
      # się zobaczyć, co konkretnie się zepsuło, bez odtwarzania u siebie.
      - name: Zapis wyniku (dostępność)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dostepnosc-${{ github.sha }}
          path: |
            storage/dostepnosc.json
            storage/dostepnosc/oauth345/
            storage/kaskada-martwe-reguly.json
            output/fokus-zdjec/
          retention-days: 14

      # ---------------------------------------------------------------------
      #  LIGHTHOUSE — WYDAJNOŚĆ I SEO (issue #26, druga połowa)
      # ---------------------------------------------------------------------
      #  Pełne uzasadnienie umiejscowienia (ten sam job, nie osobny) i progów
      #  (70 / 85, z pomiaru, nie z głowy) stoi w nagłówku `scripts/wydajnosc.mjs`
      #  i w komentarzu przy tym joobie wyżej. Krótko tutaj:
      #
      #  ŻADNEJ FURTKI URUCHAMIAJĄCEJ PO PORAŻCE. Stało tu kiedyś, że krok ma
      #  pojechać także wtedy, gdy skan axe wyżej zakończył się błędem — bo
      #  naruszenia dostępności nie psują ani bazy, ani assetów. Rozumowanie
      #  było poprawne dla JEDNEJ przyczyny porażki i fałszywe dla wszystkich
      #  pozostałych: 9 września skan padł na nieprzygotowanej bazie, a `!cancelled()`
      #  puściło Lighthouse'a na to samo środowisko, gdzie zameldował własny
      #  błąd („brak odpowiedzi z /health") — i tym zasłonił przyczynę na trzy
      #  godziny. Dziś krok ma tylko warunek zakresu zmiany; po porażce
      #  poprzedniego kroku jest pomijany, czyli w logu zostaje jedna, prawdziwa
      #  awaria. Issue #215.
      #
      #  `POMIN_MIGRACJE=1`, BEZ `ADRES` — baza jest już wysiana przez
      #  `dostepnosc.mjs` chwilę wyżej, w TYM SAMYM joobie; skrypt sam stawia
      #  DRUGI `php artisan serve` (własny, dynamiczny port — pierwszy serwer
      #  axe-core już zamknął swój) na tych samych, gotowych danych.
      - name: Lighthouse (wydajność i SEO)
        # `!cancelled()` STĄD ZDJĘTE — 9 września 2026 to ono zasłoniło
        # prawdziwą awarię. Ten warunek znosi domyślne pomijanie kroku po
        # porażce poprzedniego, więc gdy skan axe padał, Lighthouse startował
        # mimo to — na środowisku, którego nikt nie przygotował — i zgłaszał
        # własny, niezwiązany błąd („brak odpowiedzi z /health"). Krok, który
        # uruchamia się po awarii i melduje coś innego niż jej przyczynę, jest
        # gorszy niż krok pominięty. Issue #215.
        env:
          POMIN_MIGRACJE: '1'
        run: node scripts/wydajnosc.mjs

      - name: Zapis wyniku (wydajność)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wydajnosc-${{ github.sha }}
          path: storage/wydajnosc.json
          retention-days: 14

  # ===========================================================================
  #  5. Audyt bezpieczeństwa zależności
  # ===========================================================================
  #  Nie blokuje merge'a (continue-on-error), bo publikacja nowego CVE
  #  w tranzytywnej zależności nie może zablokować pilnego hotfiksa.
  #  Ale MUSI być widoczne — dlatego osobny job i podsumowanie w GITHUB_STEP_SUMMARY.
  #  Przeglądaj to raz w tygodniu. Patrz DEPLOYMENT_RUNBOOK.md, sekcja "Rotacja".
  # ===========================================================================
  audit:
    name: Audyt zależności
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Prywatny katalog narzędzi joba i konfiguracja PHP — oba kroki stoją
      # razem w `.github/actions/php`, bo działają TYLKO w tej kolejności
      # (issue #262). Pierwszy job przeniesiony na wspólną akcję: `audit`
      # jest szybki i niczego nie blokuje, więc jego ewentualna porażka
      # kosztuje najmniej.
      - name: Środowisko PHP
        uses: ./.github/actions/php
        with:
          wersja: ${{ env.PHP_VERSION }}

      - name: Konfiguracja Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # composer audit działa na composer.lock, więc nie musimy instalować vendora.
      - name: composer audit
        id: composer_audit
        continue-on-error: true
        run: composer audit --locked --no-interaction

      - name: npm audit
        id: npm_audit
        continue-on-error: true
        # BEZ --omit=dev, i to jest poprawka, nie niedopatrzenie (W7-09).
        #
        # Stał tu komentarz: „interesują nas podatności w kodzie, który trafia
        # do przeglądarki, a nie w narzędziach buildu". W tym projekcie to jest
        # odwrócone. `package.json` NIE MA sekcji "dependencies" w ogóle —
        # cały front-end (Vite, Tailwind, laravel-vite-plugin) siedzi
        # w devDependencies. To właśnie te pakiety produkują CSS i JS, który
        # dostaje przeglądarka.
        #
        # Zmierzone: `npm ls --all` widzi 106 pakietów, `npm ls --all --omit=dev`
        # tylko 41, a jedynym pakietem najwyższego poziomu, który zostawał, było
        # `@laravel/multiplex` z optionalDependencies. Ten krok audytował więc
        # praktycznie pustą listę i zawsze świecił na zielono — najgorszy rodzaj
        # kontroli, bo wygląda jak działająca.
        #
        # --audit-level=high zostaje: ostrzeżenia "low" w narzędziach buildu to
        # szum. `continue-on-error` też zostaje — publikacja nowego CVE
        # w tranzytywnej zależności nie może zablokować pilnego hotfiksa
        # (uzasadnienie w nagłówku tego joba). Zmienia się to, CO jest w ogóle
        # sprawdzane, a nie to, czy blokuje.
        run: npm audit --audit-level=high

      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "## Audyt zależności"
            echo ""
            echo "| Narzędzie | Wynik |"
            echo "|---|---|"
            echo "| composer audit | ${{ steps.composer_audit.outcome }} |"
            echo "| npm audit | ${{ steps.npm_audit.outcome }} |"
            echo ""
            echo "Wynik \`failure\` nie blokuje merge'a, ale wymaga reakcji."
            echo "Przegląd raz w tygodniu — DEPLOYMENT_RUNBOOK.md, sekcja Rotacja sekretów."
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  #  6. Build obrazu Docker (weryfikacja, bez publikacji)
  # ===========================================================================
  #  Skoro deployujemy z własnego Dockerfile, CI musi sprawdzić, że ten
  #  Dockerfile się BUDUJE — inaczej pierwszą informacją o błędzie jest
  #  nieudany deploy na Railway.
  #  Nie pushujemy nigdzie obrazu: obraz produkcyjny buduje Railway.
  #  To wyłącznie test poprawności.
  # ===========================================================================
  docker-build:
    name: Build obrazu (weryfikacja)
    needs: zakres
    if: needs.zakres.outputs.kod == 'true'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Konfiguracja Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build obrazu
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: kuking:ci-${{ github.sha }}
          # Cache w GitHub Actions — bez tego każdy przebieg buduje
          # od zera (composer install + npm ci = kilka minut).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test dymny obrazu: czy PHP wstaje, czy są wszystkie rozszerzenia,
      # i czy entrypoint poprawnie odrzuca uruchomienie bez APP_KEY.
      - name: Test dymny obrazu
        run: |
          set -euo pipefail

          echo "--- Wersja PHP ---"
          docker run --rm kuking:ci-${{ github.sha }} php -v

          # Listę rozszerzeń pobieramy RAZ, do zmiennej, i przeszukujemy ją
          # here-stringiem — świadomie bez potoku.
          #
          # Wcześniej było `docker run ... php -m | grep -qix "$ext"` w pętli
          # i to dawało FAŁSZYWE „BRAK": `grep -q` kończy się przy pierwszym
          # trafieniu i zamyka potok, docker dostaje SIGPIPE („write /dev/stdout:
          # broken pipe"), wychodzi z niezerowym kodem, a `set -o pipefail`
          # przenosi to na cały warunek. Wynik zależy od tego, czy producent
          # zdążył dopisać do bufora — czyli wyścig, który raz na jakiś czas
          # wywala CI na losowym rozszerzeniu. Tak padło „BRAK zip", mimo że
          # zip w obrazie JEST.
          #
          # Przy okazji: jedno `docker run` zamiast dziewięciu.
          echo "--- Wymagane rozszerzenia ---"
          modules=$(docker run --rm kuking:ci-${{ github.sha }} php -m)
          for ext in pdo_pgsql pgsql intl gd zip exif pcntl bcmath; do
            if grep -qix "$ext" <<< "$modules"; then
              echo "OK   $ext"
            else
              echo "BRAK $ext"; exit 1
            fi
          done

          # opcache SPRAWDZAMY OSOBNO, bo to Zend Extension, nie zwykłe
          # rozszerzenie: w `php -m` figuruje jako "Zend OPcache" (sekcja
          # [Zend Modules]), NIGDY jako "opcache". Dokładne dopasowanie
          # `grep -qix opcache` nie mogło przejść nigdy — ta pętla po prostu
          # wcześniej padała na czymś innym i nikt nie doszedł do końca listy.
          # Dopasowania podciągiem nie używamy dla całej listy, bo "pgsql"
          # trafiłoby w "pdo_pgsql" i przepuściło brak prawdziwego pgsql.
          if grep -qi "zend opcache" <<< "$modules"; then
            echo "OK   opcache (Zend OPcache)"
          else
            echo "BRAK opcache"; exit 1
          fi

          # Ten test sprawdza, że entrypoint PADA przy pustym APP_KEY.
          # Producent ma tu więc wyjść z niezerowym kodem — to jest sedno testu,
          # nie awaria. Poprzednia wersja robiła `docker run ... | grep -q`,
          # a przy `set -o pipefail` kod błędu entrypointa przechodził na cały
          # potok i warunek wpadał w gałąź "BŁĄD" DOKŁADNIE WTEDY, GDY WALIDACJA
          # DZIAŁA. Test raportował odwrotność prawdy.
          #
          # Dlatego: przechwytujemy wyjście i kod osobno, bez potoku.
          # Wymagamy OBU rzeczy naraz — niezerowego kodu ORAZ komunikatu o
          # APP_KEY. To jest ostrzejsze niż poprzednia wersja: samo wypisanie
          # słowa "APP_KEY" przy jednoczesnym wystartowaniu już nie wystarczy.
          echo "--- Entrypoint musi odrzucić brak APP_KEY ---"
          wyjscie=$(docker run --rm -e APP_KEY= kuking:ci-${{ github.sha }} \
                      /usr/local/bin/kuking-entrypoint web 2>&1) && kod=0 || kod=$?

          if [ "$kod" -ne 0 ] && grep -q "APP_KEY" <<< "$wyjscie"; then
            echo "OK   entrypoint odrzucił start i wyjaśnił dlaczego (kod $kod)"
          else
            echo "BŁĄD: entrypoint nie odrzucił startu bez APP_KEY (kod $kod)"
            echo "--- wyjście entrypointa ---"
            printf '%s\n' "$wyjscie"
            exit 1
          fi

      # =====================================================================
      #  DRUGI OBRAZ: serwis kopii bazy (issue #193, decyzja D-043)
      #
      #  To jest DZIŚ JEDYNA planowana kopia bazy Kuking — Railway na planie
      #  Free/Hobby nie robi żadnych (Volume Backups i PITR są tylko w Pro).
      #  Obraz buduje się z osobnego Dockerfile'a i nie ma w nim PHP, bo
      #  `pg_dump` z PHP wymaga `proc_open`, wyłączonego w docker/php.ini.
      #
      #  DLACZEGO TEN BUILD JEST W CI, A NIE TYLKO NA PRODUKCJI
      #  Bo dwóch rzeczy z tego obrazu NIE DA SIĘ sprawdzić lokalnie ani
      #  testem w powłoce: czy paczki z APT-a w ogóle się zainstalują i czy
      #  `pg_dump` w obrazie ma NAPRAWDĘ wersję 18. Niezgodna wersja klienta
      #  nie jest ostrzeżeniem — `pg_dump` wtedy ODMAWIA pracy, czyli kopii
      #  po prostu nie ma. Lepiej dowiedzieć się o tym z czerwonego CI niż
      #  z alarmu o trzeciej nad ranem.
      # =====================================================================
      - name: Build obrazu kopii bazy
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/kopia/Dockerfile
          push: false
          load: true
          tags: kuking-kopia:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test dymny obrazu kopii bazy
        run: |
          set -euo pipefail
          OBRAZ=kuking-kopia:ci-${{ github.sha }}

          echo "--- pg_dump MUSI być w wersji 18 (zgodnej z serwerem) ---"
          wersja=$(docker run --rm "$OBRAZ" pg_dump --version)
          printf '%s\n' "$wersja"
          major=$(sed -E 's/[^0-9]*([0-9]+).*/\1/' <<< "$wersja")
          if [ "$major" = "18" ]; then
            echo "OK   pg_dump $major"
          else
            echo "BŁĄD: pg_dump ma wersję $major, a serwer produkcyjny to 18."
            echo "      Starszy klient ODMAWIA zrzutu — kopii by nie było."
            exit 1
          fi

          echo "--- narzędzia, bez których skrypt nie zaszyfruje i nie wyśle ---"
          for narzedzie in openssl curl psql pg_restore; do
            if docker run --rm "$OBRAZ" sh -c "command -v $narzedzie" >/dev/null; then
              echo "OK   $narzedzie"
            else
              echo "BRAK $narzedzie"; exit 1
            fi
          done

          echo "--- kontener NIE MOŻE chodzić jako root ---"
          kto=$(docker run --rm "$OBRAZ" id -un)
          if [ "$kto" = "root" ]; then
            echo "BŁĄD: obraz kopii startuje jako root."; exit 1
          fi
          echo "OK   $kto"

          echo "--- w obrazie kopii nie ma PHP (o to chodzi w D-043) ---"
          if docker run --rm "$OBRAZ" sh -c 'command -v php' >/dev/null 2>&1; then
            echo "BŁĄD: w obrazie kopii jest PHP — to nie jest ten obraz."; exit 1
          fi
          echo "OK   brak PHP"

          # Bez zmiennych skrypt MUSI odmówić pracy i powiedzieć, czego brakuje.
          # Ten sam wzorzec i to samo uzasadnienie, co przy APP_KEY wyżej:
          # przechwytujemy wyjście i kod OSOBNO, bez potoku, i wymagamy OBU
          # rzeczy naraz — niezerowego kodu ORAZ komunikatu.
          echo "--- brak konfiguracji musi zatrzymać przebieg, nie zrobić pustej kopii ---"
          wyjscie=$(docker run --rm "$OBRAZ" \
                      /usr/local/lib/kuking/kopia-bazy.sh --sprawdz 2>&1) && kod=0 || kod=$?

          if [ "$kod" -ne 0 ] && grep -q "brak zmiennych" <<< "$wyjscie"; then
            echo "OK   skrypt odmówił i wypisał brakujące zmienne (kod $kod)"
          else
            echo "BŁĄD: skrypt nie odmówił pracy bez konfiguracji (kod $kod)"
            printf '%s\n' "$wyjscie"
            exit 1
          fi
