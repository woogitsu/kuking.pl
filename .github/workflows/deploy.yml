# ---------------------------------------------------------------------------
#  UWAGA: repozytorium jest PRYWATNE, więc minuta GitHub Actions jest płatna
#  wtedy, gdy przebieg idzie na runnery GitHuba.
#
#  Kontrolę robimy lokalnie, za darmo:  ./scripts/check.sh
#  Instalacja hooka pre-push:           ./scripts/install-hooks.sh
#
#  TEN WORKFLOW CHODZI SAM i nie ma tu czego odkomentowywać: blok `on:` niżej
#  jest aktywny i ma `deployment_status` (Railway melduje wynik deployu) obok
#  ręcznego `workflow_dispatch`. Zmierzone 12.09.2026 parserem YAML.
#
#  GDZIE TO CHODZI: rozstrzyga ZMIENNA REPOZYTORIUM `CI_RUNS_ON` (D-121).
#  Każdy job tego pliku ma dokładnie to samo, co joby `ci.yml`:
#
#      runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
#
#  Bez tej zmiennej joby idą na `ubuntu-latest` — zapas w runnerach GitHuba
#  JEST i jest wartością domyślną. Żeby trafiły na nową pulę
#  `woogitsu-linux-01`–`woogitsu-linux-10`, właściciel ustawia w Settings →
#  Secrets and variables → Actions → Variables:
#
#      CI_RUNS_ON = ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#
#  Wartość jest TABLICĄ JSON, bo `fromJSON` dostaje ją w całości; pojedyncza
#  etykieta to `"self-hosted"` z cudzysłowami, nie `self-hosted`.
#
#  Komplet etykiet, a nie nazwa runnera: nazwa przypina job do JEDNEJ maszyny,
#  więc jej awaria zatrzymuje całe CI. `i5-10400f` i `nvidia-gtx1070` ma
#  wyłącznie nowa pula — stare rejestracje WSL-owe (w pomiarach
#  `kuking-wsl-DOM-NEW-01`–`-03`) noszą tylko `self-hosted`, `Linux`, `X64`,
#  `wsl2`, `woogitsu`, więc samo `self-hosted` wpuszcza joby także na nie.
#
#  STAN ZMIERZONY 11.09.2026 (D-121, przebieg CI nr 661): zmienna stoi na SAMYM
#  `self-hosted`, więc przebiegi lądują na starej puli WSL. WŁAŚCICIEL ZOSTAWIA
#  TO TAK ŚWIADOMIE — decyzja z 12.09.2026; to nie jest przeoczenie i nie szukaj
#  tu usterki. Przyjęty koszt, dokładna wartość do przełączenia puli, skutek
#  skasowania zmiennej i sygnał, po którym decyzję odwracamy:
#  docs/infra/SELF_HOSTED_RUNNER.md → „Krok 1" → „Decyzja właściciela
#  z 12 września 2026". Porównanie opcji: docs/infra/CI_BEZ_ACTIONS.md
# ---------------------------------------------------------------------------

# =============================================================================
#  Kuking.pl — deploy i operacje po deployu
#  Docelowa lokalizacja: .github/workflows/deploy.yml
# =============================================================================
#
#  JAK NAPRAWDĘ DZIAŁA DEPLOY W KUKING — przeczytaj, zanim będziesz to zmieniać
#  --------------------------------------------------------------------------
#  Sam BUILD i URUCHOMIENIE kodu robi integracja GitHub ↔ Railway, nie ten plik:
#
#      push do `main`     → Railway buduje i wdraża środowisko `production`
#      push do `staging`  → Railway buduje i wdraża środowisko `staging`
#      otwarcie PR        → Railway tworzy środowisko PR, zamknięcie je usuwa
#
#  Railway ma włączone "Wait for CI", więc czeka na zielony workflow CI.
#  Migracje uruchamia Railway jako pre-deploy command (zadeklarowany
#  w .railway/railway.ts) — czyli PO buildzie, PRZED przełączeniem ruchu,
#  z dostępem do prywatnej sieci, i z blokadą deployu gdy migracja padnie.
#
#  DLACZEGO NIE `railway up` Z TEGO WORKFLOW?
#  Kuszące jest wypchnąć kod z Actions przez `railway up`. Odrzuciliśmy to:
#    1. `railway up` wysyła kod do JEDNEGO serwisu. Docelowo chcemy trzy
#       serwisy aplikacyjne (web, worker, scheduler) z tego samego repo —
#       trzeba by zrobić trzy uploady i trzy niezależne buildy tego samego
#       obrazu. (Dziś, 9 września 2026, jest JEDEN serwis `kuking.pl`
#       w trybie `all`; rozbicie stoi w `.railway/railway.ts`, ale nikt nie
#       uruchomił `railway config apply`, więc jest życzeniem, nie stanem.)
#    2. Tracimy natywne środowiska PR, które wymagają źródła GitHub.
#    3. Tracimy cache warstw buildu Railway (osobny per commit vs. per upload).
#    4. Podwójny deploy: jeśli źródło GitHub zostanie podłączone, każdy push
#       wywołałby build i z Railway, i z Actions.
#  Wniosek: budowanie zostawiamy Railway, a Actions robi to, czego Railway
#  nie robi — weryfikuje wynik i daje narzędzia operacyjne.
#
#  CO ROBI TEN PLIK
#    A) po deployu: test dymny na żywym środowisku + rejestracja wydania w Sentry
#    B) na żądanie (workflow_dispatch): migracje, redeploy i instrukcja
#       ręcznego cofnięcia (rollbacku NIE wykonuje — patrz krok niżej)
#       — czyli to, co potrzebne podczas incydentu, bez wchodzenia w panel
#
#  WYMAGANE SEKRETY (Settings → Secrets and variables → Actions):
#    RAILWAY_TOKEN_PRODUCTION  — token projektowy środowiska production
#    RAILWAY_TOKEN_STAGING     — token projektowy środowiska staging
#    SENTRY_AUTH_TOKEN         — opcjonalny, do rejestracji wydań
#  ZMIENNE (Variables, nie Secrets — nie są tajne):
#    SENTRY_ORG, SENTRY_PROJECT
# =============================================================================

# ---------------------------------------------------------------------------
#  RUNNERY: TYMCZASOWO `ubuntu-latest`, NIE WŁASNA PULA — decyzja właściciela
#  z 8 września 2026, wieczorem. To samo, co w `ci.yml`; pełne uzasadnienie
#  i sposób powrotu stoją tam oraz w D-028 (`docs/DECISIONS.md`).
#
#  W skrócie: trzy z sześciu runnerów są wyłączone, a joby stały w kolejce
#  godzinami. D-028 NIE JEST odwołana — zmieniła się sytuacja, nie strategia.
#
#  POWRÓT NIE WYMAGA JUŻ ZMIANY W KODZIE. `runs-on` czyta zmienną
#  repozytorium `CI_RUNS_ON`; bez niej stoi `ubuntu-latest`. Żeby wrócić
#  na własną pulę, ustaw ją w Settings → Secrets and variables → Actions
#  → Variables na:
#      ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#  Skasowanie zmiennej wraca na runnery GitHuba. Pełne uzasadnienie: D-028.
# ---------------------------------------------------------------------------

name: Deploy

on:
  # ---------------------------------------------------------------------------
  # Railway raportuje status deployu do GitHuba jako Deployment Status.
  # Wchodzimy dopiero, gdy deploy faktycznie się UDAŁ — wtedy weryfikujemy
  # go na żywym środowisku. To jedyny moment, w którym warto robić smoke test:
  # po przełączeniu ruchu, na prawdziwym URL-u.
  # https://docs.railway.com/guides/github-actions-post-deploy
  # ---------------------------------------------------------------------------
  deployment_status:

  # Ścieżka operacyjna, uruchamiana ręcznie.
  workflow_dispatch:
    inputs:
      environment:
        description: "Środowisko docelowe"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      action:
        description: >-
          Co zrobić: smoke = tylko testy dymne;
          migrate = uruchom migracje w kontenerze;
          redeploy = ponowny deploy aktualnej wersji;
          instrukcja-cofniecia = NICZEGO NIE COFA, tylko wypisuje listę
          wdrożeń i instrukcję rollbacku w panelu Railway
        required: true
        type: choice
        options: [smoke, migrate, redeploy, instrukcja-cofniecia]
        default: smoke

permissions:
  contents: read
  deployments: read

# Nie pozwalamy dwóm operacjom na tym samym środowisku biec równolegle.
# cancel-in-progress: false — przerwanie migracji w połowie jest gorsze
# niż poczekanie na jej koniec.
concurrency:
  group: deploy-${{ github.event.inputs.environment || github.event.deployment.environment || github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  #  A) WERYFIKACJA PO DEPLOYU  (automatyczna)
  # ===========================================================================
  verify:
    name: Test dymny po deployu
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # 15, nie 10: sonda wydania (#1012) czeka na przełączenie ruchu najwyżej
    # SONDA_PROBY × (SONDA_ODSTEP + limit curl) ≈ 7,5 minuty, a reszta testu
    # dymnego potrzebuje swoich dwóch-trzech (z końcową sondą: najwyżej
    # 3 × (15 s curl + 5 s) = minuta).
    timeout-minutes: 15

    # -----------------------------------------------------------------------
    #  BRAMKA. Zawężona świadomie — i ZWERYFIKOWANA POMIAREM 22.09.2026.
    #
    #  BYŁO: warunek sprawdzał dodatkowo
    #      contains(fromJSON('["production","staging"]'), github.event.deployment.environment)
    #  To jest człon, który zawodził. Dowód z REST API (400 wdrożeń
    #  woogitsu/kuking.pl, 9–21.09.2026, 1131 statusów):
    #      deployment.environment = 'ideal-exploration / production'  — 400/400
    #      status.environment     = 'ideal-exploration / production'  — 1131/1131
    #  Gołe `production` nie pada ANI RAZU, więc `contains` nigdy nie mógł
    #  trafić. Dopasowanie nazwy środowiska jest teraz w kroku niżej, który
    #  obcina człon po ostatnim ukośniku (i wypisuje, co dostał).
    #
    #  SKUTEK ZDJĘCIA TEGO CZŁONU — zmierzony, nie przewidywany. Workflow
    #  „Deploy" ma dziś 885 przebiegów. Rozkład zdarzenia deployment_status:
    #      629 skipped, 206 success, 6 cancelled, 2 failure
    #  Pierwszy NIEpominięty przebieg: #290 z 9.09.2026 22:17 UTC.
    #  Ostatni: #871 z 21.09.2026 10:40 UTC — w jego dzienniku stoi
    #      deployment.environment  = 'ideal-exploration / production'
    #      deployment_status.state = 'success'
    #      środowisko po obcięciu  = 'production'
    #  i dziesięć linii `OK` z testu dymnego na https://kuking.pl.
    #  Notatka „249 przebiegów, WSZYSTKIE skipped" opisywała stan SPRZED tej
    #  poprawki. Test dymny wykonał się od tamtej pory 206 razy.
    #
    #  `state == 'success'` ZOSTAJE — i liczba „pięć" też się broni, choć
    #  mechanizm jest inny, niż zapisano poprzednio. Railway NIE wysyła pięciu
    #  statusów na jedno wdrożenie. Rozkład (400 wdrożeń):
    #      1 status:   9 wdrożeń      2 statusy: 183     3 statusy: 113
    #      4 statusy: 84             5 i więcej:  11
    #  Najczęstsze sekwencje stanów:
    #      in_progress > inactive                       — 180 wdrożeń
    #      in_progress > success > inactive             — 112
    #      in_progress > success > inactive > inactive  —  84
    #  Stany, jakich Railway używa: in_progress (413), inactive (489),
    #  success (228), failure (1). Stosunek 1131 statusów do 228 sukcesów
    #  wynosi 4,96 — TO jest te „pięć razy". Bez członu `state == 'success'`
    #  ten workflow odpalałby się blisko pięciokrotnie częściej, więc
    #  argument kosztowy z D-010 stoi.
    #
    #  CZEGO TA BRAMKA NIE ZŁAPIE — i nie da się tego naprawić warunkiem:
    #  192 z 400 wdrożeń (48%) nie mają ANI JEDNEGO statusu `success`;
    #  kończą się `in_progress > inactive`. Stanu `failure` Railway użył
    #  przez dwanaście dni JEDEN raz. A gdy CI jest czerwone, Railway
    #  (`checkSuites: true`) w ogóle nie tworzy wdrożenia, więc nie ma
    #  żadnego zdarzenia deployment_status — i nie ma czego pomijać.
    #  Zmierzone 22.09.2026 07:16 UTC: od ostatniego statusu `success`
    #  (21.09 10:40 UTC) minęło 20,6 godziny ciszy. Dokładnie tyle stała
    #  produkcja podczas awarii haka runnerów — a ten job nie miał jak
    #  krzyknąć, bo krzyczy wyłącznie PO udanym wdrożeniu.
    #  Wykrycie „nic się nie wdrożyło" wymaga wyzwalacza `schedule:`,
    #  niezależnego od wdrożeń. To osobna decyzja właściciela (koszt minut),
    #  a nie zmiana w tym warunku. Nie ruszaj `state == 'success'` w nadziei,
    #  że to załatwi — to zapłaci pięciokrotnie za to samo i dalej nie
    #  wykryje ciszy.
    # -----------------------------------------------------------------------
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ustal adres środowiska
        id: target
        run: |
          set -euo pipefail
          env_name='${{ github.event.deployment.environment }}'
          stan='${{ github.event.deployment_status.state }}'

          # DIAGNOSTYKA, nie ozdoba. To jest jedyne miejsce, w którym da się
          # zobaczyć, jak Railway naprawdę nazywa środowisko — dokumentacja
          # tego nie gwarantuje, a 249 pominiętych przebiegów to skutek
          # zgadywania.
          echo "=== Co przyszło w zdarzeniu deployment_status ==="
          echo "  deployment.environment  = '${env_name}'"
          echo "  deployment_status.state = '${stan}'"
          echo "================================================"

          # ZMIERZONE 10 WRZEŚNIA 2026, w logu przebiegu 34484294591:
          #
          #     deployment.environment = 'ideal-exploration / production'
          #
          # Railway NIE przysyła gołej nazwy środowiska. Przysyła
          # „<nazwa projektu> / <środowisko>". Poprzedni `case` dopasowywał
          # dokładne `production` i `staging`, więc każdy przebieg wpadał
          # w gałąź `*` i ustawiał `pomin=1`.
          #
          # To jest DRUGA połowa usterki „249 przebiegów, wszystkie skipped".
          # Pierwsza poprawka zdjęła warunek z poziomu joba, więc job zaczął
          # kończyć się jako `success` — ale sam KROK testu dymnego dalej był
          # pomijany. Efekt był gorszy niż przedtem: zielony job, który nie
          # sprawdza niczego. Pominięty job przynajmniej widać.
          #
          # Dlatego bierzemy człon po ostatnim ukośniku i obcinamy odstępy.
          # Świadomie NIE dopisujemy pełnej nazwy z projektem do `case`:
          # zmiana nazwy projektu w Railwayu nie ma prawa po cichu wyłączyć
          # testu dymnego, a dopasowanie na sam człon środowiska to przetrwa.
          srodowisko="${env_name##*/}"
          srodowisko="$(echo "$srodowisko" | tr -d '[:space:]')"

          echo "  środowisko po obcięciu    = '${srodowisko}'"

          case "$srodowisko" in
            production)
              echo "url=https://kuking.pl" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "url=https://staging.kuking.pl" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Środowisko '${env_name}' (człon: '${srodowisko}') nie jest ani production, ani staging."
              echo "Testu dymnego nie uruchamiam — nie wiem, pod jakim adresem go szukać."
              echo "JEŚLI TO NAZWA, KTÓRA POWINNA BYĆ OBSŁUGIWANA, dopisz ją w tym case."
              echo "pomin=1" >> "$GITHUB_OUTPUT"
              ;;
          esac

          echo "env=$srodowisko" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      #  Test dymny. Cel: wyłapać "deploy się udał, ale strona nie działa".
      #  Railway sprawdza tylko /health przy przełączaniu ruchu i NIE monitoruje
      #  go później. My sprawdzamy realne ścieżki użytkownika przez Cloudflare.
      #
      #  NAJPIERW: CZY POD ADRESEM DZIAŁA TEN COMMIT (issue #1012). Adres jest
      #  stały, a wynik zapisuje się przy commicie ze zdarzenia. Runner potrafi
      #  ruszyć kilka minut po zdarzeniu (zmierzone: prawie siedem), więc przy
      #  dwóch szybkich wdrożeniach test zdarzenia A sprawdzałby wydanie B
      #  i świecił na zielono przy A. `concurrency` porządkuje joby, ale nie
      #  przywraca pod adresem starszej wersji. Dlatego sonda czeka (z limitem),
      #  aż `/wydanie` poda pełny SHA zdarzenia, a przy niezgodności kończy
      #  job porażką z oczekiwanym i otrzymanym SHA — reszty nie sprawdza, bo
      #  sprawdzałaby cudze wydanie. Na końcu pyta jeszcze raz: wydanie mogło
      #  się zmienić W TRAKCIE testu. Logika: scripts/sonda-wdrozenia.sh.
      # -----------------------------------------------------------------------
      - name: Test dymny
        id: dymny
        if: steps.target.outputs.pomin != '1'
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          # Dla `deployment_status` to jest commit PRZEZNACZONY do wdrożenia.
          OCZEKIWANY_SHA: ${{ github.event.deployment.sha }}
        run: |
          set -euo pipefail
          source scripts/sonda-wdrozenia.sh
          fail=0

          echo "oczekiwany=${OCZEKIWANY_SHA}" >> "$GITHUB_OUTPUT"
          echo "=== Które wydanie działa pod ${BASE_URL} ==="
          if ! sonda_wydanie "$BASE_URL" "$OCZEKIWANY_SHA"; then
            echo "::error title=Pod adresem działa inne wydanie::Oczekiwano ${OCZEKIWANY_SHA}, otrzymano ${SONDA_OTRZYMANY:-nic}. Test dymny nie sprawdza cudzego wydania."
            exit 1
          fi

          check() {
            local path="$1" expected="$2" label="$3"
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                     --max-time 20 --retry 3 --retry-delay 5 --retry-all-errors \
                     "${BASE_URL}${path}" || echo "000")
            if [ "$code" = "$expected" ]; then
              printf 'OK    %-28s %s (%s)\n' "$path" "$code" "$label"
            else
              printf 'BLAD  %-28s %s, oczekiwano %s (%s)\n' "$path" "$code" "$expected" "$label"
              fail=1
            fi
          }

          echo "=== Test dymny: ${BASE_URL} ==="
          check /health          200 "healthcheck aplikacji i bazy"
          check /                200 "strona główna"
          check /login           200 "formularz logowania"
          check /robots.txt      200 "robots"
          check /nie-ma-takiej-strony-$(date +%s) 404 "obsługa 404"

          # HTTPS musi być wymuszony na krawędzi Cloudflare — i to NA TEN HOST.
          # Stało tu `case 301|302|307|308`: przekierowanie na `http://`, na
          # obcy host albo bez `Location` też dawało OK (issue #1332). Sonda
          # porównuje cel z `https://<host>/`, jak ręczny kontrakt runbooka.
          echo "--- Przekierowanie HTTP -> HTTPS ---"
          sonda_https "${BASE_URL#https://}" || fail=1

          # APP_DEBUG=true na produkcji ujawnia zmienne środowiskowe
          # (czyli sekrety) na stronie błędu. To najgorszy możliwy błąd
          # konfiguracji, więc sprawdzamy go wprost.
          # UWAGA na konstrukcję: bez potoku, świadomie.
          #
          # Wersja `curl ... | grep -qiE ...` przy `set -o pipefail` ZAWODZIŁA
          # OTWARCIE. Gdy strona NAPRAWDĘ wycieka, grep trafia i kończy się od
          # razu, curl dostaje SIGPIPE i wychodzi z niezerowym kodem, pipefail
          # przenosi to na cały potok, `if` wpada w `else` i wypisuje
          # „nie ujawnia szczegółów". Czyli kontrola meldowała BEZPIECZNIE
          # dokładnie w sytuacji, w której jest niebezpiecznie.
          #
          # Dodatkowo: nieudany curl nie jest dowodem, że debug jest wyłączony.
          # Wcześniej też wpadał w gałąź „OK". Teraz jest to błąd.
          echo "--- Kontrola trybu debug ---"
          strona=$(curl -sS --max-time 20 \
                     "${BASE_URL}/nie-ma-takiej-strony-$(date +%s)") && kod=0 || kod=$?

          if [ "$kod" -ne 0 ]; then
            echo "BLAD  nie udało się pobrać strony błędu (curl $kod)"
            echo "      to NIE jest potwierdzenie, że APP_DEBUG jest wyłączony"
            fail=1
          elif grep -qiE 'ignition|whoops|APP_KEY|vendor/laravel/framework' <<< "$strona"; then
            echo "BLAD  strona błędu ujawnia szczegóły — sprawdź APP_DEBUG=false!"
            fail=1
          else
            echo "OK    strona błędu nie ujawnia szczegółów"
          fi


          # Potwierdzenie portu w HTML i faktycznie serwowanym arkuszu.
          # Sam HTTP 200 nie wykrywa pozostawienia starego wyglądu.
          echo "--- Wersja interfejsu i zasoby marki ---"
          html_marki=$(curl -fsS --max-time 30 --retry 3 "${BASE_URL}/") || fail=1
          if [[ "${html_marki:-}" != *'data-marka="kuking-2026"'* ]]; then
            echo "BLAD  serwowany HTML nie zawiera nowej ramy marki"
            fail=1
          else
            echo "OK    HTML używa kuking-2026"
          fi
          css_marki=$(python3 -c 'import re,sys; from urllib.parse import urljoin; html=sys.stdin.read(); links=re.findall(r"<link\b[^>]*href=\"([^\"]+)\"[^>]*>",html); print(next((urljoin(sys.argv[1],x) for x in links if "/build/assets/app-" in x and x.endswith(".css")),""))' "$BASE_URL/" <<< "${html_marki:-}")
          if [ -z "$css_marki" ]; then
            echo "BLAD  brak adresu zbudowanego arkusza aplikacji"
            fail=1
          else
            arkusz_marki=$(curl -fsS --max-time 30 --retry 3 "$css_marki") || fail=1
            if [[ "${arkusz_marki:-}" == *".marka-topbar"* && "${arkusz_marki:-}" == *".marka-rama"* ]]; then
              echo "OK    serwowany CSS zawiera pływający nagłówek i nowy układ"
            else
              echo "BLAD  serwowany CSS nie zawiera portu marki"
              fail=1
            fi
          fi

          # Wydanie mogło zostać podmienione W TRAKCIE sprawdzeń — wtedy część
          # z nich opisuje cudzy commit. Stała tu JEDNA próba: chwilowe 502
          # brzegu albo zgubiony pakiet oblewały całe wdrożenie. Teraz 3 próby
          # co 5 s; każda nieudana mówi, która i dlaczego padła.
          echo "--- Wydanie po testach ---"
          sonda_wydanie_koncowa "$BASE_URL" "$OCZEKIWANY_SHA" || fail=1
          echo "potwierdzony=${SONDA_POTWIERDZONY}" >> "$GITHUB_OUTPUT"

          exit $fail

      # -----------------------------------------------------------------------
      #  Rejestracja wydania w Sentry — bez tego Sentry nie wie, który commit
      #  wprowadził błąd, i nie potrafi pokazać suspect commits.
      #  Krok nieblokujący: brak wpisu w Sentry to nie powód do alarmu.
      # -----------------------------------------------------------------------
      - name: Rejestracja wydania w Sentry
        # JEDEN `if`, DWA WARUNKI — I TO NIE JEST KOSMETYKA.
        # Stały tu dwa osobne klucze `if:` w jednym kroku. YAML w takiej
        # sytuacji nie protestuje (drugi cicho nadpisuje pierwszy), ale
        # GitHub Actions ODRZUCA CAŁY PLIK: każdy push tworzył przebieg
        # kończący się porażką bez ani jednego joba, a taka porażka
        # zatruwała check suite commita. Railway ma włączone „Wait for CI",
        # więc POMIJAŁ każdy deploy — produkcja stała cztery godziny na
        # starej wersji, przy zielonym CI i zielonych PR-ach.
        if: steps.target.outputs.pomin != '1' && vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT != ''
        continue-on-error: true
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        with:
          environment: ${{ steps.target.outputs.env }}
          version: ${{ github.sha }}

      # -----------------------------------------------------------------------
      #  POMINIĘTY TEST DYMNY MA BYĆ CZERWONY, NIE ZIELONY.
      #
      #  Zmierzone 10 września 2026: job kończył się jako `success`, mając
      #  krok testu dymnego `skipped`. To jest gorsze niż stary stan „249
      #  przebiegów skipped": pominięty JOB widać na liście, a zielony job
      #  z pominiętym KROKIEM wygląda dokładnie jak przeprowadzony test.
      #  Audyt infrastruktury wymaga dowodu „job = SUCCESS, nie skipped" —
      #  a taki job spełniał kryterium formalnie, nie sprawdzając niczego.
      #
      #  Warunek jest zawężony do wdrożeń, które SIĘ UDAŁY. Zdarzenie
      #  o nieudanym deployu nie ma czego dymnie testować i nie ma powodu
      #  świecić na czerwono.
      # -----------------------------------------------------------------------
      - name: Pominięty test dymny to nieprzejście, nie sukces
        if: >-
          steps.target.outputs.pomin == '1' &&
          github.event.deployment_status.state == 'success'
        run: |
          echo "::error title=Test dymny nie został uruchomiony::Wdrożenie zakończyło się sukcesem, ale nie ustaliliśmy adresu środowiska '${{ steps.target.outputs.env }}', więc żadna ścieżka użytkownika nie została sprawdzona. To NIE jest zielony deploy — patrz krok „Ustal adres środowiska" po nazwę, która przyszła w zdarzeniu."
          exit 1

      - name: Podsumowanie
        if: always()
        run: |
          # `steps.<id>.outcome` mówi, co się z krokiem STAŁO (`success`,
          # `failure`, `skipped`), a `job.status` mówi tylko, czy job jako
          # całość przeszedł. Stało tu `job.status`, więc podsumowanie
          # pisało „success" nad pominiętym testem.
          {
            echo "## Deploy: ${{ steps.target.outputs.env }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Adres | ${{ steps.target.outputs.url || 'NIE USTALONO' }} |"
            echo "| Commit oczekiwany (zdarzenie) | \`${{ steps.dymny.outputs.oczekiwany || github.event.deployment.sha }}\` |"
            echo "| Commit potwierdzony pod adresem | \`${{ steps.dymny.outputs.potwierdzony || 'NIE POTWIERDZONO' }}\` |"
            echo "| Test dymny | ${{ steps.dymny.outcome }} |"
            echo "| Job jako całość | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  #  B) OPERACJE NA ŻĄDANIE  (workflow_dispatch)
  # ===========================================================================
  #  Do użycia podczas incydentu albo przy migracji, którą trzeba puścić
  #  poza deployem. Wszystko przez Railway CLI z tokenem środowiskowym.
  # ===========================================================================
  operate:
    name: "Operacja: ${{ github.event.inputs.action }} (${{ github.event.inputs.environment }})"
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    # Dzięki temu produkcja może wymagać zatwierdzenia przez człowieka:
    # Settings → Environments → production → Required reviewers.
    # Zdecydowanie to włącz — inaczej jedno kliknięcie robi rollback produkcji.
    environment: ${{ github.event.inputs.environment }}

    # RAILWAY_TOKEN nie stoi tu, na poziomie joba (audyt B10-02): token
    # projektowy Railway trafiałby wtedy do KAŻDEGO kroku — także checkoutu,
    # konfiguracji Node i instalacji CLI z npm, które go nie potrzebują.
    # Im więcej kroków go widzi (zwłaszcza instalacja pakietu z npm), tym
    # większa powierzchnia na wyciek albo niepowołane użycie. Token dostają
    # WYŁĄCZNIE kroki, które faktycznie wołają `railway` — każdy ma własny
    # blok `env:` niżej z tą samą definicją (token projektowy jest przypisany
    # do KONKRETNEGO środowiska Railway, dlatego dwa osobne sekrety, a nie
    # jeden — to ogranicza szkody: token staginu nie tknie produkcji).
    env:
      TARGET_ENV: ${{ github.event.inputs.environment }}
      # Nazwa serwisu aplikacyjnego w Railway — JEDNO miejsce, nie trzy.
      #
      # Zmierzone connectorem 9 września 2026: projekt `ideal-exploration`
      # ma DWA serwisy, `Postgres` i `kuking.pl`. Serwisów `web`, `worker`
      # i `scheduler` NIE MA i nigdy nie było — `.railway/railway.ts`, który
      # je deklaruje, nie został zastosowany (`railway config apply` nie
      # uruchomiono ani razu). Kroki niżej odwoływały się do tych nazw, więc
      # migracja padała na nieistniejącym serwisie, a redeploy pomijał
      # wszystkie trzy po kolei i kończył się sukcesem, NIE ROBIĄC NICZEGO.
      #
      # Kontener chodzi w trybie `all`, czyli web, worker i harmonogram są
      # w tym jednym serwisie — redeploy jednej nazwy restartuje wszystko.
      #
      # Gdy kiedyś dojdzie do rozbicia na trzy serwisy, tę zmienną trzeba
      # zamienić na listę i wrócić do pętli.
      APP_SERVICE: kuking.pl

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Konfiguracja Node (dla Railway CLI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Instalacja Railway CLI
        # Wersja PRZYPIĘTA (audyt B10-02): `npm install -g @railway/cli` bez
        # numeru wersji instaluje cokolwiek jest akurat na `latest` w chwili
        # uruchomienia — bez locka, bez Dependabota, obok tokenu produkcji.
        # Przejęta albo zepsuta wersja pakietu wykonałaby się z RAILWAY_TOKEN
        # w środowisku kroku niżej.
        #
        # [do potwierdzenia] 5.62.1 to `npm view @railway/cli version` w dniu
        # tej zmiany (25.09.2026) — nie ma jej dotąd nigdzie w repo do przejęcia
        # 1:1. Podnoś ją świadomie, tak jak inne przypięte zależności.
        run: |
          npm install -g @railway/cli@5.62.1
          railway --version

      - name: Kontrola połączenia
        env:
          # Kotwica YAML (&railway_token): definicja tokenu stoi w JEDNYM
          # miejscu, a kroki Migracje/Redeploy/Instrukcja cofnięcia niżej
          # tylko się do niej odwołują (*railway_token) — bez czterech kopii
          # tego samego wyrażenia do zsynchronizowania ręcznie.
          RAILWAY_TOKEN: &railway_token ${{ github.event.inputs.environment == 'production'
            && secrets.RAILWAY_TOKEN_PRODUCTION
            || secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "BLAD: brak tokenu Railway dla środowiska ${TARGET_ENV}."
            echo "Dodaj sekret RAILWAY_TOKEN_$(echo "$TARGET_ENV" | tr '[:lower:]' '[:upper:]')."
            exit 1
          fi
          railway status || {
            echo "BLAD: nie udało się połączyć z projektem Railway."
            exit 1
          }

      # -----------------------------------------------------------------------
      #  MIGRACJE POZA DEPLOYEM
      #
      #  Normalnie migracje idą jako pre-deploy w railway.ts i NIE potrzebujesz
      #  tego kroku. Jest tu na dwie sytuacje:
      #    * długa migracja typu backfill, której nie chcesz trzymać w oknie
      #      deployu (pre-deploy blokuje wdrożenie na czas działania);
      #    * naprawa po nieudanym pre-deploy.
      #
      #  `railway ssh` wykonuje komendę WEWNĄTRZ działającego kontenera, więc
      #  migracja idzie prywatną siecią do bazy — nie musimy wystawiać
      #  Postgresa publicznie ani znać hasła.
      #  [do weryfikacji] składnia nieinteraktywnego `railway ssh <serwis> <komenda>`
      #  może się różnić między wersjami CLI — sprawdź `railway ssh --help`
      #  przy pierwszym użyciu.
      # -----------------------------------------------------------------------
      - name: Migracje
        if: github.event.inputs.action == 'migrate'
        env:
          RAILWAY_TOKEN: *railway_token
        run: |
          set -euo pipefail
          echo "=== Stan migracji PRZED ==="
          railway ssh --service "$APP_SERVICE" --environment "$TARGET_ENV" \
            "php artisan migrate:status"

          echo "=== Uruchamiam migracje ==="
          railway ssh --service "$APP_SERVICE" --environment "$TARGET_ENV" \
            "php artisan migrate --force --no-interaction"

          echo "=== Stan migracji PO ==="
          railway ssh --service "$APP_SERVICE" --environment "$TARGET_ENV" \
            "php artisan migrate:status"

      # -----------------------------------------------------------------------
      #  REDEPLOY — ponowne wdrożenie AKTUALNEJ wersji.
      #  Kiedy się przydaje: zmieniłeś zmienną środowiskową i chcesz, żeby
      #  weszła w życie (config:cache przebudowuje się w entrypoincie przy
      #  starcie kontenera, więc potrzebny jest restart).
      # -----------------------------------------------------------------------
      - name: Redeploy
        if: github.event.inputs.action == 'redeploy'
        env:
          RAILWAY_TOKEN: *railway_token
        run: |
          set -euo pipefail
          # Jeden serwis, bo produkcja ma jeden serwis aplikacyjny w trybie
          # `all` — restart pociąga za sobą web, workera i harmonogram.
          #
          # Nie ma tu `|| echo "pomijam"`. Poprzednia wersja przebiegała
          # pętlą po `web`, `worker` i `scheduler`, a każde niepowodzenie
          # zbywała ostrzeżeniem — więc gdy żaden z tych serwisów nie
          # istniał, krok kończył się ZIELONO, nie restartując niczego.
          # Redeploy, który nic nie robi i mówi, że się udał, jest gorszy
          # niż redeploy, który pada.
          echo "--- redeploy: $APP_SERVICE ---"
          railway redeploy --service "$APP_SERVICE" --environment "$TARGET_ENV" --yes

      # -----------------------------------------------------------------------
      #  INSTRUKCJA COFNIĘCIA — NIE ROLLBACK (issue #974)
      #
      #  Ta akcja nazywała się `rollback` i obiecywała „powrót do poprzedniego
      #  deployu", a kończyła się zielono, NIE COFAJĄC NICZEGO: wypisywała
      #  listę i odsyłała do panelu, test dymny był pomijany, a podsumowanie
      #  mówiło „success". Podczas incydentu taki wynik czyta się jako
      #  „produkcja przywrócona". Railway CLI nie potrafi wskrzesić wybranego
      #  starszego wdrożenia (`railway redeploy` powtarza BIEŻĄCE), a wyboru
      #  bezpiecznego celu nie wolno zgadywać przez zgodność migracji — więc
      #  akcja zostaje instrukcją, nazywa się jak instrukcja, wystawia
      #  ostrzeżenie i mówi w podsumowaniu wprost, że nic nie zmieniła.
      #  Procedura: docs/infra/DEPLOYMENT_RUNBOOK.md, KROK 14.
      #
      #  UWAGA — PRZECZYTAJ, ZANIM KLIKNIESZ:
      #  Rollback cofa KOD, ale NIE cofa MIGRACJI. Jeśli wdrożenie dodało
      #  kolumnę, stary kod zwykle da sobie z tym radę (ignoruje ją). Jeśli
      #  wdrożenie USUNĘŁO albo ZMIENIŁO NAZWĘ kolumny, rollback kodu wyprodukuje
      #  natychmiastowe błędy SQL — bo stary kod szuka czegoś, czego już nie ma.
      #
      #  Dlatego migracje MUSZĄ być backward-compatible (wzorzec
      #  expand → migrate → switch → contract z docs/DEPLOYMENT.md), a odzyskanie
      #  danych to osobna procedura — INFRA_DECISION.md, sekcja "Backupy i restore".
      #
      #  Rollback robi się w panelu Railway
      #  (Service → Deployments → poprzedni udany → ... → Redeploy).
      # -----------------------------------------------------------------------
      - name: Instrukcja cofnięcia (niczego nie cofa)
        if: github.event.inputs.action == 'instrukcja-cofniecia'
        env:
          RAILWAY_TOKEN: *railway_token
        run: |
          set -euo pipefail
          echo "=========================================================="
          echo " INSTRUKCJA COFNIĘCIA środowiska: ${TARGET_ENV}"
          echo " TEN KROK NICZEGO NIE COFA. Środowisko NIE zostało zmienione."
          echo "=========================================================="
          echo ""
          echo "Ostatnie deploye serwisu ${APP_SERVICE}:"
          railway deployment list --service "$APP_SERVICE" --environment "$TARGET_ENV" \
            || echo "(nie udało się pobrać listy — użyj panelu)"
          echo ""
          echo "PAMIĘTAJ: rollback cofa KOD, nie MIGRACJE."
          echo "Jeśli ostatni deploy zawierał migrację destrukcyjną"
          echo "(DROP COLUMN / RENAME), rollback kodu NIE naprawi bazy."
          echo ""
          echo "PRZED odtwarzaniem bazy sprawdź stan kopii i procedurę:"
          echo "  docs/infra/KOPIE_I_ODTWORZENIE.md, §3(b) 'Utracona cała baza'"
          echo "  docs/infra/KOPIE_I_ODTWORZENIE.md, §5.3 (co Railway realnie"
          echo "  oferuje na tym projekcie — sprawdź w panelu, nie zakładaj z góry)."
          echo "Jedyna POTWIERDZONA kopia offsite to zrzut z issue #193 —"
          echo "jesli jeszcze nie istnieje, utrata danych może być bezpowrotna"
          echo "(D-043)."
          echo ""
          echo "Wykonaj rollback w panelu Railway:"
          echo "  Service $APP_SERVICE → Deployments → poprzedni udany → ... → Redeploy"
          echo ""
          echo "Krok celowo NIE wykonuje rollbacku automatycznie —"
          echo "wymaga świadomej decyzji człowieka o stanie bazy."
          echo "Procedura: docs/infra/DEPLOYMENT_RUNBOOK.md, KROK 14."
          echo "::warning title=Nic nie zostało cofnięte::Akcja instrukcja-cofniecia wypisała tylko instrukcję. Środowisko ${TARGET_ENV} NIE zostało zmienione — rollback wykonaj w panelu Railway i sprawdź go testem dymnym (action: smoke)."

      # -----------------------------------------------------------------------
      #  Test dymny po każdej operacji zmieniającej stan.
      # -----------------------------------------------------------------------
      - name: Test dymny po operacji
        if: github.event.inputs.action != 'instrukcja-cofniecia'
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = "production" ]; then
            base="https://kuking.pl"
          else
            base="https://staging.kuking.pl"
          fi
          echo "=== Test dymny: $base ==="
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                   --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors \
                   "$base/health" || echo "000")
          if [ "$code" = "200" ]; then
            echo "OK    /health => 200"
          else
            echo "BLAD  /health => $code"
            exit 1
          fi

      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "## Operacja: ${{ github.event.inputs.action }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Środowisko | ${{ github.event.inputs.environment }} |"
            echo "| Uruchomił | @${{ github.actor }} |"
            echo "| Wynik | ${{ job.status }} |"
            if [ "${{ github.event.inputs.action }}" = "instrukcja-cofniecia" ]; then
              echo ""
              echo "**Nic nie zostało cofnięte — środowisko NIE zostało zmienione.** Ta akcja wypisuje tylko instrukcję; rollback wykonuje się w panelu Railway (docs/infra/DEPLOYMENT_RUNBOOK.md, KROK 14)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
