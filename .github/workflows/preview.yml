# ---------------------------------------------------------------------------
#  UWAGA: repozytorium jest PRYWATNE, więc minuta GitHub Actions jest płatna
#  wtedy, gdy przebieg idzie na runnery GitHuba.
#
#  Kontrolę robimy lokalnie, za darmo:  ./scripts/check.sh
#  Instalacja hooka pre-push:           ./scripts/install-hooks.sh
#
#  TEN WORKFLOW CHODZI SAM i nie ma tu czego odkomentowywać: blok `on:` niżej
#  jest aktywny i ma `pull_request` (opened, synchronize, reopened) obok
#  ręcznego `workflow_dispatch`. Zmierzone 12.09.2026 parserem YAML.
#
#  GDZIE TO CHODZI: rozstrzyga ZMIENNA REPOZYTORIUM `CI_RUNS_ON` (D-121).
#  Każdy job tego pliku ma dokładnie to samo, co joby `ci.yml`:
#
#      runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
#
#  Bez tej zmiennej joby idą na `ubuntu-latest` — zapas w runnerach GitHuba
#  JEST i jest wartością domyślną. Żeby trafiły na nową pulę
#  `woogitsu-linux-01`–`woogitsu-linux-10`, właściciel ustawia w Settings →
#  Secrets and variables → Actions → Variables:
#
#      CI_RUNS_ON = ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#
#  Wartość jest TABLICĄ JSON, bo `fromJSON` dostaje ją w całości; pojedyncza
#  etykieta to `"self-hosted"` z cudzysłowami, nie `self-hosted`.
#
#  Komplet etykiet, a nie nazwa runnera: nazwa przypina job do JEDNEJ maszyny,
#  więc jej awaria zatrzymuje całe CI. `i5-10400f` i `nvidia-gtx1070` ma
#  wyłącznie nowa pula — stare rejestracje WSL-owe (w pomiarach
#  `kuking-wsl-DOM-NEW-01`–`-03`) noszą tylko `self-hosted`, `Linux`, `X64`,
#  `wsl2`, `woogitsu`, więc samo `self-hosted` wpuszcza joby także na nie.
#
#  STAN ZMIERZONY 11.09.2026 (D-121, przebieg CI nr 661): zmienna stoi na SAMYM
#  `self-hosted`, więc przebiegi lądują na starej puli WSL. WŁAŚCICIEL ZOSTAWIA
#  TO TAK ŚWIADOMIE — decyzja z 12.09.2026; to nie jest przeoczenie i nie szukaj
#  tu usterki. Przyjęty koszt, dokładna wartość do przełączenia puli, skutek
#  skasowania zmiennej i sygnał, po którym decyzję odwracamy:
#  docs/infra/SELF_HOSTED_RUNNER.md → „Krok 1" → „Decyzja właściciela
#  z 12 września 2026". Porównanie opcji: docs/infra/CI_BEZ_ACTIONS.md
# ---------------------------------------------------------------------------

# =============================================================================
#  Kuking.pl — środowiska preview dla pull requestów
#  Docelowa lokalizacja: .github/workflows/preview.yml
# =============================================================================
#
#  PRZECZYTAJ NAJPIERW: TEN PLIK JEST OPCJONALNY
#  ---------------------------------------------
#  Railway ma NATYWNE środowiska PR. Włączasz je jednym przełącznikiem
#  (Project Settings → Environments → Enable PR Environments) i wtedy:
#
#     otwarcie PR    → Railway tworzy kompletne środowisko (web + postgres),
#                      nadaje domenę *.up.railway.app i komentuje URL w PR
#     merge/zamknięcie → Railway USUWA całe środowisko, koniec kosztów
#
#  Nie trzeba do tego ANI JEDNEJ linii GitHub Actions. Zdecydowanie użyj
#  tej drogi — mniej ruchomych części i nie trzeba trzymać tokenu Railway
#  z uprawnieniami do tworzenia środowisk.
#  https://docs.railway.com/guides/preview-deployments-with-pr-environments
#
#  CO ROBI TEN PLIK
#  ----------------
#  Dwie rzeczy, których natywne środowiska PR nie robią same:
#
#   1. `smoke` — testuje dymnie gotowe środowisko preview i komentuje wynik
#      w PR. Przydatne, bo Railway mówi "wdrożone", ale nie "działa".
#
#   2. `manual-*` — RĘCZNA ścieżka tworzenia/usuwania środowiska przez CLI,
#      wzorowana na dokumentacji Railway. Do użycia w jednym przypadku:
#      gdy natywne środowiska PR nie zadziałają, bo PR pochodzi z forka
#      od osoby spoza workspace'u — Railway wtedy celowo NIE tworzy
#      środowiska (zabezpieczenie: obcy kod nie dostaje Twoich sekretów).
#      Domyślnie WYŁĄCZONE (uruchamiane tylko z workflow_dispatch).
#
#  OSTRZEŻENIE O KOSZTACH: każde środowisko preview to działający kontener
#  i osobna baza. Przy railway.ts mają włączony Serverless (usypianie), więc
#  nieużywany preview kosztuje groszowo — ale 20 zapomnianych otwartych PR-ów
#  to już realna kwota. Zamykaj PR-y.
# =============================================================================

# ---------------------------------------------------------------------------
#  RUNNERY: TYMCZASOWO `ubuntu-latest`, NIE WŁASNA PULA — decyzja właściciela
#  z 8 września 2026, wieczorem. To samo, co w `ci.yml`; pełne uzasadnienie
#  i sposób powrotu stoją tam oraz w D-028 (`docs/DECISIONS.md`).
#
#  W skrócie: trzy z sześciu runnerów są wyłączone, a joby stały w kolejce
#  godzinami. D-028 NIE JEST odwołana — zmieniła się sytuacja, nie strategia.
#
#  POWRÓT NIE WYMAGA JUŻ ZMIANY W KODZIE. `runs-on` czyta zmienną
#  repozytorium `CI_RUNS_ON`; bez niej stoi `ubuntu-latest`. Żeby wrócić
#  na własną pulę, ustaw ją w Settings → Secrets and variables → Actions
#  → Variables na:
#      ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#  Skasowanie zmiennej wraca na runnery GitHuba. Pełne uzasadnienie: D-028.
# ---------------------------------------------------------------------------

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Numer PR-a"
        required: true
        type: string
      action:
        description: "create = utwórz środowisko, delete = usuń"
        required: true
        type: choice
        options: [create, delete]
        default: create

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  #  1. Test dymny natywnego środowiska preview
  # ===========================================================================
  smoke:
    name: Test dymny preview
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    # Bramka wdrożeniowa: dopóki nie ma środowisk Railway ani sekretów
    # (D-011 odkłada deploy, issue #3), ten job nie ma dokąd strzelać
    # i padał na KAŻDYM Pull Requeście. Stała czerwona lampka uczy ludzi,
    # że czerwone CI się ignoruje — to gorsze niż brak testu dymnego.
    #
    # Pominięty job nie zużywa minut. Włączenie: ustaw zmienną repozytorium
    # KUKING_DEPLOY_ENABLED na `true` (Settings → Secrets and variables →
    # Actions → Variables) razem z zamknięciem #3.
    if: >-
      vars.KUKING_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      # -----------------------------------------------------------------------
      #  Railway raportuje gotowe środowisko przez Deployments API GitHuba.
      #  Odpytujemy je, aż pojawi się URL dla tego PR-a. Nie da się tego
      #  zrobić prościej: nie wiemy z góry, jaką domenę Railway wylosuje.
      # -----------------------------------------------------------------------
      - name: Poczekaj na adres środowiska preview
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          url=""
          # 40 prób co 15 s = 10 minut. Build obrazu PHP + npm zajmuje
          # typowo 3-6 minut, więc to zapas z marginesem.
          for i in $(seq 1 40); do
            url=$(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=20" \
                    --jq '[.[] | select(.environment | test("^pr-|preview"))][0].payload.web_url // empty' \
                    2>/dev/null || true)

            if [ -z "$url" ]; then
              url=$(gh api "repos/${REPO}/deployments?sha=${SHA}&per_page=20" \
                      --jq '[.[] | select(.environment | test("^pr-|preview"))][0].environment_url // empty' \
                      2>/dev/null || true)
            fi

            if [ -n "$url" ]; then
              echo "Znaleziono adres: $url"
              break
            fi
            echo "Próba $i/40 — środowisko preview jeszcze nie gotowe, czekam 15 s..."
            sleep 15
          done

          if [ -z "$url" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nie znaleziono środowiska preview. Sprawdź, czy PR Environments są włączone w Railway."
          else
            echo "found=true"    >> "$GITHUB_OUTPUT"
            echo "url=${url%/}"  >> "$GITHUB_OUTPUT"
          fi

      - name: Test dymny
        id: smoke
        if: steps.wait.outputs.found == 'true'
        env:
          BASE_URL: ${{ steps.wait.outputs.url }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local path="$1" expected="$2"
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
                     --max-time 30 --retry 5 --retry-delay 10 --retry-all-errors \
                     "${BASE_URL}${path}" || echo "000")
            if [ "$code" = "$expected" ]; then
              printf 'OK    %-20s %s\n' "$path" "$code"
            else
              printf 'BLAD  %-20s %s, oczekiwano %s\n' "$path" "$code" "$expected"
              fail=1
            fi
          }

          echo "=== Preview: ${BASE_URL} ==="
          # Pierwszy request budzi uśpiony serwis (Serverless jest włączony
          # na preview), dlatego --retry powyżej jest istotne.
          check /health 200
          check /        200
          exit $fail

      - name: Komentarz w PR
        if: always() && steps.wait.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.wait.outputs.url }}
          RESULT: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          if [ "$RESULT" = "success" ]; then
            icon="[OK]"; verdict="Środowisko preview odpowiada poprawnie."
          else
            icon="[BLAD]"; verdict="Środowisko preview NIE odpowiada poprawnie — sprawdź logi."
          fi

          body=$(printf '%s **Preview: %s**\n\n%s\n\n| Sprawdzenie | |\n|---|---|\n| `/health` | aplikacja + baza |\n| `/` | strona główna |\n\n_Pierwsze wejście może potrwać kilka sekund — środowiska preview mają włączone usypianie (Serverless)._\n' \
            "$icon" "$URL" "$verdict")

          # Nadpisujemy poprzedni komentarz bota zamiast zaśmiecać PR
          # kolejnym przy każdym pushu.
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" \
                       --jq '[.[] | select(.body | startswith("[OK] **Preview:") or startswith("[BLAD] **Preview:"))][0].id // empty')

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
            echo "Zaktualizowano komentarz $existing"
          else
            gh api -X POST "repos/${REPO}/issues/${PR}/comments" -f body="$body" >/dev/null
            echo "Dodano nowy komentarz"
          fi

  # ===========================================================================
  #  2. RĘCZNE tworzenie środowiska preview  (droga awaryjna)
  # ===========================================================================
  #  Wzorowane na https://docs.railway.com/guides/github-actions-pr-environment
  #  Używaj TYLKO dla PR-ów z forków, dla których Railway nie utworzy
  #  środowiska automatycznie.
  #
  #  UWAGA BEZPIECZEŃSTWA: uruchamiając to dla obcego forka, świadomie
  #  wpuszczasz niezweryfikowany kod do środowiska z kopią zmiennych
  #  środowiska bazowego. Dlatego środowiskiem bazowym PR-ów MUSI być
  #  `staging` z własnymi, nieprodukcyjnymi sekretami — nigdy `production`.
  #
  #  `APP_KEY` staginu jest `Sealed`, więc `--copy staging` go NIE przenosi.
  #  Nowe `pr-N` startuje z pustym kluczem i dostaje losowy klucz kontenera
  #  z docker/klucz-preview.sh (#975). Tu nic nie dopisujemy i niczego nie
  #  odpieczętowujemy — klucz nie przechodzi przez ten job ani jego logi.
  # ===========================================================================
  manual-create:
    name: "Preview: utwórz (ręcznie)"
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'create'
    environment: staging

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

    steps:
      - name: Konfiguracja Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Instalacja Railway CLI
        run: npm install -g @railway/cli

      - name: Utwórz środowisko dla PR
        run: |
          set -euo pipefail
          env_name="pr-${{ github.event.inputs.pr_number }}"
          echo "Tworzę środowisko: $env_name (kopia staginu)"
          railway environment new "$env_name" --copy staging
          echo "Gotowe. Adres znajdziesz w panelu Railway."

  manual-delete:
    name: "Preview: usuń (ręcznie)"
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'delete'
    environment: staging

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

    steps:
      - name: Konfiguracja Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Instalacja Railway CLI
        run: npm install -g @railway/cli

      - name: Usuń środowisko PR
        run: |
          set -euo pipefail
          env_name="pr-${{ github.event.inputs.pr_number }}"
          # Railway CLI zwraca kod 1 dla KAŻDEGO błędu: brak środowiska, wygasły
          # token, brak uprawnień, ratelimit, awaria sieci. Po samym kodzie
          # `delete` nie da się ich odróżnić, więc dawne `|| true` zamieniało
          # awarię tokenu w zielony job, a płatne środowisko dalej stało.
          # Dlatego najpierw PYTAMY O LISTĘ, a dopiero potem kasujemy.
          echo "Sprawdzam, czy środowisko istnieje: $env_name"
          # Porażka samej listy to błąd i job MUSI być czerwony — inaczej
          # odtwarzamy dokładnie ten sam problem piętro wyżej.
          envs_json="$(railway environment list --json)"
          env_names="$(jq -r '[.. | objects | select(has("name")) | .name] | .[]' <<< "$envs_json")"
          if grep -qxF "$env_name" <<< "$env_names"; then
            # Bez `|| true`: kod wyjścia CLI leci wprost do joba.
            railway environment delete "$env_name" --yes
            echo "Gotowe."
          else
            echo "Środowiska $env_name nie ma na liście — nie ma czego usuwać."
          fi
