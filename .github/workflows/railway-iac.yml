# ---------------------------------------------------------------------------
#  UWAGA: repozytorium jest PRYWATNE, więc minuta GitHub Actions jest płatna
#  wtedy, gdy przebieg idzie na runnery GitHuba.
#
#  Kontrolę robimy lokalnie, za darmo:  ./scripts/check.sh
#  Instalacja hooka pre-push:           ./scripts/install-hooks.sh
#
#  TEN WORKFLOW CHODZI SAM i nie ma tu czego odkomentowywać: blok `on:` niżej
#  jest aktywny i ma `pull_request` (opened, synchronize, reopened) na
#  ścieżkach `.railway/**` i na tym pliku — to uruchamia PLAN. `apply` od
#  24.09.2026 (#595) idzie WYŁĄCZNIE ręcznie, przez `workflow_dispatch`
#  (Actions → Railway IaC → Run workflow), nie po scaleniu PR-a.
#
#  GDZIE TO CHODZI: rozstrzyga ZMIENNA REPOZYTORIUM `CI_RUNS_ON` (D-121).
#  Każdy job tego pliku ma dokładnie to samo, co joby `ci.yml`:
#
#      runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
#
#  Bez tej zmiennej joby idą na `ubuntu-latest` — zapas w runnerach GitHuba
#  JEST i jest wartością domyślną. Żeby trafiły na nową pulę
#  `woogitsu-linux-01`–`woogitsu-linux-10`, właściciel ustawia w Settings →
#  Secrets and variables → Actions → Variables:
#
#      CI_RUNS_ON = ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#
#  Wartość jest TABLICĄ JSON, bo `fromJSON` dostaje ją w całości; pojedyncza
#  etykieta to `"self-hosted"` z cudzysłowami, nie `self-hosted`.
#
#  Komplet etykiet, a nie nazwa runnera: nazwa przypina job do JEDNEJ maszyny,
#  więc jej awaria zatrzymuje całe CI. `i5-10400f` i `nvidia-gtx1070` ma
#  wyłącznie nowa pula — stare rejestracje WSL-owe (w pomiarach
#  `kuking-wsl-DOM-NEW-01`–`-03`) noszą tylko `self-hosted`, `Linux`, `X64`,
#  `wsl2`, `woogitsu`, więc samo `self-hosted` wpuszcza joby także na nie.
#
#  STAN ZMIERZONY 11.09.2026 (D-121, przebieg CI nr 661): zmienna stoi na SAMYM
#  `self-hosted`, więc przebiegi lądują na starej puli WSL. WŁAŚCICIEL ZOSTAWIA
#  TO TAK ŚWIADOMIE — decyzja z 12.09.2026; to nie jest przeoczenie i nie szukaj
#  tu usterki. Przyjęty koszt, dokładna wartość do przełączenia puli, skutek
#  skasowania zmiennej i sygnał, po którym decyzję odwracamy:
#  docs/infra/SELF_HOSTED_RUNNER.md → „Krok 1" → „Decyzja właściciela
#  z 12 września 2026". Porównanie opcji: docs/infra/CI_BEZ_ACTIONS.md
# ---------------------------------------------------------------------------

# =============================================================================
#  Kuking.pl — Infrastructure as Code: plan na PR, apply RĘCZNIE
#  Docelowa lokalizacja: .github/workflows/railway-iac.yml
# =============================================================================
#  Traktujemy infrastrukturę jak kod: zmiana w .railway/railway.ts przechodzi
#  przez PR, a w PR-ze widać PLAN — czyli co dokładnie zmieni się w Railway.
#
#  DLACZEGO APPLY NIE IDZIE JUŻ PO MERGE'U (24.09.2026, #595)
#  Do tej pory scalenie KAŻDEGO PR-a dotykającego `.railway/**` stosowało
#  plik na produkcji z `confirm-destructive: true`. Pierwszy taki apply to
#  rozbicie produkcji na trzy serwisy (#595) — operacja, którą właściciel ma
#  przeprowadzić świadomie, w wybranym oknie, po przeczytaniu planu i po
#  stagingu (docs/infra/PRZELACZENIE_NA_3_SERWISY_595.md). Przy apply po
#  merge'u przełączenie działoby się w chwili scalenia dowolnej poprawki
#  komentarza w railway.ts, także w nocy, a zmiany destrukcyjne (usunięcie
#  serwisu, bazy, zmiennej) przechodziłyby bez pytania. Teraz:
#    * PR → job `plan` (bez zmian: tylko odczyt, komentarz z planem);
#    * właściciel → Run workflow na `main`, z wpisanym potwierdzeniem;
#    * zmiany destrukcyjne tylko po zaznaczeniu osobnego pola (domyślnie NIE).
#
#  To nie jest kosmetyka. Bez tego łatwo przez literówkę w railway.ts usunąć
#  serwis albo odmontować volume, i dowiedzieć się o tym po fakcie.
#
#  Uwaga (sprostowanie 24.09.2026): job `apply` NIE dostaje pliku planu
#  z PR-a — akcja liczy plan od nowa w chwili uruchomienia. Dlatego plan
#  do przeczytania przed Run workflow to plan z tej samej chwili: lokalny
#  `railway config plan` albo świeży komentarz joba `plan` na PR-ze, bez
#  zmian w panelu pomiędzy.
#
#  Używamy oficjalnej akcji railwayapp/config@v1, która owija
#  `railway config plan/apply` i komentuje plan w PR.
#  https://github.com/railwayapp/config
#  https://docs.railway.com/cli/config
#
#  WYMAGANE SEKRETY:
#    RAILWAY_TOKEN_PRODUCTION — token projektowy środowiska production
# =============================================================================

# ---------------------------------------------------------------------------
#  RUNNERY: TYMCZASOWO `ubuntu-latest`, NIE WŁASNA PULA — decyzja właściciela
#  z 8 września 2026, wieczorem. To samo, co w `ci.yml`; pełne uzasadnienie
#  i sposób powrotu stoją tam oraz w D-028 (`docs/DECISIONS.md`).
#
#  W skrócie: trzy z sześciu runnerów są wyłączone, a joby stały w kolejce
#  godzinami. D-028 NIE JEST odwołana — zmieniła się sytuacja, nie strategia.
#
#  POWRÓT NIE WYMAGA JUŻ ZMIANY W KODZIE. `runs-on` czyta zmienną
#  repozytorium `CI_RUNS_ON`; bez niej stoi `ubuntu-latest`. Żeby wrócić
#  na własną pulę, ustaw ją w Settings → Secrets and variables → Actions
#  → Variables na:
#      ["self-hosted","Linux","X64","woogitsu","i5-10400f","nvidia-gtx1070"]
#  Skasowanie zmiennej wraca na runnery GitHuba. Pełne uzasadnienie: D-028.
# ---------------------------------------------------------------------------

name: Railway IaC

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # TYLKO PR-y kierowane do `main` (#1313). Filtr `branches` przy
    # `pull_request` dotyczy gałęzi DOCELOWEJ (base), nie gałęzi PR-a.
    # Bez niego PR z `.railway/**` do `staging` liczył plan z tokenem
    # produkcyjnym. `workflow_dispatch` niżej nie podlega temu filtrowi.
    # Staging nie ma tu żadnego joba — patrz „ŚRODOWISKO STAGING” na końcu.
    branches: [main]
    # Uruchamiaj tylko, gdy faktycznie zmienia się infrastruktura.
    # Zmiana kontrolera nie ma powodu odpalać planu Railway.
    paths:
      - ".railway/**"
      - ".github/workflows/railway-iac.yml"
  # Jedyna droga do `apply` (#595). Uruchamiaj z gałęzi `main`.
  workflow_dispatch:
    inputs:
      potwierdzenie:
        description: "Wpisz dokładnie: STOSUJE PLAN PRODUKCJI (po przeczytaniu planu)"
        required: true
        type: string
      zmiany_destrukcyjne:
        description: "Zezwól na usunięcie serwisu, bazy albo zmiennej. Przy #595 NIE zaznaczaj."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write # komentarz z planem w PR
  actions: read # odczyt artefaktu z planem

concurrency:
  group: railway-iac-production
  cancel-in-progress: false

jobs:
  # ===========================================================================
  #  PLAN — na każdą zmianę w otwartym PR
  # ===========================================================================
  plan:
    name: Plan (production)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15

    # Warunek `head.repo.full_name == github.repository` blokuje uruchomienie
    # dla PR-ów z forków. Bez tego obcy fork dostałby dostęp do tokenu Railway.
    # Bramka wdrożeniowa — patrz komentarz przy `apply` niżej.
    #
    # `base.ref == 'main'` powtarza filtr `branches` z bloku `on:` (#1313):
    # token produkcyjny dostaje wyłącznie PR do `main`. Drugi zamek jest
    # celowy — filtr gałęzi łatwo zgubić przy przeróbce `on:`.
    if: >-
      vars.KUKING_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # SDK `railway` musi być zainstalowane, żeby runner mógł wykonać
      # .railway/railway.ts (plik importuje "railway/iac").
      - name: Konfiguracja Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Instalacja zależności
        run: npm ci --no-audit --no-fund

      - name: Plan zmian infrastruktury
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        # railway.ts czyta KUKING_WAIT_FOR_CI z procesu (`checkSuites`).
        # Bez niej plan WYŁĄCZA „Wait for CI” na serwisach — patrz
        # docs/infra/PRZELACZENIE_NA_3_SERWISY_595.md, krok 0. Zmienna
        # repozytorium, nie sekret; puste = dzisiejsze `false`.
        env:
          KUKING_WAIT_FOR_CI: ${{ vars.KUKING_WAIT_FOR_CI }}
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          # Wynik ląduje jako komentarz w PR i jako przypięty artefakt,
          # który zużyje job `apply` po merge'u.
          comment: true

  # ===========================================================================
  #  APPLY — wyłącznie ręcznie (workflow_dispatch na `main`), patrz nagłówek
  # ===========================================================================
  apply:
    name: Apply (production)
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20

    # Bramka wdrożeniowa: bez projektu Railway i sekretu RAILWAY_TOKEN_PRODUCTION
    # ten workflow pada na każdym Pull Requeście (D-011 odkłada deploy, #3).
    # Pominięty job nie zużywa minut i nie zapala czerwonej lampki, której
    # i tak nie da się naprawić kodem.
    #
    # Włączenie: zmienna repozytorium KUKING_DEPLOY_ENABLED = `true`,
    # razem z zamknięciem #3.
    #
    # Potwierdzenie wpisane słowami, a nie sam przycisk: „Run workflow” klika
    # się jednym ruchem, także przez pomyłkę na złej gałęzi.
    if: >-
      vars.KUKING_DEPLOY_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.potwierdzenie == 'STOSUJE PLAN PRODUKCJI'

    # Wymuś zatwierdzenie przez człowieka:
    # Settings → Environments → production → Required reviewers.
    environment: production

    steps:
      # `main` w chwili uruchomienia — to, co faktycznie na nim jest.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Konfiguracja Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Instalacja zależności
        run: npm ci --no-audit --no-fund

      - name: Zastosowanie zmian
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        env:
          KUKING_WAIT_FOR_CI: ${{ vars.KUKING_WAIT_FOR_CI }}
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          # confirm-destructive: akcja domyślnie ma to na `true`, dlatego
          # stoi tu JAWNIE i domyślnie `false`: usunięcie serwisu, bazy
          # albo zmiennej zatrzymuje apply, zamiast przejść. Plan #595 po
          # zmianie nazw w railway.ts nie powinien niczego usuwać — jeśli
          # apply zatrzyma się na zmianie destrukcyjnej, przeczytaj plan,
          # zamiast zaznaczać pole (runbook, „Czytanie planu”).
          confirm-destructive: ${{ inputs.zmiany_destrukcyjne && 'true' || 'false' }}

      - name: Podsumowanie
        if: always()
        run: |
          {
            echo "## Railway IaC — apply"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Uruchomił | ${{ github.actor }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Zmiany destrukcyjne | ${{ inputs.zmiany_destrukcyjne }} |"
            echo "| Wynik | ${{ job.status }} |"
            echo ""
            echo "Zmiany w infrastrukturze NIE deployują kodu."
            echo "Kod wdraża Railway po pushu do \`main\` (patrz deploy.yml)."
          } >> "$GITHUB_STEP_SUMMARY"

# =============================================================================
#  ŚRODOWISKO STAGING
#  Celowo NIE mamy tu joba dla staginu. Powód: `railway config apply` działa
#  na środowisku, do którego przypisany jest token, a staging chcemy móc
#  psuć i naprawiać szybko, bez ceremoniału PR-owego. Dla staginu uruchamiaj
#  ręcznie z lokalnej maszyny:
#      railway link --environment staging
#      railway config plan
#      railway config apply
#  Gdy staging zacznie być krytyczny, NIE dopisuj jego jobów tutaj: ten plik
#  zna tylko `main` → production (#1313). Staging dostaje OSOBNY workflow
#  z `branches: [staging]`, własnym `environment: staging`, własnym tokenem
#  RAILWAY_TOKEN_STAGING i warunkiem `base.ref == 'staging'`.
# =============================================================================
