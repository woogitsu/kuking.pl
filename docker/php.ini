; =============================================================================
;  Kuking.pl — nadpisania php.ini dla produkcji
;  Montowane jako /usr/local/etc/php/conf.d/zz-kuking.ini (ładuje się ostatnie).
; =============================================================================

; -----------------------------------------------------------------------------
;  OPcache — najważniejsza pojedyncza optymalizacja w PHP.
;  Bez tego każdy request na nowo parsuje kilka tysięcy plików Laravela.
; -----------------------------------------------------------------------------
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; validate_timestamps=0 → OPcache nigdy nie sprawdza, czy plik się zmienił.
; Bezpieczne, bo kod jest immutable w obrazie: nowy deploy = nowy kontener.
; To daje kilka procent wydajności i eliminuje syscalle stat().
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

; JIT: dla typowej aplikacji webowej (I/O-bound: baza, HTTP) zysk jest znikomy,
; a ryzyko dziwnych błędów realne. Włączamy tylko tracing z małym buforem —
; albo zostaw off, jeśli zobaczysz cokolwiek podejrzanego.
opcache.jit=tracing
opcache.jit_buffer_size=64M

; -----------------------------------------------------------------------------
;  Pamięć i czas
; -----------------------------------------------------------------------------
; 256 MB wystarcza na przetworzenie zdjęcia 24 Mpx w gd.
;
; UWAGA SKŁADNIOWA: php.ini NIE obsługuje wartości domyślnych typu
; ${VAR:-fallback}. Podstawianie ${VAR} działa, ale gdy zmienna jest pusta,
; dyrektywa dostaje pustą wartość i PHP ją odrzuca. Dlatego trzymamy tu
; wartość na sztywno.
;
; Worker potrzebuje więcej pamięci niż web. Podnosi ją entrypoint flagą
; `php -d memory_limit=...` dla roli worker, sterowaną zmienną
; PHP_WORKER_MEMORY_LIMIT.
;
; TA DYREKTYWA NIE CHRONI PRZED PAMIĘCIĄ ZJADANĄ PRZEZ GD — i wcześniej stało
; tu coś przeciwnego („zobaczysz «Allowed memory size exhausted»
; w ProcessUploadedImage — podnieś TĘ zmienną"). Zmierzone przy zdjęciu 50 Mpx:
; licznik PHP 28 MB, RSS procesu 452 MB. libgd alokuje bitmapę poza licznikiem
; PHP, więc przy dekodowaniu dużego obrazu PHP nie zgłosi „Allowed memory size
; exhausted" w ogóle — proces po prostu zniknie, zabity przez OOM kontenera,
; nie zostawiając śladu NIGDZIE: ani wyjątku w dzienniku, ani dzwonka na
; kanale błędów. (Do 11 września stało tu „bez śladu w Sentry" — Sentry'ego
; nie ma, a zdanie sugerowało, że jest i że normalnie by to złapał.)
;
; Objaw, którego naprawdę szukać: worker znika bez wyjątku, a zdjęcia zostają
; w statusie `processing` (łapie to `ProcessUploadedImage::failed()`, issue #112).
; Leczy się to limitem `--memory` w entrypoincie i pamięcią kontenera
; (.railway/railway.ts), nie tą zmienną.
memory_limit=256M

max_execution_time=60
; Upload dużego zdjęcia przez LTE trwa. Ale UWAGA: docelowo pliki lecą
; PROSTO do R2 (presigned URL), więc te limity dotyczą tylko ścieżki awaryjnej.
max_input_time=120

; -----------------------------------------------------------------------------
;  Upload plików
;  Zdjęcia z telefonu to realnie 3-12 MB. 24 MB daje zapas na HEIC z iPhone'a.
;  Limit po stronie aplikacji (walidacja Laravel) MUSI być mniejszy niż tutaj.
; -----------------------------------------------------------------------------
upload_max_filesize=24M

; 112M, a nie 28M jak wcześniej. Wpis może mieć sześć zdjęć po 15 MB, czyli
; do 90 MB w jednym żądaniu — a przy 28M PHP odrzucał całe ciało żądania
; RAZEM Z TOKENEM CSRF, zanim Laravel zdążył cokolwiek zwalidować. Człowiek
; widział wtedy „Page Expired" i tracił wpisany tekst, bez śladu w logach.
;
; Zapas jest celowy: 90 MB to 80% tej wartości. `UploadLimitsAgreementTest`
; pilnuje, żeby budżet z `config/kuking.php` nie przekroczył 90% tej liczby —
; liczenie styk w styk oznaczałoby, że pierwsze dodatkowe pole w formularzu
; znowu wywala wysyłkę.
;
; Koszt: żądanie może buforować do 112 MB w pliku tymczasowym. FrankenPHP
; strumieniuje wysyłkę na dysk, więc nie jest to 112 MB pamięci.
post_max_size=112M
max_file_uploads=12

; -----------------------------------------------------------------------------
;  Błędy — do stderr, nigdy do przeglądarki.
;  Railway zbiera stderr, a nieobsłużony wyjątek dzwoni na kanał
;  `blad_webhook` (D-041). Sentry'ego w tym projekcie NIE MA — patrz
;  tabela stacku w AGENTS.md §3, wiersz „Monitoring".
; -----------------------------------------------------------------------------
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; Ślady wyjątków BEZ argumentów wywołań (#1357). Domyślnie PHP ma tu Off,
; a obraz FrankenPHP nie wgrywa php.ini-production, który to włącza. Przy Off
; ślad w logu pokazuje początek każdego argumentu — także kodu OAuth, tokenu
; Turnstile czy hasła. Nazwa funkcji, plik i linia zostają, więc ślad nadal
; mówi, gdzie szukać. Pilnuje tego tests/skrypty/php-ini-slady.sh.
zend.exception_ignore_args=On

; -----------------------------------------------------------------------------
;  Bezpieczeństwo
; -----------------------------------------------------------------------------
expose_php=Off
allow_url_fopen=On
allow_url_include=Off
; Wyłącz funkcje, których Laravel nie potrzebuje, a które są ulubionym
; narzędziem po udanym RCE.
disable_functions=exec,passthru,shell_exec,system,proc_open,popen

; Sesje trzymamy w Postgresie (SESSION_DRIVER=database), więc te ustawienia
; są tylko higieną na wypadek fallbacku na pliki.
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
session.use_strict_mode=1

; -----------------------------------------------------------------------------
;  Strefa czasowa i locale
;  UWAGA: w bazie i w aplikacji trzymamy UTC (APP_TIMEZONE=UTC), a na warstwie
;  prezentacji formatujemy do Europe/Warsaw. To standard i ratuje przed
;  koszmarem zmiany czasu.
; -----------------------------------------------------------------------------
date.timezone=UTC
intl.default_locale=pl_PL

; -----------------------------------------------------------------------------
;  Realpath cache — mniej syscalli stat() przy tysiącach plików Laravela.
; -----------------------------------------------------------------------------
realpath_cache_size=4096K
realpath_cache_ttl=600

; ---------------------------------------------------------------------------
; Krótkie znaczniki wyłączone JAWNIE, a nie „bo domyślnie".
;
; Obraz produkcyjny miał je WŁĄCZONE, maszyna deweloperska wyłączone —
; i przez tę jedną różnicę `/sitemap.xml` oddawał na żywo HTTP 500, mimo
; że ten sam kod lokalnie działał. Blade przepisuje `<?xml` do skompilowanego
; PHP-a bez zmian, a przy `short_open_tag = On` PHP czyta to jako kod.
;
; Ustawienie różniące środowiska jest gorsze niż złe ustawienie: złe psuje
; wszędzie tak samo i widać je od razu.
; ---------------------------------------------------------------------------
short_open_tag = Off
