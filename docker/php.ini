; =============================================================================
;  Kuking.pl — nadpisania php.ini dla produkcji
;  Montowane jako /usr/local/etc/php/conf.d/zz-kuking.ini (ładuje się ostatnie).
; =============================================================================

; -----------------------------------------------------------------------------
;  OPcache — najważniejsza pojedyncza optymalizacja w PHP.
;  Bez tego każdy request na nowo parsuje kilka tysięcy plików Laravela.
; -----------------------------------------------------------------------------
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000

; validate_timestamps=0 → OPcache nigdy nie sprawdza, czy plik się zmienił.
; Bezpieczne, bo kod jest immutable w obrazie: nowy deploy = nowy kontener.
; To daje kilka procent wydajności i eliminuje syscalle stat().
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.fast_shutdown=1

; JIT: dla typowej aplikacji webowej (I/O-bound: baza, HTTP) zysk jest znikomy,
; a ryzyko dziwnych błędów realne. Włączamy tylko tracing z małym buforem —
; albo zostaw off, jeśli zobaczysz cokolwiek podejrzanego.
opcache.jit=tracing
opcache.jit_buffer_size=64M

; -----------------------------------------------------------------------------
;  Pamięć i czas
; -----------------------------------------------------------------------------
; 256 MB wystarcza na przetworzenie zdjęcia 24 Mpx w gd.
;
; UWAGA SKŁADNIOWA: php.ini NIE obsługuje wartości domyślnych typu
; ${VAR:-fallback}. Podstawianie ${VAR} działa, ale gdy zmienna jest pusta,
; dyrektywa dostaje pustą wartość i PHP ją odrzuca. Dlatego trzymamy tu
; wartość na sztywno.
;
; Worker potrzebuje więcej pamięci niż web (dekodowanie zdjęć 24 Mpx).
; Podnosi ją entrypoint flagą `php -d memory_limit=...` dla roli worker,
; sterowaną zmienną PHP_WORKER_MEMORY_LIMIT. Jeśli w Sentry zobaczysz
; "Allowed memory size exhausted" w ProcessUploadedImage — podnieś TĘ zmienną
; w serwisie worker, nie ten plik.
memory_limit=256M

max_execution_time=60
; Upload dużego zdjęcia przez LTE trwa. Ale UWAGA: docelowo pliki lecą
; PROSTO do R2 (presigned URL), więc te limity dotyczą tylko ścieżki awaryjnej.
max_input_time=120

; -----------------------------------------------------------------------------
;  Upload plików
;  Zdjęcia z telefonu to realnie 3-12 MB. 24 MB daje zapas na HEIC z iPhone'a.
;  Limit po stronie aplikacji (walidacja Laravel) MUSI być mniejszy niż tutaj.
; -----------------------------------------------------------------------------
upload_max_filesize=24M
post_max_size=28M
max_file_uploads=12

; -----------------------------------------------------------------------------
;  Błędy — do stderr, nigdy do przeglądarki.
;  Railway zbiera stderr; Sentry łapie wyjątki przez SDK Laravela.
; -----------------------------------------------------------------------------
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; -----------------------------------------------------------------------------
;  Bezpieczeństwo
; -----------------------------------------------------------------------------
expose_php=Off
allow_url_fopen=On
allow_url_include=Off
; Wyłącz funkcje, których Laravel nie potrzebuje, a które są ulubionym
; narzędziem po udanym RCE.
disable_functions=exec,passthru,shell_exec,system,proc_open,popen

; Sesje trzymamy w Postgresie (SESSION_DRIVER=database), więc te ustawienia
; są tylko higieną na wypadek fallbacku na pliki.
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
session.use_strict_mode=1

; -----------------------------------------------------------------------------
;  Strefa czasowa i locale
;  UWAGA: w bazie i w aplikacji trzymamy UTC (APP_TIMEZONE=UTC), a na warstwie
;  prezentacji formatujemy do Europe/Warsaw. To standard i ratuje przed
;  koszmarem zmiany czasu.
; -----------------------------------------------------------------------------
date.timezone=UTC
intl.default_locale=pl_PL

; -----------------------------------------------------------------------------
;  Realpath cache — mniej syscalli stat() przy tysiącach plików Laravela.
; -----------------------------------------------------------------------------
realpath_cache_size=4096K
realpath_cache_ttl=600
