<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kuking.pl - poglądowe szkice konceptów maskotki
  ================================================
  Cel pliku: sprawdzić, czy koncept CZYTA SIĘ jako sylwetka, także w 32 px i w jednym kolorze.
  To nie jest grafika finalna - płaska geometria, brak gradientów, brak konturów zewnętrznych.

  Każdy kafel zawiera:
    - szkic 200x200 (podgląd roboczy),
    - test 32 px w kolorze,
    - test 32 px monochromatycznie (filtr saturate=0),
    - test 24 px w kolorze,
    - nazwę konceptu i ocenę sumaryczną z MASCOT_CONCEPT.md.

  Paleta:
    ink   #23201C   amber #C8781E   amber-dk #8F5310   złoto #E0A62B
    cegła #A8452F   zieleń #4E6B3C  krem  #F7F4EE      beż   #E6DCCB
    drewno #B07A42 / #C08A50 / #A86F38
  Złoto jest zarezerwowane WYŁĄCZNIE dla korony.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1220 830" width="1220" height="830" role="img"
     aria-label="Osiem szkiców konceptów maskotki Kuking z testami w małych rozmiarach">
  <title>Kuking - szkice konceptów maskotki</title>
  <desc>Garnuś, K-korona, Warzecha, Korona Kuking, Król Pieróg, Kuka, Majster Kuking oraz odrzucony kot Mruczek.</desc>

  <defs>
    <filter id="mono" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="linear" slope="0.75"/><feFuncG type="linear" slope="0.75"/><feFuncB type="linear" slope="0.75"/></feComponentTransfer>
    </filter>

    <!-- K1 GARNUŚ: garnek dwuuszny, korona zamiast pokrywki -->
    <g id="art-garnus">
      <rect x="26" y="112" width="24" height="13" rx="6.5" fill="#A8452F"/>
      <rect x="150" y="112" width="24" height="13" rx="6.5" fill="#A8452F"/>
      <rect x="48" y="100" width="104" height="68" rx="16" fill="#C8781E"/>
      <rect x="44" y="80" width="112" height="15" rx="5" fill="#E0A62B"/>
      <polygon points="52,80 66,50 80,80" fill="#E0A62B"/>
      <polygon points="86,80 100,42 114,80" fill="#E0A62B"/>
      <polygon points="120,80 134,50 148,80" fill="#E0A62B"/>
      <circle cx="66" cy="48" r="6" fill="#A8452F"/>
      <circle cx="100" cy="40" r="6" fill="#A8452F"/>
      <circle cx="134" cy="48" r="6" fill="#A8452F"/>
      <circle cx="80" cy="124" r="6" fill="#23201C"/>
      <circle cx="120" cy="124" r="6" fill="#23201C"/>
      <path d="M 84 143 Q 100 156 116 143" fill="none" stroke="#23201C" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- K7 K-KORONA: litera K obrócona, ramiona jako zęby korony -->
    <g id="art-kkorona">
      <polygon points="56,128 34,62 52,56 76,128" fill="#C8781E"/>
      <polygon points="124,128 148,56 166,62 144,128" fill="#C8781E"/>
      <polygon points="88,128 100,48 112,128" fill="#C8781E"/>
      <rect x="40" y="126" width="120" height="26" rx="9" fill="#C8781E"/>
      <circle cx="43" cy="59" r="8" fill="#E0A62B"/>
      <circle cx="100" cy="50" r="8" fill="#E0A62B"/>
      <circle cx="157" cy="59" r="8" fill="#E0A62B"/>
      <rect x="40" y="126" width="120" height="7" rx="3.5" fill="#E0A62B"/>
    </g>

    <!-- K3 WARZECHA: drewniana łyżka z koroną, szczerba na krawędzi czerpaka -->
    <g id="art-warzecha">
      <rect x="93" y="96" width="16" height="94" rx="8" fill="#B07A42"/>
      <ellipse cx="101" cy="86" rx="34" ry="27" fill="#C08A50"/>
      <ellipse cx="101" cy="90" rx="24" ry="18" fill="#A86F38"/>
      <circle cx="131" cy="76" r="8" fill="#F7F4EE"/>
      <rect x="80" y="44" width="42" height="10" rx="3" fill="#E0A62B"/>
      <polygon points="82,44 89,26 96,44" fill="#E0A62B"/>
      <polygon points="96,44 101,22 106,44" fill="#E0A62B"/>
      <polygon points="106,44 113,26 120,44" fill="#E0A62B"/>
      <circle cx="91" cy="88" r="5" fill="#23201C"/>
      <circle cx="111" cy="88" r="5" fill="#23201C"/>
    </g>

    <!-- K6 KORONA KUKING: sam znak, zęby korony jako smugi pary nad krawędzią naczynia -->
    <g id="art-korona">
      <path d="M 66 130 C 58 108 78 100 70 78" fill="none" stroke="#E0A62B" stroke-width="13" stroke-linecap="round"/>
      <path d="M 100 130 C 92 102 112 92 104 62" fill="none" stroke="#E0A62B" stroke-width="13" stroke-linecap="round"/>
      <path d="M 134 130 C 142 108 122 100 130 78" fill="none" stroke="#E0A62B" stroke-width="13" stroke-linecap="round"/>
      <rect x="44" y="130" width="112" height="24" rx="11" fill="#C8781E"/>
      <path d="M 34 166 Q 100 190 166 166" fill="none" stroke="#23201C" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- K5 KRÓL PIERÓG: pieróg z falbanką zlepienia, korona wtopiona w górny łuk -->
    <g id="art-pierog">
      <path d="M 40 148 A 60 60 0 0 1 160 148 Z" fill="#EFDFC0" stroke="#23201C" stroke-width="4"/>
      <path d="M 40 148 q 10 -15 20 0 q 10 -15 20 0 q 10 -15 20 0 q 10 -15 20 0 q 10 -15 20 0 q 10 -15 20 0"
            fill="none" stroke="#23201C" stroke-width="4" stroke-linejoin="round"/>
      <rect x="80" y="74" width="42" height="10" rx="3" fill="#E0A62B"/>
      <polygon points="82,74 89,56 96,74" fill="#E0A62B"/>
      <polygon points="96,74 101,52 106,74" fill="#E0A62B"/>
      <polygon points="106,74 113,56 120,74" fill="#E0A62B"/>
      <circle cx="86" cy="118" r="5.5" fill="#23201C"/>
      <circle cx="114" cy="118" r="5.5" fill="#23201C"/>
      <path d="M 88 134 Q 101 145 114 134" fill="none" stroke="#23201C" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- K2 KUKA: kura, grzebień zamieniony w koronę -->
    <g id="art-kuka">
      <polygon points="43,120 12,94 30,124 8,128 42,142" fill="#A8452F"/>
      <ellipse cx="95" cy="128" rx="52" ry="40" fill="#E6DCCB"/>
      <rect x="84" y="164" width="7" height="24" rx="3.5" fill="#C8781E"/>
      <rect x="108" y="164" width="7" height="24" rx="3.5" fill="#C8781E"/>
      <rect x="74" y="185" width="26" height="7" rx="3.5" fill="#C8781E"/>
      <rect x="100" y="185" width="26" height="7" rx="3.5" fill="#C8781E"/>
      <circle cx="132" cy="96" r="25" fill="#E6DCCB"/>
      <polygon points="155,95 178,102 155,110" fill="#C8781E"/>
      <rect x="113" y="68" width="40" height="9" rx="3" fill="#E0A62B"/>
      <polygon points="115,68 122,50 129,68" fill="#E0A62B"/>
      <polygon points="129,68 133,46 137,68" fill="#E0A62B"/>
      <polygon points="137,68 144,50 151,68" fill="#E0A62B"/>
      <circle cx="139" cy="91" r="5" fill="#23201C"/>
    </g>

    <!-- K4 MAJSTER KUKING: kucharz-król, czapka z opaską korony -->
    <g id="art-majster">
      <path d="M 46 200 L 46 174 Q 100 150 154 174 L 154 200 Z" fill="#F7F4EE" stroke="#23201C" stroke-width="3"/>
      <circle cx="100" cy="178" r="4" fill="#23201C"/>
      <circle cx="100" cy="192" r="4" fill="#23201C"/>
      <circle cx="100" cy="124" r="34" fill="#E6DCCB"/>
      <circle cx="88" cy="116" r="4.5" fill="#23201C"/>
      <circle cx="112" cy="116" r="4.5" fill="#23201C"/>
      <rect x="86" y="134" width="28" height="7" rx="3.5" fill="#23201C"/>
      <polygon points="76,54 86,30 96,54" fill="#E0A62B"/>
      <polygon points="112,54 122,30 132,54" fill="#E0A62B"/>
      <polygon points="93,50 104,22 115,50" fill="#E0A62B"/>
      <ellipse cx="100" cy="74" rx="40" ry="26" fill="#F7F4EE" stroke="#23201C" stroke-width="3"/>
      <rect x="62" y="86" width="76" height="14" rx="4" fill="#E0A62B"/>
    </g>

    <!-- ODRZUCONY: kot kuchenny w koronie (rysowany w szarościach = koncept odrzucony) -->
    <g id="art-mruczek">
      <polygon points="66,90 62,52 98,76" fill="#C9C6C0"/>
      <polygon points="134,90 138,52 102,76" fill="#C9C6C0"/>
      <circle cx="100" cy="120" r="42" fill="#C9C6C0"/>
      <rect x="78" y="50" width="44" height="9" rx="3" fill="#B9B4AA"/>
      <polygon points="80,50 87,34 94,50" fill="#B9B4AA"/>
      <polygon points="94,50 100,30 106,50" fill="#B9B4AA"/>
      <polygon points="106,50 113,34 120,50" fill="#B9B4AA"/>
      <circle cx="84" cy="114" r="6" fill="#6B6862"/>
      <circle cx="116" cy="114" r="6" fill="#6B6862"/>
      <polygon points="94,130 106,130 100,138" fill="#6B6862"/>
      <path d="M 60 122 L 84 128 M 60 136 L 84 134 M 140 122 L 116 128 M 140 136 L 116 134"
            fill="none" stroke="#6B6862" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1220" height="830" fill="#F7F7F5"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#23201C">
    <text x="20" y="32" font-size="24" font-weight="bold">KUKING — szkice konceptów maskotki</text>
    <text x="20" y="56" font-size="14" fill="#555">Kolejność według oceny sumarycznej. Przy każdym koncepcie test 32 px w kolorze, 32 px mono i 24 px.</text>
  </g>

  <!-- ================= RZĄD 1 ================= -->

  <!-- KAFEL 1: GARNUŚ -->
  <g>
    <rect x="20" y="76" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#E0A62B" stroke-width="3"/>
    <use x="0" y="0" transform="translate(60,84)" href="#art-garnus" xlink:href="#art-garnus"/>
    <g transform="translate(60,300) scale(0.16)"><use href="#art-garnus" xlink:href="#art-garnus"/></g>
    <g transform="translate(112,300) scale(0.16)" filter="url(#mono)"><use href="#art-garnus" xlink:href="#art-garnus"/></g>
    <g transform="translate(164,304) scale(0.12)"><use href="#art-garnus" xlink:href="#art-garnus"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="60" y="352" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="60" y="382" font-size="19" font-weight="bold" fill="#23201C">Garnuś · 23/25</text>
      <text x="60" y="404" font-size="13" fill="#555">garnek, korona zamiast pokrywki</text>
      <text x="60" y="420" font-size="12" font-weight="bold" fill="#8F5310">ZWYCIĘZCA</text>
    </g>
  </g>

  <!-- KAFEL 2: K-KORONA -->
  <g>
    <rect x="320" y="76" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
    <g transform="translate(360,84)"><use href="#art-kkorona" xlink:href="#art-kkorona"/></g>
    <g transform="translate(360,300) scale(0.16)"><use href="#art-kkorona" xlink:href="#art-kkorona"/></g>
    <g transform="translate(412,300) scale(0.16)" filter="url(#mono)"><use href="#art-kkorona" xlink:href="#art-kkorona"/></g>
    <g transform="translate(464,304) scale(0.12)"><use href="#art-kkorona" xlink:href="#art-kkorona"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="360" y="352" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="360" y="382" font-size="19" font-weight="bold" fill="#23201C">K-korona · 22/25</text>
      <text x="360" y="404" font-size="13" fill="#555">litera K obrócona = korona</text>
      <text x="360" y="420" font-size="12" font-weight="bold" fill="#4E6B3C">SYGNET DO LOGO (inna rola)</text>
    </g>
  </g>

  <!-- KAFEL 3: WARZECHA -->
  <g>
    <rect x="620" y="76" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#C8781E" stroke-width="2"/>
    <g transform="translate(660,84)"><use href="#art-warzecha" xlink:href="#art-warzecha"/></g>
    <g transform="translate(660,300) scale(0.16)"><use href="#art-warzecha" xlink:href="#art-warzecha"/></g>
    <g transform="translate(712,300) scale(0.16)" filter="url(#mono)"><use href="#art-warzecha" xlink:href="#art-warzecha"/></g>
    <g transform="translate(764,304) scale(0.12)"><use href="#art-warzecha" xlink:href="#art-warzecha"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="660" y="352" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="660" y="382" font-size="19" font-weight="bold" fill="#23201C">Warzecha · 21/25</text>
      <text x="660" y="404" font-size="13" fill="#555">drewniana łyżka z koroną</text>
      <text x="660" y="420" font-size="12" font-weight="bold" fill="#8F5310">ZAPASOWY — pionowa sylwetka</text>
    </g>
  </g>

  <!-- KAFEL 4: KORONA KUKING -->
  <g>
    <rect x="920" y="76" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
    <g transform="translate(960,84)"><use href="#art-korona" xlink:href="#art-korona"/></g>
    <g transform="translate(960,300) scale(0.16)"><use href="#art-korona" xlink:href="#art-korona"/></g>
    <g transform="translate(1012,300) scale(0.16)" filter="url(#mono)"><use href="#art-korona" xlink:href="#art-korona"/></g>
    <g transform="translate(1064,304) scale(0.12)"><use href="#art-korona" xlink:href="#art-korona"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="960" y="352" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="960" y="382" font-size="19" font-weight="bold" fill="#23201C">Korona Kuking · 21/25</text>
      <text x="960" y="404" font-size="13" fill="#555">znak bez postaci, zęby z pary</text>
      <text x="960" y="420" font-size="12" fill="#555">ścieżka „bez maskotki”</text>
    </g>
  </g>

  <!-- ================= RZĄD 2 ================= -->

  <!-- KAFEL 5: KRÓL PIERÓG -->
  <g>
    <rect x="20" y="446" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
    <g transform="translate(60,454)"><use href="#art-pierog" xlink:href="#art-pierog"/></g>
    <g transform="translate(60,670) scale(0.16)"><use href="#art-pierog" xlink:href="#art-pierog"/></g>
    <g transform="translate(112,670) scale(0.16)" filter="url(#mono)"><use href="#art-pierog" xlink:href="#art-pierog"/></g>
    <g transform="translate(164,674) scale(0.12)"><use href="#art-pierog" xlink:href="#art-pierog"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="60" y="722" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="60" y="752" font-size="19" font-weight="bold" fill="#23201C">Król Pieróg · 19/25</text>
      <text x="60" y="774" font-size="13" fill="#555">zawęża markę do jednej potrawy</text>
      <text x="60" y="790" font-size="12" fill="#555">postać kampanijna, nie stały znak</text>
    </g>
  </g>

  <!-- KAFEL 6: KUKA -->
  <g>
    <rect x="320" y="446" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
    <g transform="translate(360,454)"><use href="#art-kuka" xlink:href="#art-kuka"/></g>
    <g transform="translate(360,670) scale(0.16)"><use href="#art-kuka" xlink:href="#art-kuka"/></g>
    <g transform="translate(412,670) scale(0.16)" filter="url(#mono)"><use href="#art-kuka" xlink:href="#art-kuka"/></g>
    <g transform="translate(464,674) scale(0.12)"><use href="#art-kuka" xlink:href="#art-kuka"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="360" y="722" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="360" y="752" font-size="19" font-weight="bold" fill="#23201C">Kuka · 16/25</text>
      <text x="360" y="774" font-size="13" fill="#555">gra słów KU-KING / kurka</text>
      <text x="360" y="790" font-size="12" fill="#A8452F">ODRZUCONY — folk i cienkie detale</text>
    </g>
  </g>

  <!-- KAFEL 7: MAJSTER KUKING -->
  <g>
    <rect x="620" y="446" width="280" height="350" rx="12" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
    <g transform="translate(660,454)"><use href="#art-majster" xlink:href="#art-majster"/></g>
    <g transform="translate(660,670) scale(0.16)"><use href="#art-majster" xlink:href="#art-majster"/></g>
    <g transform="translate(712,670) scale(0.16)" filter="url(#mono)"><use href="#art-majster" xlink:href="#art-majster"/></g>
    <g transform="translate(764,674) scale(0.12)"><use href="#art-majster" xlink:href="#art-majster"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="660" y="722" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="660" y="752" font-size="19" font-weight="bold" fill="#23201C">Majster Kuking · 13/25</text>
      <text x="660" y="774" font-size="13" fill="#555">postać deklaruje płeć, wiek, karnację</text>
      <text x="660" y="790" font-size="12" fill="#A8452F">ODRZUCONY — najwyższe ryzyko</text>
    </g>
  </g>

  <!-- KAFEL 8: MRUCZEK (odrzucony) -->
  <g>
    <rect x="920" y="446" width="280" height="350" rx="12" fill="#F2F1EE" stroke="#DDD" stroke-width="2"/>
    <g transform="translate(960,454)"><use href="#art-mruczek" xlink:href="#art-mruczek"/></g>
    <g transform="translate(960,670) scale(0.16)"><use href="#art-mruczek" xlink:href="#art-mruczek"/></g>
    <g transform="translate(1012,670) scale(0.16)" filter="url(#mono)"><use href="#art-mruczek" xlink:href="#art-mruczek"/></g>
    <g transform="translate(1064,674) scale(0.12)"><use href="#art-mruczek" xlink:href="#art-mruczek"/></g>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="960" y="722" font-size="11" fill="#666">32 px · 32 px mono · 24 px</text>
      <text x="960" y="752" font-size="19" font-weight="bold" fill="#6B6862">Mruczek · 13/25</text>
      <text x="960" y="774" font-size="13" fill="#6B6862">kot na blacie = odruch higieniczny</text>
      <text x="960" y="790" font-size="12" fill="#A8452F">ODRZUCONY bez rozwijania</text>
    </g>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">
    <text x="20" y="820">Test 32 px: sylwetka musi być rozpoznawalna bez twarzy. Garnuś, K-korona i Korona Kuking przechodzą; Warzecha, Kuka i Pieróg gubią się; Majster staje się plamą.</text>
  </g>
</svg>
