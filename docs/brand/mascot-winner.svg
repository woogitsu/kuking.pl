<?xml version="1.0" encoding="UTF-8"?>
<!--
  ============================================================================
  KUKING.PL — GARNUŚ (koncept zwycięski)
  garnek dwuuszny, korona zamiast pokrywki
  ============================================================================

  ZAWARTOŚĆ PLIKU
    1. Podgląd 512 px (wariant pełny, z parą — do ilustracji i kafla PWA "any")
    2. Drabinka rozmiarów: 128 px, 64 px, 32 px, 32 px mono, 16 px
    3. Kafel PWA 192 px "maskable" ze strefą bezpieczną 80%
    4. Kafel PWA 192 px "any"
    5. Trzy stany emocjonalne robione PARĄ I PRZECHYŁEM, nie mimiką

  DWA WARIANTY GEOMETRII (świadoma decyzja, nie duplikat)
    #garnus-full    — do rozmiarów >= 64 px. Ma oczy, uśmiech, perły na czubkach korony,
                      cieńsze ucha (56x34 j.), węższą opaskę korony.
    #garnus-simple  — do rozmiarów <= 48 px (favicon, maskable, avatar 24 px).
                      Bez oczu, bez uśmiechu, bez perł. Ucha pogrubione do 68x42 j.
                      Opaska korony pogrubiona do 42 j. Zęby korony z szerszą podstawą.
    #garnus-mono    — #garnus-simple w jednym kolorze #23201C. Do faviconu mono,
                      pieczątki, sitodruku, haftu, druku jednokolorowego.

  ===========================================================================
  KONTROLA CZYTELNOŚCI W 32 px  (1 jednostka układu = 32/512 = 0,0625 px)
  ===========================================================================
  Wariant #garnus-simple przeliczony na 32 px:

    korpus garnka          288 x 184 j.  ->  18,0 x 11,5 px   CZYTELNY
    opaska korony          304 x  42 j.  ->  19,0 x  2,6 px   CZYTELNA
    ząb korony (szerokość)      ~88 j.   ->        5,5 px     CZYTELNY
    wcięcie między zębami        82 j.   ->        5,1 px      CZYTELNE (kluczowe)
    ucho garnka             68 x  42 j.  ->   4,3 x  2,6 px   CZYTELNE (na granicy)
    przerwa opaska/korpus         8 j.   ->        0,5 px     ZLEWA SIĘ — tak ma być

  WNIOSEK: w 32 px przerwa między koroną a garnkiem znika i powstaje JEDNA
  sylwetka "naczynie z trzema zębami u góry". To jest zamierzony odczyt i pełny
  komunikat marki — nie trzeba widzieć, że to osobna korona i osobny garnek.
  Nośnikiem rozpoznawalności są trzy wcięcia (5,1 px) i pozioma, krępa masa
  korpusu. Dlatego wariant faviconowy NIE MA oczu ani perł: przy 0,9 px
  zamieniają się w brud, który zamula wcięcia.

  W 16 px: korpus 9,0 px, wcięcia 2,5 px — nadal rozpoznawalne; ucha 2,1 px —
  na progu widoczności. Akceptowalne, bo w 16 px wystarcza odczyt "coś z zębami".

  ===========================================================================
  PWA / FAVICON — WYMAGANIA
  ===========================================================================
    favicon.svg           #garnus-simple, tło przezroczyste
    favicon.ico           32x32 i 16x16 z #garnus-simple na kremie #F7F4EE
    icon-192.png  "any"      #garnus-full na pełnym kremie, margines ~12%
    icon-512.png  "any"      jak wyżej
    icon-192-mask.png "maskable"  #garnus-simple, pomniejszony
    icon-512-mask.png "maskable"  strefa bezpieczna = KOŁO o średnicy 80%
                                  (dla 512 px: koło r=204,8 w środku kafla).
                                  Kwadrat 410x410 to zbyt optymistyczne
                                  uproszczenie — jego narożniki wypadają poza
                                  maskę okrągłą, która jest najagresywniejsza.
                                  Skala grafiki musi zmieścić PÓŁPRZEKĄTNĄ
                                  bboxa w promieniu koła, nie tylko szerokość.
    apple-touch-icon.png  180x180, bez przezroczystości

  NIE deklarować purpose="any maskable" na jednym pliku — to skrót, który psuje
  jedno z dwóch zastosowań.

  ===========================================================================
  PALETA
  ===========================================================================
    #23201C ciepła czerń    #C8781E amber (korpus)    #8F5310 amber ciemny (tekst)
    #E0A62B miodowe złoto — TYLKO KORONA             #A8452F cegła (ucha)
    #F7F4EE krem            #E6DCCB beż               #C9C2B4 para
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1120 900" width="1120" height="900" role="img"
     aria-label="Garnuś, maskotka Kuking: garnek z koroną zamiast pokrywki, w kilku rozmiarach i wariantach">
  <title>Kuking — Garnuś, koncept zwycięski</title>
  <desc>Dopracowany garnek z trójzębną koroną w miejscu pokrywki, pokazany w 512, 128, 64, 32 i 16 px, w wariancie monochromatycznym oraz jako kafle ikon PWA.</desc>

  <defs>
    <!-- WARIANT PEŁNY: >= 64 px -->
    <g id="garnus-full">
      <rect x="62" y="286" width="56" height="34" rx="17" fill="#A8452F"/>
      <rect x="394" y="286" width="56" height="34" rx="17" fill="#A8452F"/>
      <rect x="112" y="268" width="288" height="176" rx="40" fill="#C8781E"/>
      <rect x="104" y="222" width="304" height="36" rx="14" fill="#E0A62B"/>
      <polygon points="124,222 168,140 212,222" fill="#E0A62B"/>
      <polygon points="212,222 256,118 300,222" fill="#E0A62B"/>
      <polygon points="300,222 344,140 388,222" fill="#E0A62B"/>
      <circle cx="168" cy="136" r="15" fill="#A8452F"/>
      <circle cx="256" cy="114" r="15" fill="#A8452F"/>
      <circle cx="344" cy="136" r="15" fill="#A8452F"/>
      <circle cx="206" cy="330" r="15" fill="#23201C"/>
      <circle cx="306" cy="330" r="15" fill="#23201C"/>
      <path d="M 212 372 Q 256 404 300 372" fill="none" stroke="#23201C" stroke-width="16" stroke-linecap="round"/>
    </g>

    <!-- PARA: nakładka na wariant pełny, wyłącznie dla stanu "udało się" -->
    <g id="garnus-para">
      <path d="M 214 108 C 200 76 232 62 218 30" fill="none" stroke="#C9C2B4" stroke-width="14" stroke-linecap="round"/>
      <path d="M 298 108 C 312 76 280 62 294 30" fill="none" stroke="#C9C2B4" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- WARIANT UPROSZCZONY: <= 48 px. Bez oczu, bez perł, pogrubione ucha i opaska -->
    <g id="garnus-simple">
      <rect x="52" y="282" width="68" height="42" rx="21" fill="#A8452F"/>
      <rect x="392" y="282" width="68" height="42" rx="21" fill="#A8452F"/>
      <rect x="112" y="264" width="288" height="184" rx="40" fill="#C8781E"/>
      <rect x="104" y="214" width="304" height="42" rx="14" fill="#E0A62B"/>
      <polygon points="126,214 170,132 214,214" fill="#E0A62B"/>
      <polygon points="214,214 256,110 298,214" fill="#E0A62B"/>
      <polygon points="298,214 342,132 386,214" fill="#E0A62B"/>
    </g>

    <!-- WARIANT MONO: jeden kolor, do faviconu mono, pieczątki, haftu, sitodruku -->
    <g id="garnus-mono">
      <rect x="52" y="282" width="68" height="42" rx="21" fill="#23201C"/>
      <rect x="392" y="282" width="68" height="42" rx="21" fill="#23201C"/>
      <rect x="112" y="264" width="288" height="184" rx="40" fill="#23201C"/>
      <rect x="104" y="214" width="304" height="42" rx="14" fill="#23201C"/>
      <polygon points="126,214 170,132 214,214" fill="#23201C"/>
      <polygon points="214,214 256,110 298,214" fill="#23201C"/>
      <polygon points="298,214 342,132 386,214" fill="#23201C"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1120" height="900" fill="#F7F7F5"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#23201C">
    <text x="40" y="36" font-size="24" font-weight="bold">GARNUŚ — koncept zwycięski</text>
    <text x="40" y="60" font-size="14" fill="#555">Emocje robimy parą i przechyłem, nie mimiką. Wariant faviconowy nie ma oczu — przy 0,9 px zamieniają się w brud.</text>
  </g>

  <!-- ============ 1. PODGLĄD 512 px ============ -->
  <g transform="translate(40,110)">
    <use href="#garnus-para" xlink:href="#garnus-para"/>
    <use href="#garnus-full" xlink:href="#garnus-full"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="102" y="600" font-size="17" font-weight="bold" fill="#23201C">512 px — wariant pełny (z parą)</text>
    <text x="102" y="622" font-size="13" fill="#555">ilustracje, ikona PWA „any”, karta OG, materiały drukowane</text>
  </g>

  <!-- ============ 2. DRABINKA ROZMIARÓW ============ -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="100" font-size="13" font-weight="bold" fill="#8F5310">DRABINKA ROZMIARÓW — podglądy w rzeczywistej skali</text>
  </g>

  <g transform="translate(600,110) scale(0.25)"><use href="#garnus-full" xlink:href="#garnus-full"/></g>
  <text x="600" y="262" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">128 px · pełny</text>

  <g transform="translate(760,110) scale(0.125)"><use href="#garnus-full" xlink:href="#garnus-full"/></g>
  <text x="760" y="196" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">64 px · pełny</text>

  <g transform="translate(852,110) scale(0.0625)"><use href="#garnus-simple" xlink:href="#garnus-simple"/></g>
  <text x="852" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">32 px</text>
  <text x="852" y="176" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#777">uproszczony</text>

  <g transform="translate(916,110) scale(0.0625)"><use href="#garnus-mono" xlink:href="#garnus-mono"/></g>
  <text x="916" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">32 px</text>
  <text x="916" y="176" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#777">mono</text>

  <g transform="translate(980,110) scale(0.03125)"><use href="#garnus-simple" xlink:href="#garnus-simple"/></g>
  <text x="978" y="160" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">16 px</text>

  <!-- powiększenie kontrolne 32 px do 8x, żeby ocenić piksele -->
  <g transform="translate(600,300)">
    <rect x="0" y="0" width="192" height="192" rx="8" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
    <g transform="translate(-4,-12.8) scale(0.39)"><use href="#garnus-simple" xlink:href="#garnus-simple"/></g>
    <text x="0" y="216" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#23201C">32 px powiększone 6x</text>
    <text x="0" y="232" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555">trzy wcięcia = 5,1 px każde</text>
  </g>

  <!-- ============ 3. KAFEL PWA "maskable" ze strefą bezpieczną ============ -->
  <g>
    <rect x="820" y="300" width="192" height="192" fill="#F7F4EE"/>
    <g transform="translate(844.32,317.88) scale(0.28)"><use href="#garnus-simple" xlink:href="#garnus-simple"/></g>
    <rect x="839.2" y="319.2" width="153.6" height="153.6" fill="none" stroke="#C9C2B4" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="916" cy="396" r="76.8" fill="none" stroke="#A8452F" stroke-width="1.5" stroke-dasharray="5 4"/>
    <rect x="820" y="300" width="192" height="192" fill="none" stroke="#DDD" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="820" y="516" font-size="12" font-weight="bold" fill="#23201C">PWA 192 „maskable”</text>
      <text x="820" y="532" font-size="11" fill="#555">wiąże KOŁO o średnicy 80% (czerwone),</text>
      <text x="820" y="548" font-size="11" fill="#555">nie kwadrat 80% (szary) — narożniki</text>
      <text x="820" y="564" font-size="11" fill="#A8452F">kwadratu wychodzą poza maskę okrągłą</text>
    </g>
  </g>

  <!-- ============ 4. KAFEL PWA "any" ============ -->
  <g>
    <rect x="600" y="580" width="192" height="192" rx="24" fill="#F7F4EE"/>
    <g transform="translate(594.4,568.2) scale(0.397)"><use href="#garnus-full" xlink:href="#garnus-full"/></g>
    <rect x="600" y="580" width="192" height="192" rx="24" fill="none" stroke="#DDD" stroke-width="2"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="600" y="796" font-size="12" font-weight="bold" fill="#23201C">PWA 192 „any”</text>
      <text x="600" y="812" font-size="11" fill="#555">wariant pełny, tło pełne (nie przezroczyste)</text>
    </g>
  </g>

  <!-- ============ 5. STANY: para i przechył zamiast mimiki ============ -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="672" font-size="13" font-weight="bold" fill="#8F5310">STANY — bez rysowania nowej twarzy</text>
  </g>

  <g transform="translate(40,690) scale(0.22)"><use href="#garnus-full" xlink:href="#garnus-full"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="54" y="810" font-size="13" font-weight="bold" fill="#23201C">pusty stan</text>
    <text x="54" y="826" font-size="11" fill="#555">bez pary — jeszcze nic</text>
    <text x="54" y="842" font-size="11" fill="#555">się nie gotuje</text>
  </g>

  <g transform="translate(200,690) scale(0.22)">
    <use href="#garnus-para" xlink:href="#garnus-para"/>
    <use href="#garnus-full" xlink:href="#garnus-full"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="214" y="810" font-size="13" font-weight="bold" fill="#23201C">udało się</text>
    <text x="214" y="826" font-size="11" fill="#555">para w górę — po pierwszej</text>
    <text x="214" y="842" font-size="11" fill="#555">publikacji i „Ugotowałem”</text>
  </g>

  <g transform="translate(360,690) scale(0.22) rotate(-13,256,300)"><use href="#garnus-full" xlink:href="#garnus-full"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="374" y="810" font-size="13" font-weight="bold" fill="#23201C">błąd / 404</text>
    <text x="374" y="826" font-size="11" fill="#555">przechył 13°, bez pary —</text>
    <text x="374" y="842" font-size="11" fill="#555">nigdy przy błędzie pola</text>
  </g>

  <!-- ============ NOTY ============ -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555">
    <text x="820" y="600">ZAKAZY:</text>
    <text x="820" y="620">— złoto tylko na koronie, nigdzie indziej;</text>
    <text x="820" y="638">— żadnych rączek, nóżek ani gradientów;</text>
    <text x="820" y="656">— korpus zawsze szerszy niż wyższy;</text>
    <text x="820" y="674">— nigdy z orłem, tarczą ani na biało-czerwonym;</text>
    <text x="820" y="692">— maskotka nie mówi w pierwszej osobie;</text>
    <text x="820" y="710">— nie na ekranach, na których użytkownik pracuje.</text>
    <text x="820" y="742" fill="#8F5310">Kontrast: amber #C8781E do bieli ok. 3,4:1 —</text>
    <text x="820" y="758" fill="#8F5310">dopuszczalny dla grafiki, NIE dla tekstu.</text>
    <text x="820" y="774" fill="#8F5310">Do tekstu #8F5310 (ok. 5,8:1). [do weryfikacji]</text>
  </g>
</svg>
