<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodaj wpis — Kuking</title><link rel="stylesheet" href="assets/styles.css"></head>
<body>
<header class="top"><div class="wrap top-inner"><a class="logo" href="index.html">KUKING</a><a href="index.html">Anuluj</a></div></header>
<main class="wrap"><form class="card">
<h1>Dodaj, co ugotowałeś</h1>
<p>Nie musisz dodawać pełnego przepisu.</p>
<label for="image">Zdjęcie</label><input id="image" type="file" accept="image/*">
<p class="help">Zdjęcie z telefonu jest w porządku. Nie musi być profesjonalne.</p>
<label for="body">Napisz kilka słów</label><textarea id="body" placeholder="Np. Pierwszy raz robiłam dziś tę zupę i wyszła bardzo dobra."></textarea>
<label for="visibility">Kto może zobaczyć?</label><select id="visibility"><option>Wszyscy</option><option>Osoby, które mnie obserwują</option><option>Tylko ja</option></select>
<p class="help">Szkic jest zapisywany automatycznie.</p>
<div class="actions"><button class="btn primary" type="button">Opublikuj</button><button class="btn" type="button">Zapisz szkic</button></div>
</form></main>
</body></html>
