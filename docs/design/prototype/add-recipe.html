<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dodaj przepis — Kuking</title><link rel="stylesheet" href="assets/styles.css"></head>
<body>
<header class="top"><div class="wrap top-inner"><a class="logo" href="index.html">KUKING</a><a href="index.html">Zamknij</a></div></header>
<main class="wrap"><form class="card">
<p><strong>Krok 1 z 3 — O przepisie</strong></p>
<h1>Dodaj przepis</h1>
<label for="title">Nazwa przepisu</label><input id="title" value="Sernik babci Heleny">
<label for="photo">Zdjęcie</label><input id="photo" type="file" accept="image/*">
<label for="summary">Krótki opis</label><textarea id="summary">Rodzinny sernik, który pieczemy od lat.</textarea>
<label for="servings">Liczba porcji</label><input id="servings" type="number" value="8">
<label for="time">Łączny czas</label><input id="time" value="70 minut">
<p class="help">Szkic zapisany.</p>
<div class="actions"><button class="btn" type="button">Zapisz szkic</button><button class="btn primary" type="button">Dalej: składniki</button></div>
</form></main>
</body></html>
