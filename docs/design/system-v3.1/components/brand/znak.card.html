<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Znak i ikony</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:20px;background:var(--color-surface)}.demo{display:flex;flex-direction:column;gap:var(--spacing-5)}.tla{display:flex;flex-wrap:wrap;gap:var(--spacing-4)}.tlo{display:grid;place-items:center;width:72px;height:72px;border-radius:var(--radius-lg);border:1px solid var(--color-border)}.tlo svg{width:44px;height:44px}.t-jasne{background:var(--color-surface);color:var(--color-brand)}.t-karta{background:var(--color-surface-raised);color:var(--color-brand)}.t-marka{background:var(--color-brand-solid);color:var(--color-ink-inverse)}.ikony{display:flex;flex-wrap:wrap;gap:var(--spacing-4);color:var(--color-ink)}.ikony svg{width:28px;height:28px}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Icon, Wordmark, NAZWY_IKON } = window.KukingPlSystemProjektowy_a664d7;
function Demo() {
  return (
    <div className="demo">
      <div className="tla">
        <span className="tlo t-jasne"><Icon name="znak" label="Kuking" /></span>
        <span className="tlo t-karta"><Icon name="znak" label="Kuking" /></span>
        <span className="tlo t-marka"><Icon name="znak" label="Kuking" /></span>
        <span className="tlo blok-ciemny" style={{ color: "var(--color-brand)" }}><Icon name="znak" label="Kuking" /></span>
        <span style={{ display: "grid", placeItems: "center", padding: "0 var(--spacing-4)" }}><Wordmark /></span>
      </div>
      <div className="ikony">
        {NAZWY_IKON.filter((n) => n !== "znak").map((n) => <Icon key={n} name={n} label={n} />)}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
