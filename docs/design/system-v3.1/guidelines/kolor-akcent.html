<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Akcent</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.rzad{display:flex;flex-wrap:wrap;gap:12px}.pole{flex:1 1 0;min-width:0;border-radius:var(--radius-md);border:1px solid var(--color-border);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}.nazwa{font-size:13px;font-weight:700;line-height:1.3}.hex{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}.kontrast{font-size:12px;font-weight:600;opacity:.85}</style></head><body>
<div class="rzad"><div class="pole" style="background:var(--color-accent-tint);color:var(--color-accent-tint-ink)"><span class="nazwa">accent-tint / -ink</span><span class="hex">#FCEACB · #6B4E0C</span><span class="kontrast">plakietka „Ugotowano 12 razy”</span></div><div class="pole" style="background:var(--color-surface-raised);color:var(--color-accent)"><span class="nazwa">accent</span><span class="hex">#7A5C10</span><span class="kontrast">tekst akcentowy</span></div></div>
</body></html>
