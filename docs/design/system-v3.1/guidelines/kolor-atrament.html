<!-- @dsCard group="Kolor" viewport="700x140" name="Atrament i obwódki" subtitle="Hierarchia jest w rozmiarze i wadze, nie w kolorze" -->
<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Atrament</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.rzad{display:flex;flex-wrap:wrap;gap:12px}.pole{flex:1 1 0;min-width:0;border-radius:var(--radius-md);border:1px solid var(--color-border);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}.nazwa{font-size:13px;font-weight:700;line-height:1.3}.hex{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}.kontrast{font-size:12px;font-weight:600;opacity:.85}</style></head><body>
<div class="rzad"><div class="pole" style="background:var(--color-surface-raised);color:var(--color-ink)"><span class="nazwa">ink</span><span class="hex">#2B241D</span><span class="kontrast">tekst podstawowy · 15.4:1</span></div><div class="pole" style="background:var(--color-surface-raised);color:var(--color-ink-muted)"><span class="nazwa">ink-muted</span><span class="hex">#5C5347</span><span class="kontrast">metadane, pomoc · 7.6:1</span></div><div class="pole" style="background:var(--color-border-strong);color:var(--color-ink-inverse)"><span class="nazwa">border-strong</span><span class="hex">#8A7A63</span><span class="kontrast">obwódka pola · 3.51:1 wobec tła pola</span></div><div class="pole" style="background:var(--color-border);color:var(--color-ink)"><span class="nazwa">border</span><span class="hex">#E4DACB</span><span class="kontrast">podział dekoracyjny, bez progu</span></div></div>
</body></html>
