<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Fokus</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.rzad{display:flex;flex-wrap:wrap;gap:12px}.pole{flex:1 1 0;min-width:0;border-radius:var(--radius-md);border:1px solid var(--color-border);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}.nazwa{font-size:13px;font-weight:700;line-height:1.3}.hex{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}.kontrast{font-size:12px;font-weight:600;opacity:.85}.demo{display:flex;flex-wrap:wrap;gap:28px;align-items:center;padding:8px 0}.btn-demo{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:var(--radius-md);border:2px solid transparent;font-size:18px;font-weight:700;background:var(--color-brand-solid);color:#fff}.halo{box-shadow:0 0 0 2px var(--color-surface),0 0 0 5px var(--color-focus)}.bez-halo{box-shadow:0 0 0 3px var(--color-focus)}.etyk{font-size:13px;color:var(--color-ink-muted);display:block;margin-top:6px}</style></head><body>
