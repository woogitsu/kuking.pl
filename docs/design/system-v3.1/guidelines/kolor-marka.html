<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Marka</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.rzad{display:flex;flex-wrap:wrap;gap:12px}.pole{flex:1 1 0;min-width:0;border-radius:var(--radius-md);border:1px solid var(--color-border);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}.nazwa{font-size:13px;font-weight:700;line-height:1.3}.hex{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}.kontrast{font-size:12px;font-weight:600;opacity:.85}</style></head><body>
<div class="rzad"><div class="pole" style="background:var(--color-brand-solid);color:var(--color-ink-inverse)"><span class="nazwa">brand-solid</span><span class="hex">#B3401F</span><span class="kontrast">TŁO przycisku głównego</span></div><div class="pole" style="background:var(--color-brand-solid-hover);color:var(--color-ink-inverse)"><span class="nazwa">brand-solid-hover</span><span class="hex">#8C3018</span><span class="kontrast">najechanie</span></div><div class="pole" style="background:var(--color-surface-raised);color:var(--color-brand)"><span class="nazwa">brand</span><span class="hex">#B3401F</span><span class="kontrast">tekst, link, znak</span></div><div class="pole" style="background:var(--color-brand-tint);color:var(--color-brand-tint-ink)"><span class="nazwa">brand-tint / -ink</span><span class="hex">#F5E4DC · #8C3018</span><span class="kontrast">bieżąca pozycja · 6.67:1</span></div></div><p style="margin:12px 0 0;font-size:14px;color:var(--color-ink-muted)">Kolor tekstu i kolor tła to nigdy nie jest ten sam token — nawet gdy w jednym motywie mają tę samą wartość.</p>
</body></html>
