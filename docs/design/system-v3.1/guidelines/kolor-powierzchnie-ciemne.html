<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Powierzchnie ciemne</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.rzad{display:flex;flex-wrap:wrap;gap:12px}.pole{flex:1 1 0;min-width:0;border-radius:var(--radius-md);border:1px solid var(--color-border);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}.nazwa{font-size:13px;font-weight:700;line-height:1.3}.hex{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}.kontrast{font-size:12px;font-weight:600;opacity:.85}</style></head><body>
<div class="rzad blok-ciemny" style="padding:12px;border-radius:var(--radius-lg)"><div class="pole" style="background:var(--color-surface);color:var(--color-ink)"><span class="nazwa">surface</span><span class="hex">#1E1A16</span></div><div class="pole" style="background:var(--color-surface-raised);color:var(--color-ink)"><span class="nazwa">surface-raised</span><span class="hex">#2A241E</span></div><div class="pole" style="background:var(--color-surface-sunken);color:var(--color-ink)"><span class="nazwa">surface-sunken</span><span class="hex">#14110E</span></div><div class="pole" style="background:var(--color-surface-brand-wash);color:var(--color-ink)"><span class="nazwa">surface-brand-wash</span><span class="hex">#2E211A</span></div></div>
</body></html>
