<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Powierzchnie jasne</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.rzad{display:flex;flex-wrap:wrap;gap:12px}.pole{flex:1 1 0;min-width:0;border-radius:var(--radius-md);border:1px solid var(--color-border);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}.nazwa{font-size:13px;font-weight:700;line-height:1.3}.hex{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}.kontrast{font-size:12px;font-weight:600;opacity:.85}</style></head><body>
<div class="rzad"><div class="pole" style="background:var(--color-surface);color:var(--color-ink)"><span class="nazwa">surface</span><span class="hex">#FAF6F0</span><span class="kontrast">wszystko, co nie jest kartą</span></div><div class="pole" style="background:var(--color-surface-raised);color:var(--color-ink)"><span class="nazwa">surface-raised</span><span class="hex">#FFFFFF</span><span class="kontrast">karta, belka, stopka, szyna</span></div><div class="pole" style="background:var(--color-surface-sunken);color:var(--color-ink)"><span class="nazwa">surface-sunken</span><span class="hex">#F1EBE1</span><span class="kontrast">pole formularza, dane przepisu</span></div><div class="pole" style="background:var(--color-surface-brand-wash);color:var(--color-ink)"><span class="nazwa">surface-brand-wash</span><span class="hex">#F7E9E2</span><span class="kontrast">hero, „Skąd ten przepis”</span></div></div>
</body></html>
