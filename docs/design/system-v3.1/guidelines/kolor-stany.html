<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Stany</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.rzad{display:flex;flex-wrap:wrap;gap:12px}.pole{flex:1 1 0;min-width:0;border-radius:var(--radius-md);border:1px solid var(--color-border);padding:10px 12px;min-height:64px;display:flex;flex-direction:column;justify-content:flex-end}.nazwa{font-size:13px;font-weight:700;line-height:1.3}.hex{font-size:12px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}.kontrast{font-size:12px;font-weight:600;opacity:.85}</style></head><body>
<div class="rzad"><div class="pole" style="background:var(--color-danger-solid);color:var(--color-ink-inverse)"><span class="nazwa">danger-solid</span><span class="hex">#B3261E</span><span class="kontrast">tło przycisku „Usuń”</span></div><div class="pole" style="background:var(--color-danger-tint);color:var(--color-danger-tint-ink)"><span class="nazwa">danger-tint / -ink</span><span class="hex">#FBE2E0 · #8C1E17</span><span class="kontrast">komunikat błędu</span></div><div class="pole" style="background:var(--color-surface-raised);color:var(--color-success)"><span class="nazwa">success</span><span class="hex">#1E7B3E</span><span class="kontrast">obwódka komunikatu</span></div><div class="pole" style="background:var(--color-success-tint);color:var(--color-success-tint-ink)"><span class="nazwa">success-tint / -ink</span><span class="hex">#DFF3E4 · #155C2E</span><span class="kontrast">„Szkic zapisany.”</span></div></div>
</body></html>
