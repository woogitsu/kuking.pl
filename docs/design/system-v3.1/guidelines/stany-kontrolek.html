<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Stany kontrolek</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.et{font-size:12px;font-weight:700;color:var(--color-ink-muted)}.t{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.k{display:grid;justify-items:start;gap:6px}.b{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:var(--radius-md);border:2px solid transparent;font-size:18px;font-weight:800;line-height:1.2}.p{background:var(--color-brand-solid);color:var(--color-ink-inverse)}.p-hov{background:var(--color-brand-solid-hover)}.p-act{background:var(--color-brand-solid-hover);transform:translateY(1px)}.p-foc{background:var(--color-brand-solid);box-shadow:0 0 0 2px var(--color-surface),0 0 0 5px var(--color-focus)}.p-dis{background:var(--color-brand-solid);opacity:.55}.pod{font-size:13px;color:var(--color-ink-muted);line-height:1.35;max-width:16ch}</style></head><body>
<div class="t"><span class="k"><span class="et">spoczynek</span><span class="b p">Opublikuj</span></span><span class="k"><span class="et">najechanie</span><span class="b p p-hov">Opublikuj</span><span class="pod">tło o stopień ciemniejsze, nic się nie przesuwa</span></span><span class="k"><span class="et">wciśnięcie</span><span class="b p p-act">Opublikuj</span><span class="pod">1 px w dół, bez zmniejszania</span></span><span class="k"><span class="et">fokus</span><span class="b p p-foc">Opublikuj</span><span class="pod">pierścień 3 px z 2 px halo w kolorze tła</span></span><span class="k"><span class="et">wyłączony</span><span class="b p p-dis">Opublikuj</span><span class="pod">55% krycia i ZAWSZE zdanie, co zrobić</span></span></div>
</body></html>
