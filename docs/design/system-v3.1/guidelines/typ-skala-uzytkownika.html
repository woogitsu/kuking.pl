<!DOCTYPE html>
<html lang="pl"><head><meta charset="utf-8"><title>Skala użytkownika</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--color-surface);font-family:var(--font-sans);color:var(--color-ink)}.et{font-size:12px;font-weight:700;color:var(--color-ink-muted);font-variant-numeric:tabular-nums}.rzad{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}.pr{border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-raised);padding:10px 12px}.pr p{margin:0;font-weight:700}</style></head><body>
