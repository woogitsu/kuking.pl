<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kuking.pl</title>
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0}
.kafel{width:1280px;height:854px;display:flex;overflow:hidden}
.glowna{flex:1;background:#B3401F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;color:#FFFFFF}
.glowna svg{width:340px;height:340px}
.nazwa{font-family:var(--font-sans);font-size:112px;font-weight:800;letter-spacing:-0.02em;line-height:1;white-space:nowrap}
.pasek{width:320px;display:flex;flex-direction:column}
.pasek span{flex:1;display:block}
</style>
</head>
<body>
<div class="kafel">
  <div class="glowna">
    <svg viewBox="0 0 64 64" role="img" aria-label="Kuking">
      <mask id="w" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
        <rect x="0" y="0" width="64" height="64" fill="#FFFFFF"></rect>
        <path d="M24 43 C28 47 36 47 40 41" fill="none" stroke="#000000" stroke-width="3.5" stroke-linecap="round"></path>
        <path d="M18 28 C27 30 37 30 46 28" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round"></path>
      </mask>
      <g mask="url(#w)" fill="currentColor" stroke="currentColor">
        <path d="M18 22 L16 15 L24 19 L32 11 L40 19 L48 15 L46 22 C39 25 25 25 18 22 Z" stroke-width="2" stroke-linejoin="round"></path>
        <circle cx="16" cy="14" r="3.5" stroke="none"></circle>
        <circle cx="32" cy="9" r="3.5" stroke="none"></circle>
        <circle cx="48" cy="14" r="3.5" stroke="none"></circle>
        <path d="M17 29 H47 V38 C47 49 41 54 32 54 C23 54 17 49 17 38 Z" stroke="none"></path>
        <path d="M17 32 C12 29 9 31 9 36 C9 42 13 44 18 42" fill="none" stroke-width="5" stroke-linecap="round"></path>
        <path d="M47 32 C52 29 55 31 55 36 C55 42 51 44 46 42" fill="none" stroke-width="5" stroke-linecap="round"></path>
      </g>
    </svg>
    <div class="nazwa">KuKing.pl</div>
  </div>
  <div class="pasek">
    <span style="background:#FCEACB"></span>
    <span style="background:#E3B341"></span>
    <span style="background:#1E7B3E"></span>
    <span style="background:#1A130E"></span>
  </div>
</div>
</body>
</html>
