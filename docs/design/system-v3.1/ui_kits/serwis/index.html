<!-- @dsCard group="Serwis" viewport="1440x900" name="Serwis po zalogowaniu" subtitle="Jedenaście ekranów zalogowanego i gościa — klikalna makieta z przełącznikiem motywu i wielkości tekstu" -->
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuking.pl — serwis po zalogowaniu</title>
<link rel="icon" href="../../assets/logo/kuking-favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
body{margin:0;background:var(--color-surface)}
#root{min-height:100vh}
.podglad-ekranow{border-top:1px solid var(--color-border);background:var(--color-surface-sunken);padding:var(--spacing-5) var(--spacing-6) calc(var(--spacing-5) + var(--control-height-touch) + var(--spacing-8))}
.podglad-ekranow-wnetrze{max-width:var(--container-strona);margin-inline:auto}
@media (min-width:64rem){.podglad-ekranow{padding-bottom:var(--spacing-5)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="dane.jsx"></script>
<script type="text/babel" src="Tablica.jsx"></script>
<script type="text/babel" src="EkranPrzepisu.jsx"></script>
<script type="text/babel" src="DodajPrzepis.jsx"></script>
<script type="text/babel" src="Powiadomienia.jsx"></script>
<script type="text/babel" src="Wejscie.jsx"></script>
<script type="text/babel" src="Konto.jsx"></script>
<script type="text/babel">
const { TopBar, SideNav, BottomNav, SiteFooter, AppShell, Section, Button, Icon } = window.KukingPlSystemProjektowy_a664d7;

/* Ekran 03 — „Dodaj”. Rozstaje z dwiema drogami, obie z pełnym zdaniem
   wyjaśniającym, czym się różnią. Bez tego ludzie wybierają „przepis”,
   kiedy chcą tylko pokazać obiad. */
function DodajHub({ naglowek, nawigacja, stopka, onZdjecie, onPrzepis }) {
  return (
    <AppShell naglowek={naglowek} nawigacja={nawigacja} stopka={stopka} szyna={null}>
      <h1>Co chcesz dodać?</h1>
      <div className="choice-grid" style={{ marginTop: "var(--spacing-6)" }}>
        <button type="button" className="choice" onClick={onZdjecie} style={{ textAlign: "left", cursor: "pointer" }}>
          <span className="choice-naglowek">
            <Icon name="aparat" className="side-nav-ikona" />
            <span className="choice-label">Zdjęcie tego, co ugotowałem</span>
          </span>
          <span className="choice-help">
            Najkrótsza droga: zdjęcie i kilka słów. Nie musi być ładne — ma być prawdziwe.
          </span>
        </button>
        <button type="button" className="choice" onClick={onPrzepis} style={{ textAlign: "left", cursor: "pointer" }}>
          <span className="choice-naglowek">
            <Icon name="zeszyt" className="side-nav-ikona" />
            <span className="choice-label">Przepis, z którego ktoś ugotuje</span>
          </span>
          <span className="choice-help">
            Trzy kroki: nazwa i zdjęcie, składniki, wykonanie. Szkic zapisuje się przy każdym kroku.
          </span>
        </button>
      </div>
    </AppShell>
  );
}

const POZA_NAWIGACJA = [
  ["logowanie", "Logowanie"],
  ["rejestracja", "Rejestracja"],
  ["dodaj-zdjecie", "Dodaj zdjęcie"],
  ["dodaj-przepis", "Dodaj przepis"],
  ["przepis", "Przepis"],
  ["czytelnosc", "Czytelność"],
  ["konto", "Twoje konto"],
];

function PodgladEkranow({ biezacy, onWybierz }) {
  return (
    <div className="podglad-ekranow">
      <div className="podglad-ekranow-wnetrze">
        <p className="pomoc" style={{ marginBottom: "var(--spacing-3)" }}>
          Podgląd pozostałych ekranów — tego paska nie ma w serwisie.
        </p>
        <div className="rzad-przyciskow">
          {POZA_NAWIGACJA.map(([klucz, nazwa]) => (
            <Button key={klucz} waga={biezacy === klucz ? "secondary" : "quiet"}
              aria-pressed={biezacy === klucz ? "true" : "false"} onClick={() => onWybierz(klucz)}>
              {nazwa}
            </Button>
          ))}
        </div>
      </div>
    </div>
  );
}

function Serwis() {
  const [ekran, setEkran] = React.useState("start");
  const [motyw, setMotyw] = React.useState("jasny");

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", motyw === "ciemny" ? "dark" : "light");
  }, [motyw]);

  const naglowek = (
    <TopBar imie="Basia" avatarSrc={window.ZDJ + "avatar_user.png"}
      onSzukaj={(e) => { e.preventDefault(); setEkran("szukaj"); }} />
  );
  const nawigacja = (
    <>
      <SideNav biezaca={ekran} onPrzejdz={setEkran} />
      <BottomNav biezaca={ekran} onPrzejdz={setEkran} />
    </>
  );
  const stopka = <SiteFooter motyw={motyw} onMotyw={setMotyw} />;
  const wspolne = { naglowek, nawigacja, stopka };

  let widok;
  if (ekran === "logowanie") widok = <window.Logowanie stopka={stopka} onZaloguj={() => setEkran("start")} onRejestracja={() => setEkran("rejestracja")} />;
  else if (ekran === "rejestracja") widok = <window.Rejestracja stopka={stopka} onZaloguj={() => setEkran("logowanie")} />;
  else if (ekran === "dodaj") widok = <DodajHub {...wspolne} onZdjecie={() => setEkran("dodaj-zdjecie")} onPrzepis={() => setEkran("dodaj-przepis")} />;
  else if (ekran === "dodaj-zdjecie") widok = <window.DodajZdjecie {...wspolne} />;
  else if (ekran === "dodaj-przepis") widok = <window.DodajPrzepis {...wspolne} />;
  else if (ekran === "powiadomienia") widok = <window.Powiadomienia {...wspolne} />;
  else if (ekran === "zeszyt") widok = <window.Zeszyt {...wspolne} onPrzepis={() => setEkran("przepis")} />;
  else if (ekran === "moje") widok = <window.Profil {...wspolne} onPrzepis={() => setEkran("przepis")} />;
  else if (ekran === "szukaj") widok = <window.Szukaj {...wspolne} onPrzepis={() => setEkran("przepis")} />;
  else if (ekran === "czytelnosc") widok = <window.Czytelnosc {...wspolne} motyw={motyw} onMotyw={setMotyw} />;
  else if (ekran === "konto") widok = <window.Konto {...wspolne} />;
  else if (ekran === "przepis") widok = <window.EkranPrzepisu {...wspolne} />;
  else widok = <window.Tablica {...wspolne} onPrzepis={() => setEkran("przepis")} onDodaj={() => setEkran("dodaj-zdjecie")} />;

  return (
    <>
      {widok}
      <PodgladEkranow biezacy={ekran} onWybierz={setEkran} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Serwis />);
</script>
</body>
</html>
