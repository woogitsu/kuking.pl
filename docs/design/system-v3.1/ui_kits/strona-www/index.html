<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kuking.pl — strona publiczna</title>
<link rel="icon" href="../../assets/logo/kuking-favicon.svg">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--color-surface)}</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Powitalna.jsx"></script>
<script type="text/babel" src="OKuking.jsx"></script>
<script type="text/babel" src="PrzepisPubliczny.jsx"></script>
<script type="text/babel">
const { SiteFooter } = window.KukingPlSystemProjektowy_a664d7;

function StronaPubliczna() {
  const [strona, setStrona] = React.useState("powitalna");
  const [motyw, setMotyw] = React.useState("jasny");

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", motyw === "ciemny" ? "dark" : "light");
    window.scrollTo(0, 0);
  }, [motyw, strona]);

  const stopka = <SiteFooter className="stopka-www" motyw={motyw} onMotyw={setMotyw} />;
  const nawigacja = {
    onPowitalna: () => setStrona("powitalna"),
    onOnas: () => setStrona("o-kuking"),
    onPrzepis: () => setStrona("przepis"),
    stopka,
  };

  if (strona === "o-kuking") return <window.OKuking {...nawigacja} />;
  if (strona === "przepis") return <window.PrzepisPubliczny {...nawigacja} />;
  return <window.Powitalna {...nawigacja} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<StronaPubliczna />);
</script>
</body>
</html>
