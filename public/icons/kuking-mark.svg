<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kuking — znak „Uśmiech" (UI kit v2, decyzja właściciela).
  Garnek z koroną zamiast pokrywki: w słowie KuKing siedzi King.

  TEN PLIK JEST WERSJĄ SAMODZIELNĄ. Ładują go: favicon, service worker,
  <img> w pustych stanach i zastępcze zdjęcie w Media::url(). W każdym z tych
  miejsc SVG jest OSOBNYM dokumentem — nie widzi zmiennych CSS strony i nie
  dziedziczy `currentColor`. Dlatego kolory są tu wpisane wprost.
  (Pierwsza wersja tego pliku używała `currentColor` i renderowała się
  na czarno: w <img> `currentColor` to kolor SVG, a nie kolor strony.)

  Wersję dziedziczącą motyw — do belki u góry i wszędzie, gdzie znak ma
  przyjąć kolor otoczenia — daje komponent <x-kuking-mark />, który wkleja
  ten sam kształt wprost do HTML-a.

  Tryb ciemny działa mimo osobnego dokumentu: `prefers-color-scheme` jest
  preferencją systemu, więc dociera także tutaj. Favicon w ciemnym motywie
  bierze jaśniejszy odcień marki — ten sam, którego używa interfejs.

  viewBox 0 0 64 64 — kwadrat, żeby znak dał się użyć jako favicon i ikona PWA
  bez przeliczania. Wariant bez oczu i pereł jest jedynym czytelnym w 32 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Kuking" fill="none">
  <title>Kuking</title>

  <style>
    .znak { fill: #B3401F; stroke: #B3401F; }
    .polysk { stroke: #FFFFFF; }

    @media (prefers-color-scheme: dark) {
      /* Ten sam odcień, którego interfejs używa jako --color-brand w trybie
         ciemnym. Czerwień #B3401F na czarnym pasku przeglądarki znika. */
      .znak { fill: #F2986A; stroke: #F2986A; }
      .polysk { stroke: #2A241E; }
    }
  </style>

  <!-- Korona -->
  <path class="znak" d="M18 22 L16 15 L24 19 L32 11 L40 19 L48 15 L46 22 C39 25 25 25 18 22 Z"
        stroke-width="2" stroke-linejoin="round"/>
  <circle class="znak" cx="16" cy="14" r="3.5"/>
  <circle class="znak" cx="32" cy="9" r="3.5"/>
  <circle class="znak" cx="48" cy="14" r="3.5"/>

  <!-- Garnek -->
  <path class="znak" d="M17 29 H47 V38 C47 49 41 54 32 54 C23 54 17 49 17 38 Z" stroke="none"/>

  <!-- Uchwyty -->
  <path class="znak" d="M17 32 C12 29 9 31 9 36 C9 42 13 44 18 42" fill="none"
        stroke-width="5" stroke-linecap="round"/>
  <path class="znak" d="M47 32 C52 29 55 31 55 36 C55 42 51 44 46 42" fill="none"
        stroke-width="5" stroke-linecap="round"/>

  <!-- Uśmiech i połysk na krawędzi garnka -->
  <path class="polysk" d="M24 43 C28 47 36 47 40 41" stroke-width="3.5" stroke-linecap="round"/>
  <path class="polysk" d="M18 28 C27 30 37 30 46 28" stroke-width="3" stroke-linecap="round"/>
</svg>
