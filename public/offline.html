<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brak połączenia — Kuking</title>
<style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #F3F4F1;
        color: #151714;
        font: 1.125rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
        text-align: center;
    }
    main {
        width: 100%;
        max-width: 38rem;
        padding: clamp(20px, 5vw, 40px);
        background: #FFFFFF;
        border: 1px solid #DDE0D8;
        border-radius: 24px;
        overflow-wrap: anywhere;
        box-shadow: 0 8px 24px rgba(21, 23, 20, .05);
    }
    a:focus-visible { outline: 3px solid #155EEF; outline-offset: 4px; }
    a:hover { background: #9D241B; }
    @media (prefers-color-scheme: dark) {
        body { background: #151714; color: #F4F5F1; }
        main { background: #222620; border-color: #373D34; }
        a:focus-visible { outline-color: #6EA8FF; }
    }
    h1 { font-size: 1.75rem; line-height: 1.3; }
    p { max-width: 34rem; }
    a {
        display: inline-block;
        min-height: 48px;
        padding: 12px 20px;
        border-radius: 14px;
        background: #BE3025;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
    }
    a.drugi {
        background: transparent;
        color: inherit;
        border: 2px solid currentColor;
    }
    a.drugi:hover { background: transparent; text-decoration: underline; }
</style>
</head>
<body>
<main>
    <img src="/icons/kuking-mark.svg" alt="" width="96" height="96">
    <h1>Nie ma teraz połączenia z internetem</h1>
    <p>
        Kuking potrzebuje internetu, żeby pokazać nowe wpisy.
        Sprawdź, czy masz włączone Wi-Fi albo dane w telefonie, i spróbuj jeszcze raz.
    </p>
    <!--
        Pusty href to adres BIEŻĄCEGO dokumentu, a service worker podaje ten
        ekran pod adresem, który człowiek otwierał (respondWith przy nawigacji).
        „Spróbuj ponownie" ponawia więc ten sam przepis czy wyszukiwanie,
        razem z zapytaniem — bez JavaScriptu (#749). Wcześniej stało tu /home.
    -->
    <p><a href="">Spróbuj ponownie</a></p>
    <p><a class="drugi" href="/home">Przejdź na stronę główną</a></p>
</main>
</body>
</html>
