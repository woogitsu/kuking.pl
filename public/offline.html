<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brak połączenia — Kuking</title>
<style>
    :root { color-scheme: light dark; }
    body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #FAF6F0;
        color: #2B241D;
        font: 18px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
        text-align: center;
    }
    @media (prefers-color-scheme: dark) {
        body { background: #1E1A16; color: #F5EFE6; }
    }
    h1 { font-size: 28px; }
    p { max-width: 34rem; }
    a {
        display: inline-block;
        min-height: 48px;
        padding: 12px 20px;
        border-radius: 12px;
        background: #B3401F;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
    }
</style>
</head>
<body>
<main>
    <img src="/icons/kuking-mark.svg" alt="" width="96" height="96">
    <h1>Nie ma teraz połączenia z internetem</h1>
    <p>
        Kuking potrzebuje internetu, żeby pokazać nowe wpisy.
        Sprawdź, czy masz włączone Wi-Fi albo dane w telefonie, i spróbuj jeszcze raz.
    </p>
    <p><a href="/home">Spróbuj ponownie</a></p>
</main>
</body>
</html>
